<html lang="en">
<head>

<title>Listenly — Knowledge Search: Find the Exact Podcast Answer to Any Question</title>
<meta name="description" content="Ask any question and Listenly finds the exact moment an expert answers it in a podcast — search human expertise, hear the source, go straight to the answer.">

<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Listenly — Knowledge Search">

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "Listenly",
  "url": "https://listenly.fr",
  "description": "B2B podcast directory and knowledge search — find the exact moment an expert answers your question in a podcast."
}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #000000;
    --panel: #1C1C1E;
    --panel-hover: #2C2C2E;
    --ink: #F5F5F7;
    --ink-soft: #86868B;
    --line: rgba(255,255,255,0.12);
    --line-soft: rgba(255,255,255,0.08);
    --accent: #2997FF;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', system-ui, sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    transition: padding-bottom 0.2s ease;
  }
  body.player-active{
    padding-bottom: var(--player-height, 84px);
  }
  :focus-visible{ outline: 2px solid var(--accent); outline-offset: 2px; }

  .ambient-glow{
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .glow-blob{
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    will-change: transform;
  }
  .glow-blob.a{
    width: 460px; height: 460px;
    top: -260px; left: -12%;
    background: rgba(255,255,255,0.30);
    animation: driftA 14s ease-in-out infinite alternate;
  }
  .glow-blob.b{
    width: 380px; height: 380px;
    bottom: -260px; right: -10%;
    background: rgba(255,255,255,0.24);
    animation: driftB 17s ease-in-out infinite alternate;
  }
  .glow-blob.c{
    width: 340px; height: 340px;
    bottom: -240px; left: -8%;
    background: rgba(255,255,255,0.20);
    animation: driftC 19s ease-in-out infinite alternate;
  }
  .glow-blob.d{
    width: 220px; height: 220px;
    top: -180px; right: -6%;
    background: rgba(255,255,255,0.16);
    animation: driftD 15s ease-in-out infinite alternate;
  }
  @keyframes driftA{
    0% { transform: translate(0,0) scale(1); }
    100% { transform: translate(160px,120px) scale(1.35); }
  }
  @keyframes driftB{
    0% { transform: translate(0,0) scale(1); }
    100% { transform: translate(-150px,-100px) scale(0.75); }
  }
  @keyframes driftC{
    0% { transform: translate(0,0) scale(1); }
    100% { transform: translate(130px,-140px) scale(1.3); }
  }
  @keyframes driftD{
    0% { transform: translate(0,0) scale(1); }
    100% { transform: translate(-110px,90px) scale(1.25); }
  }
  @media (prefers-reduced-motion: reduce){
    .glow-blob{ animation: none; }
  }

  .hero, .results-wrap, .player-bar{
    position: relative;
    z-index: 1;
  }

  /* ---------- hero ---------- */
  .hero{
    padding: 15vh 24px 40px;
    text-align: center;
  }
  .hero-content{ max-width: 680px; margin: 0 auto; }

  h1{
    font-family: inherit;
    font-weight: 600;
    font-size: clamp(34px, 5.4vw, 56px);
    line-height: 1.1;
    letter-spacing: -0.015em;
    margin: 0 0 20px;
    color: var(--ink);
  }

  h1 .circled{
    display: inline-block;
    border: 1.5px solid rgba(245,245,247,0.4);
    border-radius: 16px;
    padding: 0 12px;
  }

  h1 .underline{
    text-decoration: underline;
    text-decoration-color: rgba(245,245,247,0.45);
    text-decoration-thickness: 2px;
    text-underline-offset: 8px;
  }

  .sub{
    font-size: 18px;
    line-height: 1.5;
    color: var(--ink-soft);
    max-width: 480px;
    margin: 0 auto 40px;
    font-weight: 400;
  }

  /* ---------- search ---------- */
  .search-shell{
    max-width: 600px;
    margin: 0 auto;
    background: var(--panel);
    border: 1px solid var(--line-soft);
    border-radius: 20px;
    overflow: hidden;
  }
  .search-box{
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 6px 6px 20px;
  }
  .search-box svg{ flex-shrink: 0; color: var(--ink-soft); }
  .input-wrap{
    flex: 1;
    min-width: 0;
    position: relative;
  }
  .search-box input{
    width: 100%;
    background: none;
    border: none;
    outline: none;
    color: var(--ink);
    font-family: inherit;
    font-size: 16px;
    padding: 15px 0;
  }
  .search-box input::placeholder{ color: var(--ink-soft); }
  .placeholder-cycle{
    position: absolute;
    left: 0; top: 50%;
    transform: translateY(-50%);
    color: var(--ink-soft);
    font-family: inherit;
    font-size: 16px;
    white-space: nowrap;
    overflow: hidden;
    max-width: 100%;
    pointer-events: none;
    opacity: 1;
    transition: opacity 0.4s ease;
  }
  .placeholder-cycle.fade{ opacity: 0; }
  .placeholder-cycle.hidden{ display: none; }
  .search-box button{
    flex-shrink: 0;
    height: 40px;
    padding: 0 20px;
    border-radius: 999px;
    border: none;
    background: var(--ink);
    color: #000000;
    font-family: inherit;
    font-size: 14.5px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  .search-box button:hover{ opacity: 0.85; }
  .search-box button:disabled{ background: var(--panel-hover); color: var(--ink-soft); cursor: default; opacity: 1; }

  /* ---------- podcast progress (au-dessus du titre) ---------- */
  .podcast-progress{
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    font-weight: 500;
    letter-spacing: 0.02em;
    color: var(--ink-soft);
    background: var(--panel);
    border: 1px solid var(--line-soft);
    border-radius: 999px;
    padding: 6px 14px;
    margin-bottom: 22px;
  }
  .podcast-progress strong{
    color: var(--ink);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    min-width: 1ch;
    display: inline-block;
  }
  .podcast-progress .goal{ color: var(--ink-soft); }

  /* ---------- available questions count ---------- */
  .avail-count{
    margin-top: 28px;
    font-size: 13.5px;
    color: var(--ink-soft);
    opacity: 0.85;
    text-align: center;
  }
  .avail-count strong{ color: var(--ink); font-weight: 600; }
  .avail-count .dot{
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #34C759;
    margin-right: 7px;
    vertical-align: middle;
  }

  /* ---------- results ---------- */
  .results-wrap{
    max-width: 640px;
    margin: 0 auto;
    padding: 8px 24px 110px;
  }
  .state-msg{
    text-align: center;
    color: var(--ink-soft);
    font-size: 14.5px;
    padding: 44px 0;
  }
  .result-card{
    background: var(--panel);
    border: 1px solid var(--line-soft);
    border-radius: 16px;
    padding: 24px 24px;
    margin-top: 12px;
    text-align: left;
  }
  .result-card .rc-question{
    font-family: inherit;
    font-size: 17px;
    font-weight: 600;
    margin: 0 0 8px;
    line-height: 1.4;
    color: var(--ink);
  }
  .result-card .rc-excerpt{
    font-size: 14.5px;
    line-height: 1.6;
    color: var(--ink-soft);
    margin: 0 0 16px;
  }
  .result-card .rc-meta{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .result-card .rc-source{
    font-size: 13px;
    color: var(--ink-soft);
  }
  .result-card .rc-source strong{ color: var(--ink); font-weight: 500; }
  .rc-play{
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: none;
    border: none;
    color: var(--accent);
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 500;
    padding: 0;
    cursor: pointer;
    white-space: nowrap;
  }
  .rc-play:hover{ opacity: 0.75; }
  .rc-play.loading{ opacity: 0.6; pointer-events: none; }

  /* ---------- player : vrai lecteur style app ---------- */
  .player-bar{
    position: fixed;
    left: 0; right: 0;
    bottom: 0; /* desktop : colle en bas, pas de barre de nav du site a eviter */
    background: rgba(20,20,22,0.92);
    backdrop-filter: blur(24px) saturate(1.5);
    -webkit-backdrop-filter: blur(24px) saturate(1.5);
    border-top: 1px solid var(--line-soft);
    padding: 14px 24px calc(14px + env(safe-area-inset-bottom, 0px));
    display: none;
    align-items: center;
    gap: 18px;
    z-index: 10;
    box-shadow: 0 -8px 32px rgba(0,0,0,0.35);
  }
  .player-bar.active{ display: flex; }

  .pb-art{
    width: 52px; height: 52px;
    border-radius: 10px;
    flex-shrink: 0;
    background: linear-gradient(135deg, #2997FF, #6b5bff);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 14px rgba(0,0,0,0.35);
  }
  .pb-art svg{ width: 22px; height: 22px; color: #fff; opacity: 0.9; }

  .pb-info{ flex: 0 0 auto; min-width: 0; max-width: 220px; }
  .pb-title{ font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink); }
  .pb-sub{ font-size: 12px; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }

  .pb-controls{
    display: flex;
    align-items: center;
    gap: 14px;
    flex-shrink: 0;
  }
  .pb-btn{
    background: none;
    border: none;
    cursor: pointer;
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    opacity: 0.85;
    transition: opacity 0.15s, transform 0.1s;
  }
  .pb-btn:hover{ opacity: 1; }
  .pb-btn:active{ transform: scale(0.92); }
  .pb-btn.play{
    width: 34px; height: 34px;
    border-radius: 50%;
    background: var(--ink);
    color: #000;
    opacity: 1;
  }
  .pb-btn.play:hover{ opacity: 0.85; }
  .pb-btn.skip svg{ width: 18px; height: 18px; }
  .pb-btn.play svg{ width: 15px; height: 15px; }

  .pb-progress-wrap{
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .pb-time{
    font-size: 11px;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
    width: 36px;
    flex-shrink: 0;
  }
  .pb-time.end{ text-align: right; }
  .pb-bar{
    flex: 1;
    position: relative;
    height: 14px;
    display: flex;
    align-items: center;
    cursor: pointer;
  }
  .pb-bar-track{
    width: 100%;
    height: 4px;
    border-radius: 2px;
    background: rgba(255,255,255,0.15);
    position: relative;
    overflow: hidden;
  }
  .pb-bar-fill{
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 0%;
    background: var(--accent);
    border-radius: 2px;
    transition: width 0.05s linear;
  }
  .pb-bar-handle{
    position: absolute;
    top: 50%;
    width: 11px; height: 11px;
    border-radius: 50%;
    background: #fff;
    transform: translate(-50%,-50%);
    left: 0%;
    box-shadow: 0 1px 4px rgba(0,0,0,0.4);
    opacity: 0;
    transition: opacity 0.15s;
  }
  .pb-bar:hover .pb-bar-handle{ opacity: 1; }

  .pb-close{
    flex-shrink: 0;
    background: none;
    border: none;
    color: var(--ink-soft);
    cursor: pointer;
    padding: 4px;
    display: flex;
  }
  .pb-close:hover{ color: var(--ink); }
  .pb-close svg{ width: 16px; height: 16px; }

  @media (max-width: 700px){
    .pb-info{ display: none; }
    .player-bar{
      gap: 12px;
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
      bottom: 64px; /* mobile : decale au-dessus de la barre de navigation
                       du site (Home/Search/Menu/Library) -- valeur generique
                       de securite, a ajuster avec la vraie hauteur mesuree */
      border-bottom: 1px solid var(--line-soft);
    }
  }

  @media (max-width: 560px){
    .hero{ padding: 8vh 18px 32px; }
    .search-box{ padding-left: 14px; gap: 6px; }
    .search-box button{ padding: 0 14px; font-size: 13.5px; }
    .results-wrap{ padding: 8px 18px 110px; }
  }
</style>
</head>
<body>

<div class="ambient-glow">
  <div class="glow-blob a"></div>
  <div class="glow-blob b"></div>
  <div class="glow-blob c"></div>
  <div class="glow-blob d"></div>
</div>

<main>
<section class="hero">
  <div class="hero-content">
    <div class="podcast-progress" id="podcastProgress"><strong id="podcastProgressNum">0</strong> podcasts indexed <span class="goal">/ 3.2M</span></div>
    <h1>Whatever <span class="circled">your question</span> is, an <span class="underline">expert already answered it</span> in a podcast.</h1>
    <p class="sub">Search human expertise. Hear the source. Go straight to the answer.</p>

    <div class="search-shell">
      <form class="search-box" id="searchForm">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <div class="input-wrap">
          <input type="text" id="searchInput" placeholder="Ask anything..." autocomplete="off" maxlength="240">
          <span class="placeholder-cycle" id="placeholderCycle" aria-hidden="true">Ask anything...</span>
        </div>
        <button type="submit" id="searchBtn">Search</button>
      </form>
    </div>

    <div class="avail-count" id="availCount"><span class="dot"></span><strong>—</strong> questions searchable right now</div>

  </div>
</section>

<div class="results-wrap" id="resultsWrap"></div>
</main>

<div class="player-bar" id="playerBar">
  <div class="pb-art">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
  </div>
  <div class="pb-info">
    <div class="pb-title" id="pbTitle">—</div>
    <div class="pb-sub" id="pbSub">—</div>
  </div>
  <div class="pb-controls">
    <button class="pb-btn skip" id="pbBack" title="Back 10s" aria-label="Back 10 seconds">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
    </button>
    <button class="pb-btn play" id="pbPlayPause" aria-label="Play or pause">
      <svg id="pbPlayIcon" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 3 20 12 6 21 6 3"/></svg>
      <svg id="pbPauseIcon" viewBox="0 0 24 24" fill="currentColor" style="display:none;"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
    </button>
    <button class="pb-btn skip" id="pbFwd" title="Forward 10s" aria-label="Forward 10 seconds">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
    </button>
  </div>
  <div class="pb-progress-wrap">
    <span class="pb-time" id="pbCurrent">0:00</span>
    <div class="pb-bar" id="pbBar">
      <div class="pb-bar-track">
        <div class="pb-bar-fill" id="pbFill"></div>
      </div>
      <div class="pb-bar-handle" id="pbHandle"></div>
    </div>
    <span class="pb-time end" id="pbDuration">0:00</span>
  </div>
  <button class="pb-close" id="pbClose" aria-label="Close player">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
  </button>
  <audio id="pbAudio"></audio>
</div>

<script>
  const SEARCH_ENDPOINT = 'https://listenly.fr/api/listenly-search.php';
  const COUNT_ENDPOINT = 'https://listenly.fr/api/listenly-count.php';
  const PODCAST_COUNT_ENDPOINT = 'https://listenly.fr/api/podcast-count.php';
  // Replis si les endpoints ne sont pas encore deployes / indisponibles --
  // a mettre a jour manuellement de temps en temps en attendant.
  const FALLBACK_COUNT = 2421;
  const FALLBACK_PODCAST_COUNT = 103;

  const form = document.getElementById('searchForm');
  const input = document.getElementById('searchInput');
  const btn = document.getElementById('searchBtn');
  const resultsWrap = document.getElementById('resultsWrap');

  // Rotating placeholder — purely decorative, never touches input.value
  const placeholderCycle = document.getElementById('placeholderCycle');
  const placeholderPhrases = [
    'Ask anything...',
    'How do I find my first customers?',
    'Why do we dream?',
    'How can we reverse climate change?'
  ];
  const reducesMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let placeholderIndex = 0;
  let placeholderTimer = null;

  function stopPlaceholderCycle(){
    if (placeholderTimer) clearInterval(placeholderTimer);
    placeholderTimer = null;
    placeholderCycle.classList.add('hidden');
  }

  if (placeholderCycle && !reducesMotion) {
    input.setAttribute('placeholder', '');
    placeholderTimer = setInterval(() => {
      placeholderCycle.classList.add('fade');
      setTimeout(() => {
        placeholderIndex = (placeholderIndex + 1) % placeholderPhrases.length;
        placeholderCycle.textContent = placeholderPhrases[placeholderIndex];
        placeholderCycle.classList.remove('fade');
      }, 400);
    }, 3000);
    input.addEventListener('focus', stopPlaceholderCycle, { once: true });
    input.addEventListener('input', () => { if (input.value) stopPlaceholderCycle(); });
  }

  // Anime un compteur de 0 jusqu'a targetValue (respecte prefers-reduced-motion :
  // affiche directement la valeur finale dans ce cas).
  function animateCount(el, targetValue, duration = 1400){
    if (reducesMotion) {
      el.textContent = targetValue.toLocaleString('en-US');
      return;
    }
    const start = performance.now();
    function tick(now){
      const progress = Math.min((now - start) / duration, 1);
      const eased = 1 - Math.pow(1 - progress, 3);
      const current = Math.round(eased * targetValue);
      el.textContent = current.toLocaleString('en-US');
      if (progress < 1) {
        requestAnimationFrame(tick);
      } else {
        el.textContent = targetValue.toLocaleString('en-US');
      }
    }
    requestAnimationFrame(tick);
  }

  // Charge le nombre de questions disponibles en direct depuis la base --
  // repli silencieux sur FALLBACK_COUNT si l'endpoint echoue.
  async function loadAvailableCount(){
    const el = document.getElementById('availCount');
    const strong = el.querySelector('strong');
    try {
      const res = await fetch(COUNT_ENDPOINT, { cache: 'no-store' });
      const data = await res.json();
      if (typeof data.count === 'number') {
        strong.textContent = data.count.toLocaleString('en-US');
        return;
      }
      throw new Error('no count');
    } catch (e) {
      strong.textContent = FALLBACK_COUNT.toLocaleString('en-US') + '+';
    }
  }
  loadAvailableCount();

  // Charge le nombre de podcasts indexes en direct et anime le compteur de 0
  // jusqu'a cette valeur -- repli (aussi anime) sur FALLBACK_PODCAST_COUNT si
  // l'endpoint echoue.
  async function loadPodcastProgress(){
    const numEl = document.getElementById('podcastProgressNum');
    try {
      const res = await fetch(PODCAST_COUNT_ENDPOINT, { cache: 'no-store' });
      const data = await res.json();
      if (typeof data.count === 'number') {
        animateCount(numEl, data.count);
        return;
      }
      throw new Error('no count');
    } catch (e) {
      animateCount(numEl, FALLBACK_PODCAST_COUNT);
    }
  }
  loadPodcastProgress();

  function fmtTime(s){
    const m = Math.floor(s / 60);
    const sec = Math.floor(s % 60);
    return m + ':' + String(sec).padStart(2, '0');
  }

  function renderResults(results){
    if (!results || results.length === 0) {
      resultsWrap.innerHTML = '<div class="state-msg">No matching answer found yet. Try rephrasing your question.</div>';
      return;
    }
    resultsWrap.innerHTML = results.map((r, i) => `
      <div class="result-card">
        <p class="rc-question">${escapeHtml(r.question)}</p>
        <p class="rc-excerpt">${escapeHtml(r.excerpt || '')}</p>
        <div class="rc-meta">
          <span class="rc-source"><strong>${escapeHtml(r.expert || 'Unknown')}</strong> on ${escapeHtml(r.podcast)}</span>
          <span style="display:inline-flex;gap:14px;align-items:center;">
            ${r.episode_url ? `<a href="${escapeHtml(r.episode_url)}" target="_blank" rel="noopener" class="rc-play" style="text-decoration:none;">Episode page →</a>` : ''}
            <button class="rc-play" data-idx="${i}">▶ Listen at ${fmtTime(r.start_seconds)}</button>
          </span>
        </div>
      </div>
    `).join('');

    resultsWrap.querySelectorAll('.rc-play').forEach(playBtn => {
      playBtn.addEventListener('click', () => {
        const r = results[playBtn.dataset.idx];
        playAnswer(r, playBtn);
      });
    });
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  const playerBar = document.getElementById('playerBar');
  const pbAudio = document.getElementById('pbAudio');
  const pbTitle = document.getElementById('pbTitle');
  const pbSub = document.getElementById('pbSub');
  const pbPlayPause = document.getElementById('pbPlayPause');
  const pbPlayIcon = document.getElementById('pbPlayIcon');
  const pbPauseIcon = document.getElementById('pbPauseIcon');
  const pbBack = document.getElementById('pbBack');
  const pbFwd = document.getElementById('pbFwd');
  const pbBar = document.getElementById('pbBar');
  const pbFill = document.getElementById('pbFill');
  const pbHandle = document.getElementById('pbHandle');
  const pbCurrent = document.getElementById('pbCurrent');
  const pbDuration = document.getElementById('pbDuration');
  const pbClose = document.getElementById('pbClose');

  function fmtPbTime(s){
    if (!isFinite(s) || s < 0) s = 0;
    const m = Math.floor(s / 60);
    const sec = Math.floor(s % 60);
    return m + ':' + String(sec).padStart(2, '0');
  }

  function showPlayIcon(){ pbPlayIcon.style.display = ''; pbPauseIcon.style.display = 'none'; }
  function showPauseIcon(){ pbPlayIcon.style.display = 'none'; pbPauseIcon.style.display = ''; }

  pbPlayPause.addEventListener('click', () => {
    if (pbAudio.paused) {
      pbAudio.play().catch(() => {});
    } else {
      pbAudio.pause();
    }
  });
  pbAudio.addEventListener('play', showPauseIcon);
  pbAudio.addEventListener('pause', showPlayIcon);

  pbBack.addEventListener('click', () => {
    pbAudio.currentTime = Math.max(0, pbAudio.currentTime - 10);
  });
  pbFwd.addEventListener('click', () => {
    pbAudio.currentTime = Math.min(pbAudio.duration || Infinity, pbAudio.currentTime + 10);
  });

  pbAudio.addEventListener('timeupdate', () => {
    pbCurrent.textContent = fmtPbTime(pbAudio.currentTime);
    if (pbAudio.duration) {
      const pct = (pbAudio.currentTime / pbAudio.duration) * 100;
      pbFill.style.width = pct + '%';
      pbHandle.style.left = pct + '%';
    }
  });
  pbAudio.addEventListener('loadedmetadata', () => {
    pbDuration.textContent = fmtPbTime(pbAudio.duration);
  });

  let pbSeeking = false;
  function seekFromEvent(clientX){
    const rect = pbBar.getBoundingClientRect();
    const ratio = Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
    if (pbAudio.duration) {
      pbAudio.currentTime = ratio * pbAudio.duration;
    }
  }
  pbBar.addEventListener('mousedown', (e) => {
    pbSeeking = true;
    seekFromEvent(e.clientX);
  });
  window.addEventListener('mousemove', (e) => {
    if (pbSeeking) seekFromEvent(e.clientX);
  });
  window.addEventListener('mouseup', () => { pbSeeking = false; });
  pbBar.addEventListener('touchstart', (e) => {
    pbSeeking = true;
    seekFromEvent(e.touches[0].clientX);
  }, { passive: true });
  pbBar.addEventListener('touchmove', (e) => {
    if (pbSeeking) seekFromEvent(e.touches[0].clientX);
  }, { passive: true });
  pbBar.addEventListener('touchend', () => { pbSeeking = false; });

  pbClose.addEventListener('click', () => {
    pbAudio.pause();
    playerBar.classList.remove('active');
    updatePlayerBodyPadding();
  });

  // Pousse le contenu de la page vers le haut de la hauteur reelle du lecteur
  // (variable selon l'ecran) des qu'il est actif, pour qu'il ne masque jamais
  // le dernier resultat -- important sur mobile ou le lecteur peut aussi
  // chevaucher la barre de navigation gestuelle du telephone.
  function updatePlayerBodyPadding(){
    if (playerBar.classList.contains('active')) {
      // +64px uniquement sur mobile (<=700px) : compense le decalage
      // bottom:64px du lecteur sur cet ecran (evite la barre de nav du site).
      // Sur desktop le lecteur est colle en bas (bottom:0), pas de bonus.
      const mobileOffset = window.innerWidth <= 700 ? 64 : 0;
      document.body.style.setProperty('--player-height', (playerBar.offsetHeight + mobileOffset) + 'px');
      document.body.classList.add('player-active');
    } else {
      document.body.classList.remove('player-active');
    }
  }
  window.addEventListener('resize', updatePlayerBodyPadding);

  function isSafeAudioUrl(url){
    try {
      const u = new URL(url, window.location.href);
      return u.protocol === 'https:' || u.protocol === 'http:';
    } catch (e) {
      return false;
    }
  }

  // playAnswer fait deux choses distinctes, dans l'ordre :
  // Etape 1 -- ouvrir le bon episode : charger la source audio exacte (r.audio_url).
  // Etape 2 -- ouvrir au bon moment : positionner la tete de lecture sur r.start_seconds.
  //
  // Le piege que corrige cette version : regler pbAudio.currentTime juste apres
  // avoir change .src (comme avant) est fait AVANT que le navigateur ait fini de
  // charger les metadonnees audio (duree, plages "seekable") -- sur beaucoup de
  // navigateurs/connexions ce currentTime est silencieusement ignore, remis a 0.
  // On attend donc l'evenement 'loadedmetadata' avant de positionner le curseur.
  function playAnswer(r, triggerBtn){
    if (!isSafeAudioUrl(r.audio_url)) {
      resultsWrap.insertAdjacentHTML('afterbegin', '<div class="state-msg">This audio source could not be played.</div>');
      return;
    }

    if (triggerBtn) triggerBtn.classList.add('loading');

    pbAudio.pause();
    pbAudio.removeAttribute('src');
    pbAudio.load();

    function onReady(){
      pbAudio.currentTime = r.start_seconds;
      pbAudio.play().catch(() => {
        // Lecture auto bloquee par le navigateur (rare) -- le curseur est deja
        // au bon endroit, l'utilisateur n'a plus qu'a cliquer play manuellement.
      });
      pbAudio.removeEventListener('loadedmetadata', onReady);
      pbAudio.removeEventListener('error', onError);
      if (triggerBtn) triggerBtn.classList.remove('loading');
    }
    function onError(){
      pbAudio.removeEventListener('loadedmetadata', onReady);
      pbAudio.removeEventListener('error', onError);
      if (triggerBtn) triggerBtn.classList.remove('loading');
      resultsWrap.insertAdjacentHTML('afterbegin', '<div class="state-msg">This audio source could not be played.</div>');
    }
    pbAudio.addEventListener('loadedmetadata', onReady);
    pbAudio.addEventListener('error', onError);

    pbTitle.textContent = r.episode;
    pbSub.textContent = (r.expert || 'Unknown') + ' on ' + r.podcast;
    playerBar.classList.add('active');
    updatePlayerBodyPadding();
    pbAudio.src = r.audio_url;
    pbAudio.load();
  }

  async function runSearch(rawQuestion){
    const question = rawQuestion.trim();
    if (!question) return;
    btn.disabled = true;
    resultsWrap.innerHTML = '<div class="state-msg">Searching across podcasts…</div>';
    try {
      const res = await fetch(SEARCH_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question })
      });
      const data = await res.json();
      if (data.error) {
        resultsWrap.innerHTML = '<div class="state-msg">Something went wrong. Please try again.</div>';
        return;
      }
      renderResults(data.results);
    } catch (e) {
      resultsWrap.innerHTML = '<div class="state-msg">Could not reach the search service. Please try again.</div>';
    } finally {
      btn.disabled = false;
    }
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    runSearch(input.value);
  });
</script>
  <script src="/podcast-btb/deeplink.js"></script>
</body>
