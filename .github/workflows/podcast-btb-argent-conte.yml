          PODCAST_RAW_INFO: |-
            Argent conté
            
            Bonjour, je suis Caroline Lamaud et je vous présente Argent Conté, un podcast qui vise à vous raconter toutes les facettes du patrimoine, de l’investissement et de l’épargne avec une approche décomplexée pour enfin s’intéresser à son argent sans peur et sans tabous.  L’investissement ça vous parait moyennement excitant ? Je vous comprends. Pourtant c’est quand on connait sur le bout des doigts les bonnes pratiques et les bonnes idées qu’on commence à faire travailler son argent pour satisfaire ses objectifs de vie.  Pourquoi je vous parle de ça ? Parce que j’ai créé il y a 8 ans, une plateforme d’investissement d’un nouveau genre : Anaxago. L’idée était de donner accès à l’investissement dans des opportunités uniques et performantes pour tout le monde. 8 ans plus tard nous avons plus de 100 000 membres investisseurs et presque autant de conseils donnés et d’interrogations racontées.  Le point commun ? La peur de se tromper, de perdre son argent, ou encore de rater des occasions en or. C’est pour ça que je lance Argent Conté, parce qu’il est temps de changer et de lever tabous et angoisses, pour vous livrer à la fois les conseils des meilleurs experts, leurs meilleures pratiques et leurs bonnes idées, mais aussi explorer les biais cognitifs et les craintes liés de tout temps à l’argent.  Merci d'écouter Argent Conté ! Vous pouvez me joindre à l'adresse caroline@argentconte.com pour toute question ou idée, ou sur Anaxago.com si vous avez besoin de conseils ! Hébergé par Ausha. Visitez ausha.co/fr/politique-de-confidentialite pour plus d'informations.
            
            (Copyright : Caroline Lamaud)
            
