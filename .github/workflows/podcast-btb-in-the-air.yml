name: Podcast BTB — in-the-air

on:
  workflow_dispatch:
  schedule:
    - cron: '0 13 * * 1'

jobs:
  podcast-btb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer ffmpeg (necessaire pour compression audio Whisper)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Generation fiche podcast
        if: github.event_name == 'workflow_dispatch'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RSS_URL: |-
            https://feeds.acast.com/public/shows/6797e49c673aa382e1fc945e
          PODCAST_URL: |-
            https://open.spotify.com/show/1cn0RpCzxpQl4t0tNt7z4R
          LISTENLY_URL: |-
            https://listenly.fr/podcast/show/in-the-air
          COVER_IMAGE: |-
            https://i.postimg.cc/NFvrFHcF/1738103532009-0e6e364b-6057-4f10-a16c-4ad93d8a6f23.jpg
          PODCAST_SLUG: |-
            in-the-air
          ACCENT_COLOR: |-
            #2e8bd6
          LANGUAGE: |-
            fr
          EPISODE_CTA_TARGET: |-
            listenly
        run: python automation/scripts/generate_podcast_btb.py

      - name: Generation 1 fiche episode max
        if: github.event_name == 'schedule'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PODCAST_SLUG: |-
            in-the-air
          MAX_EPISODES: '1'
          USE_TRANSCRIPT: 'true'
        run: python automation/scripts/generate_episode_fiches_btb.py

      - name: Commit fiches
        run: |
          git config user.name  "listenly-bot"
          git config user.email "bot@listenly.fr"
          git pull --rebase --autostash origin main
          git add pages/podcast-btb/
          if git diff --staged --quiet; then
            echo "Rien de nouveau."
          else
            git commit -m "Auto: podcast-btb in-the-air"
            git push
          fi

      - name: Deploy FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:    ${{ secrets.FTP_SERVER }}
          username:  ${{ secrets.FTP_USERNAME }}
          password:  ${{ secrets.FTP_PASSWORD }}
          local-dir: ./pages/podcast-btb/
          server-dir: /listenly.fr/podcast-btb/
          exclude: |
            **/.git*
            **/.git*/**
            **/.gitkeep
