            			<enclosure url="https://anchor.fm/s/107d015e4/podcast/play/121875056/https%3A%2F%2Fd3ctxlq1ktw2nl.cloudfront.net%2Fstaging%2F2026-5-23%2F426670149-44100-2-accc497ddde5f.mp3" length="16676570" type="audio/mpeg"/>
            			<itunes:summary>&lt;p&gt;&lt;strong&gt;Derrière l’idée séduisante de la holding se cachent des enjeux fiscaux, financiers et patrimoniaux souvent méconnus. &lt;/strong&gt;Présentée comme l’outil incontournable du dirigeant, la holding peut pourtant s’avérer inadaptée selon la structure, les projets ou l’horizon patrimonial.&lt;strong&gt;François Louarn &lt;/strong&gt;reçoit&lt;strong&gt; Alexandre Boutin&lt;/strong&gt; pour éclairer les enjeux stratégiques de la société holding.&lt;br&gt;Un échange pour maîtriser ses véritables usages, ses limites et ses conditions de pertinence pour accompagner votre clientèle de dirigeants.Retrouvez Alexandre Boutin sur LinkedIn : &lt;a href=&quot;https://www.youtube.com/redirect?
        run: python automation/scripts/generate_podcast_btb.py

      - name: Generation 1 fiche episode max (cron hebdomadaire uniquement, jamais au lancement manuel)
        if: github.event_name == 'schedule'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PODCAST_SLUG: |-
            declic
          MAX_EPISODES: '1'
        run: python automation/scripts/generate_episode_fiches_btb.py

      - name: Commit fiches
        run: |
          git config user.name  "listenly-bot"
          git config user.email "bot@listenly.fr"
          git pull --rebase --autostash origin main
          git add pages/podcast-btb/
          if git diff --staged --quiet; then
            echo "Rien de nouveau."
          else
            git commit -m "Auto: podcast-btb declic"
            git push
          fi

      - name: Deploy FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:    ${{ secrets.FTP_SERVER }}
          username:  ${{ secrets.FTP_USERNAME }}
          password:  ${{ secrets.FTP_PASSWORD }}
          local-dir: ./pages/podcast-btb/
          server-dir: /listenly.fr/podcast-btb/
          exclude: |
            **/.git*
            **/.git*/**
            **/.gitkeep
