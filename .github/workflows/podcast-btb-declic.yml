            		<itunes:image href="https://d3t3ozftmdmh3i.cloudfront.net/staging/podcast_uploaded_nologo/44160449/44160449-1772189778980-d90b81a10186c.jpg"/>
            		<item>
            			<title><![CDATA[ La société holding n'est pas qu'une mode sur Insta ou Tiktok !]]></title>
            			<description><![CDATA[<p><strong>Derrière l’idée séduisante de la holding se cachent des enjeux fiscaux, financiers et patrimoniaux souvent méconnus. </strong>Présentée comme l’outil incontournable du dirigeant, la holding peut pourtant s’avérer inadaptée selon la structure, les projets ou l’horizon patrimonial.<strong>François Louarn </strong>reçoit<strong> Alexandre Boutin</strong> pour éclairer les enjeux stratégiques de la société holding.<br>Un échange pour maîtriser ses véritables usages, ses limites et ses conditions de pertinence pour accompagner votre clientèle de dirigeants.Retrouvez Alexandre Boutin sur LinkedIn : <a href="https://www.youtube.com/redirect?event=video_description&redir_token=QUFFLUhqa3ozSTdWckRLMHN3VEtMWU94UVpvOW01ek5mQXxBQ3Jtc0ttM0dudWYzUzgyTVZSajFPUW1OZGpWNmx3OVFqUE1VWjJnREJRRmVNbVRoc09ScWxRSll0eFpSendaTDVET2NFTmxrNXBRdnJxWG1tbllaYXZlazdMQ0xsaGYwNEJydW9EalQzMmtBaTA4UVg1WE11QQ&q=https%3A%2F%2Fwww.linkedin.com%2Fin%2Falexandre-boutin0582%2F&v=QO2MjTIqXW0" target="_blank" rel="nofollow">  / alexandre-boutin0582  </a>👉 Abonnez-vous pour suivre les prochains épisodes Déclic et ne rien manquer des tendances et bonnes pratiques en gestion de patrimoine !____ 👥 Retrouvez La Financière d’Orion sur LinkedIn :   <a href="https://www.youtube.com/redirect?event=video_description&redir_token=QUFFLUhqbVQwQmFkaUNrUC1IV1BMTjg3OGU1elJ4Q3NYd3xBQ3Jtc0tuMlNQRDJoOS05STRTMGcxUzdHcmVfRTZDR2tLUHVrTHVBaVQ0a05ESThFN001ODJHQkY5OVY4ZVdJMEVpbE92OTA4T1h3VjJYNEllWXJBalVJVm5faWRPal80WmM4SnpEbnRXdVhhUzFZSnZ4bzBlTQ&q=https%3A%2F%2Fwww.linkedin.com%2Fcompany%2Fla-financiere-dorion%2F&v=QO2MjTIqXW0" target="_blank" rel="nofollow">  / la-financiere-dorion  </a>____ 🔎 Pour découvrir La Financière d&#39;Orion en détails, rendez-vous juste ici : <a href="https://www.lafinancieredorion.fr/?utm_source=Podcast&utm_medium=description&utm_campaign=EPISODE+6&utm_id=DECLIC" target="_blank" rel="noopener noreferer">Groupement de CGP national - site internet</a></p>
            ]]></description>
