name: Podcast BTB — declic

on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * 5'

jobs:
  podcast-btb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generation fiche podcast (lancement manuel uniquement)
        if: github.event_name == 'workflow_dispatch'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PODCAST_URL: |-
            https://podcasts.apple.com/fr/podcast/d%C3%A9clic/id1884271654
          CONTACT_URL: |-
            https://listenly.fr/podcast/show/la-financire-dorion
          CONTACT_LABEL: |-
            le podcast
          LISTENLY_URL: |-
            La financière d'Orion
          COVER_IMAGE: |-
            https://i.postimg.cc/CLQ3WQzc/540x540bb.webp
          RSS_URL: |-
            https://anchor.fm/s/107d015e4/podcast/rss
          PODCAST_SLUG: |-
            declic
          ACCENT_COLOR: |-
            #2e8bd6
          PODCAST_RAW_INFO: |-
            <?xml version="1.0" encoding="UTF-8"?><rss xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:content="http://purl.org/rss/1.0/modules/content/" xmlns:atom="http://www.w3.org/2005/Atom" version="2.0" xmlns:anchor="https://anchor.fm/xmlns" xmlns:podcast="https://podcastindex.org/namespace/1.0" xmlns:itunes="http://www.itunes.com/dtds/podcast-1.0.dtd" xmlns:psc="http://podlove.org/simple-chapters">
            	<channel>
            		<title><![CDATA[Déclic]]></title>
            		<description><![CDATA[Déclic est la chaîne de référence pour les professionnels de la gestion de patrimoine, les CGP et les clients finaux qui souhaitent approfondir leur expertise. 
            Portée par La Financière d’Orion, elle explore les enjeux techniques, stratégiques et réglementaires, les stratégies patrimoniales avancées, les placements financiers, et les tendances du secteur, avec les retours d’experts reconnus. 
            Animée par François Louarn, la chaîne s’adresse à tous ceux qui veulent approfondir leur pratique et élargir leur vision du conseil patrimonial.]]></description>
            		<link>https://www.lafinancieredorion.fr/</link>
