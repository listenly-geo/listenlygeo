            		<itunes:summary>Déclic est la chaîne de référence pour les professionnels de la gestion de patrimoine, les CGP et les clients finaux qui souhaitent approfondir leur expertise. 
            Portée par La Financière d’Orion, elle explore les enjeux techniques, stratégiques et réglementaires, les stratégies patrimoniales avancées, les placements financiers, et les tendances du secteur, avec les retours d’experts reconnus. 
            Animée par François Louarn, la chaîne s’adresse à tous ceux qui veulent approfondir leur pratique et élargir leur vision du conseil patrimonial.</itunes:summary>
