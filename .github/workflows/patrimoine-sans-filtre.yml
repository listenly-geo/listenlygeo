name: "patrimoine-sans-filtre — N1 + N2 auto"

on:
  schedule:
    - cron: '0 11 * * 2,5'
  workflow_dispatch:
    inputs:
      max_new:
        description: 'Nb fiches episode a generer'
        required: false
        default: '1'
      seed_only:
        description: 'true = amorcage sans generation'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:

  fiche-n1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generation fiche N1 si absente
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PODCAST_SLUG: patrimoine-sans-filtre
          SPOTIFY_SHOW_URL: https://open.spotify.com/show/033vQ8gTXR3N8kIiCHE65p
          PODCAST_IMAGE_URL: https://i.postimg.cc/59PgmW5X/500x500-000000-80-0-0.jpg
          LISTENLY_SHOW_URL: https://listenly.fr/podcast/show/patrimoine-sans-filtre-patrimoine-sans-filtre
          PLAUSIBLE_DOMAIN: listenly.fr
          PODCAST_RAW_INFO: |
            Patrimoine sans filtre Comprendre l"économie, anticiper les évolutions patrimoniales et décrypter les grandes tendances qui façonnent notre avenir : telle est l"ambition du podcast du Groupe Astoria. À travers des échanges avec des professionnels du secteur, des dirigeants d"entreprise, des entrepreneurs et des experts reconnus, chaque épisode apporte un éclairage concret sur les enjeux économiques, financiers, fiscaux et patrimoniaux qui impactent les particuliers, les familles et les chefs d"entreprise. Sans jargon inutile et avec une approche résolument pédagogique, nos invités partagent le
        run: python automation/scripts/generate_n1.py
      - name: Commit fiche N1
        run: |
          git config user.name "listenly-bot"
          git config user.email "bot@listenly.fr"
          git pull --rebase --autostash origin main
          git add pages/
          if git diff --staged --quiet; then
            echo "N1 deja presente."
          else
            git commit -m "Auto: fiche N1 patrimoine-sans-filtre"
            git push
          fi
      - name: Deploy FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./pages/
          server-dir: /listenly.fr/fiche-geo-ia/
          exclude: |
            **/.git*
            **/.git*/**
            **/.gitkeep

  fiches-n2:
    runs-on: ubuntu-latest
    needs: fiche-n1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generation fiches episodes N2
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RSS_URL: https://feed.ausha.co/n2wAXCE7AWXO
          PODCAST_SLUG: patrimoine-sans-filtre
          SPOTIFY_SHOW_URL: https://open.spotify.com/show/033vQ8gTXR3N8kIiCHE65p
          CTA_URL: https://listenly.fr/podcast/show/patrimoine-sans-filtre-patrimoine-sans-filtre
          CTA_LABEL: Ecouter le podcast
          PODCAST_IMAGE_URL: https://i.postimg.cc/59PgmW5X/500x500-000000-80-0-0.jpg
          PLAUSIBLE_DOMAIN: listenly.fr
          MAX_NEW_PER_RUN: ${{ github.event.inputs.max_new || '1' }}
          SEED_ONLY: ${{ github.event.inputs.seed_only || 'false' }}
        run: python automation/scripts/generate_episode_fiches.py
      - name: Commit fiches N2
        run: |
          git config user.name "listenly-bot"
          git config user.email "bot@listenly.fr"
          git pull --rebase --autostash origin main
          git add pages/ automation/processed_episodes_patrimoine-sans-filtre.json
          if git diff --staged --quiet; then
            echo "Aucune nouvelle fiche."
          else
            git commit -m "Auto: fiches episodes patrimoine-sans-filtre"
            git push
          fi
      - name: Deploy FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./pages/
          server-dir: /listenly.fr/fiche-geo-ia/
          exclude: |
            **/.git*
            **/.git*/**
            **/.gitkeep
