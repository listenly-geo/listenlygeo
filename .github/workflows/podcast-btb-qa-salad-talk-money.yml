name: Podcast BTB Trafic — salad-talk-money

on:
  workflow_dispatch:

jobs:
  podcast-btb-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verifier si la fiche podcast N1 existe deja
        id: check_n1
        run: |
          if [ -f "pages/podcast-btb/salad-talk-money-podcast.html" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generation fiche podcast N1 (une seule fois, a la creation)
        if: steps.check_n1.outputs.exists == 'false'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RSS_URL: |-
            https://responsiblefinance.libsyn.com/rss
          PODCAST_URL: |-
            https://open.spotify.com/show/6ECLpZUIPJDBB9TMW3Vxsh
          LISTENLY_URL: |-
            https://listenly.fr/podcast/show/salad-talk-money
          COVER_IMAGE: |-
            https://i.postimg.cc/T3vMWz0z/images.jpg
          PODCAST_SLUG: |-
            salad-talk-money
          ACCENT_COLOR: |-
            #2e8bd6
          LANGUAGE: |-
            en
          EPISODE_CTA_TARGET: |-
            spotify
        run: python automation/scripts/generate_podcast_btb.py

      - name: Regenerer le dashboard (visibilite immediate, meme avant le 1er N2)
        if: steps.check_n1.outputs.existed_before == 'false' || steps.check_n1.outputs.exists == 'false'
        run: python automation/scripts/rebuild_dashboard.py

      - name: Installer ffmpeg (necessaire pour compression audio Whisper - N2 uniquement)
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: Generation fiche question N2 (a chaque run, cron quotidien ou manuel)
        if: github.event_name == 'workflow_dispatch' && steps.check_n1.outputs.exists == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PODCAST_SLUG: |-
            salad-talk-money
        run: python automation/scripts/generate_qa_fiches_btb.py

      - name: Commit fiches
        if: always()
        run: |
          git config user.name  "listenly-bot"
          git config user.email "bot@listenly.fr"
          git add pages/podcast-btb/
          if git diff --staged --quiet; then
            echo "Rien de nouveau."
          else
            git commit -m "Auto: podcast-btb-qa salad-talk-money"
            git fetch origin main
            if ! git rebase origin/main; then
              echo "::error::Conflit lors du rebase - abandon pour ne pas corrompre le depot. Relance le workflow (le run concurrent a normalement fini)."
              git rebase --abort
              exit 1
            fi
            if grep -rq "^<<<<<<< \|^=======$\|^>>>>>>> " pages/podcast-btb/ 2>/dev/null; then
              echo "::error::Marqueurs de conflit detectes apres rebase - abandon pour ne pas corrompre le depot."
              exit 1
            fi
            git push
          fi

      - name: Deploy FTP
        if: always()
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:    ${{ secrets.FTP_SERVER }}
          username:  ${{ secrets.FTP_USERNAME }}
          password:  ${{ secrets.FTP_PASSWORD }}
          local-dir: ./pages/podcast-btb/
          server-dir: /listenly.fr/podcast-btb/
          exclude: |
            **/.git*
            **/.git*/**
            **/.gitkeep
