name: Auto-fiches Immobilier Espagne
on:
  schedule:
    - cron: '30 7,15,23 * * *'
  workflow_dispatch:
    inputs:
      max_new:
        description: 'Nombre de fiches a generer ce run'
        required: false
        default: '1'
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generation fiches Immobilier Espagne
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RSS_URL: 'https://feed.ausha.co/y05XUJ38Gw'
          PODCAST_SLUG: 'immobilier-espagne'
          SPOTIFY_SHOW_URL: 'https://open.spotify.com/show/1ZikgxOidUnqRjGzGY5eIB'
          CTA_URL: 'https://listenly.fr/podcast/show/immobilier-en-espagne'
          CTA_LABEL: 'Écouter le podcast'
          PODCAST_IMAGE_URL: 'https://i.postimg.cc/bNg03Bsg/ab67656300005f1f0bc217eeca2518ca72d794a6.jpg'
          PLAUSIBLE_DOMAIN: 'listenly.fr'
          SEED_ONLY: 'true'
          MAX_NEW_PER_RUN: ${{ github.event.inputs.max_new || '1' }}
        run: python automation/scripts/generate_episode_fiches.py
      - name: Commit and push
        run: |
          git config user.name  "listenly-bot"
          git config user.email "bot@listenly.fr"
          git pull --rebase --autostash origin main
          git add pages/ automation/processed_episodes_immobilier-espagne.json
          if git diff --staged --quiet; then
            echo "Aucune nouvelle fiche."
          else
            git commit -m "Seed: marquage episodes existants Immobilier Espagne"
            git push
          fi
