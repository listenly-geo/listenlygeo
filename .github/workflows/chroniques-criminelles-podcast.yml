name: "chroniques-criminelles-podcast — N1 + N2 auto"

on:
  schedule:
    - cron: '30 12 * * 3,6'
  workflow_dispatch:
    inputs:
      max_new:
        description: 'Nb fiches episode a generer'
        required: false
        default: '1'
      seed_only:
        description: 'true = amorcage sans generation'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:

  fiche-n1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generation fiche N1 si absente
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PODCAST_SLUG: chroniques-criminelles-podcast
          SPOTIFY_SHOW_URL: https://open.spotify.com/show/1Tn0rNAr68DU0gLZXWiptV
          PODCAST_IMAGE_URL: https://i.postimg.cc/Qdk8PMrR/fea7706f-5e83-4aed-96bc-84cbda61f661.jpg
          LISTENLY_SHOW_URL: https://listenly.fr/podcast/show/chroniques-criminelles
          PLAUSIBLE_DOMAIN: listenly.fr
          PODCAST_RAW_INFO: |
            Powered by   CHRONIQUES CRIMINELLES <p>Disparitions inquiétantes, crimes passionnels, &nbsp;ou machinations diaboliques… Découvrez les secrets des faits-divers les plus marquants. Tueurs en série, amants démoniaques, tous pensaient avoir commis le crime parfait. Mais tous, sont aujourd’hui derrière les barreaux. Qui sont ces meurtriers ? Et comment les policiers sont-ils parvenus à les confondre ? La découverte de la vérité ne tient parfois qu’à un fil… Grâce aux témoignages de tous les protagonistes, des enquêteurs aux&nbsp;familles des victimes, Jacques Pradel vous fait revivre ces enquêtes 
        run: python automation/scripts/generate_n1.py
      - name: Commit fiche N1
        run: |
          git config user.name "listenly-bot"
          git config user.email "bot@listenly.fr"
          git pull --rebase --autostash origin main
          git add pages/
          if git diff --staged --quiet; then
            echo "N1 deja presente."
          else
            git commit -m "Auto: fiche N1 chroniques-criminelles-podcast"
            git push
          fi
      - name: Deploy FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./pages/
          server-dir: /listenly.fr/fiche-geo-ia/
          exclude: |
            **/.git*
            **/.git*/**
            **/.gitkeep

  fiches-n2:
    runs-on: ubuntu-latest
    needs: fiche-n1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generation fiches episodes N2
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RSS_URL: https://feeds.audiomeans.fr/feed/65e18b16-20cf-4a4b-8c2d-6ba7547671cf.xml
          PODCAST_SLUG: chroniques-criminelles-podcast
          SPOTIFY_SHOW_URL: https://open.spotify.com/show/1Tn0rNAr68DU0gLZXWiptV
          CTA_URL: https://listenly.fr/podcast/show/chroniques-criminelles
          CTA_LABEL: Ecouter le podcast
          PODCAST_IMAGE_URL: https://i.postimg.cc/Qdk8PMrR/fea7706f-5e83-4aed-96bc-84cbda61f661.jpg
          PLAUSIBLE_DOMAIN: listenly.fr
          MAX_NEW_PER_RUN: ${{ github.event.inputs.max_new || '1' }}
          SEED_ONLY: ${{ github.event.inputs.seed_only || 'false' }}
        run: python automation/scripts/generate_episode_fiches.py
      - name: Commit fiches N2
        run: |
          git config user.name "listenly-bot"
          git config user.email "bot@listenly.fr"
          git pull --rebase --autostash origin main
          git add pages/ automation/processed_episodes_chroniques-criminelles-podcast.json
          if git diff --staged --quiet; then
            echo "Aucune nouvelle fiche."
          else
            git commit -m "Auto: fiches episodes chroniques-criminelles-podcast"
            git push
          fi
      - name: Deploy FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./pages/
          server-dir: /listenly.fr/fiche-geo-ia/
          exclude: |
            **/.git*
            **/.git*/**
            **/.gitkeep
