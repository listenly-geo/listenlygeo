name: Podcast BTB — purple-voice

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * 3'

jobs:
  podcast-btb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generation fiche podcast
        if: github.event_name == 'workflow_dispatch'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RSS_URL: |-
            https://feeds.acast.com/public/shows/68065b0838088415692025d0
          PODCAST_URL: |-
            https://open.spotify.com/show/7GwDkbLdvokXaPYWufthTw
          LISTENLY_URL: |-
            https://listenly.fr/podcast/show/purple-voice
          COVER_IMAGE: |-
            https://i.postimg.cc/2SF0J3Q4/1747755289075-f4e0b9fd-013e-4117-8209-c4eff33cd129.jpg
          PODCAST_SLUG: |-
            purple-voice
          ACCENT_COLOR: |-
            #2e8bd6
          LANGUAGE: |-
            fr
          EPISODE_CTA_TARGET: |-
            listenly
        run: python automation/scripts/generate_podcast_btb.py

      - name: Generation 1 fiche episode max
        if: github.event_name == 'schedule'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PODCAST_SLUG: |-
            purple-voice
          MAX_EPISODES: '1'
        run: python automation/scripts/generate_episode_fiches_btb.py

      - name: Commit fiches
        run: |
          git config user.name  "listenly-bot"
          git config user.email "bot@listenly.fr"
          git pull --rebase --autostash origin main
          git add pages/podcast-btb/
          if git diff --staged --quiet; then
            echo "Rien de nouveau."
          else
            git commit -m "Auto: podcast-btb purple-voice"
            git push
          fi

      - name: Deploy FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:    ${{ secrets.FTP_SERVER }}
          username:  ${{ secrets.FTP_USERNAME }}
          password:  ${{ secrets.FTP_PASSWORD }}
          local-dir: ./pages/podcast-btb/
          server-dir: /listenly.fr/podcast-btb/
          exclude: |
            **/.git*
            **/.git*/**
            **/.gitkeep
