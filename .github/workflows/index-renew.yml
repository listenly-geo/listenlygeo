name: Index — renouvellement mensuel, pause et relances

# Chaque matin (7h30 Paris, avant la publication de 9h) :
#  1. lit l'abonnement Stripe de chaque client : resilie -> file en pause ; actif -> reprise ;
#  2. nouvelle periode payee et file epuisee -> extrait les 30 pages du mois suivant (nouveaux episodes) ;
#  3. relances automatiques (paye sans onboarding, DNS non fait, rappel Google a J+15).
# Sans client concerne, le passage ne fait presque rien (cout nul).

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true = simulation (aucune extraction, aucun mail, aucune ecriture)'
        required: false
        default: 'false'
  schedule:
    - cron: '30 6 * * *'

permissions:
  contents: write

concurrency:
  group: index-renew
  cancel-in-progress: false

jobs:
  renouveler:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MFE_SHEET_URL: ${{ secrets.MFE_SHEET_URL }}
      HUB_IMPORT_TOKEN: ${{ secrets.HUB_IMPORT_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DRY_RUN: ${{ inputs.dry_run == 'true' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pause / reprise selon l'abonnement
        id: sync
        run: python automation/scripts/index_renew.py sync
      - name: Installer ffmpeg
        if: steps.sync.outputs.n != '0' && inputs.dry_run != 'true'
        continue-on-error: true
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Renouveler les files du mois
        if: steps.sync.outputs.n != '0'
        run: python automation/scripts/index_renew.py
      - name: Relances automatiques
        run: python automation/scripts/index_renew.py reminders
      - name: Sauvegarder les files d'attente
        if: inputs.dry_run != 'true'
        run: |
          git config user.name "marketforge-bot"; git config user.email "bot@listenly.fr"
          git add automation/onboarding_queue || true
          git diff --cached --quiet || git commit -m "Index : renouvellement mensuel / pause (files)"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
