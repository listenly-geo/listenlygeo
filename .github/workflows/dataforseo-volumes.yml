name: DataForSEO — volumes quotidiens (moteur moments)

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: dataforseo-volumes
  cancel-in-progress: false

jobs:
  volumes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
      DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Volumes des formes courtes candidates (100 max)
        run: python3 automation/scripts/keyword_dataforseo.py --refresh
      - name: Enregistrer le cache
        if: always()
        run: |
          git config user.name "listenly-geo"
          git config user.email "noreply@github.com"
          git add pages/podcast-btb/data/keyword_cache.json || true
          git diff --cached --quiet || git commit -m "DataForSEO : volumes quotidiens (moteur moments)"
          git pull --rebase -q origin main || true
          git push -q origin HEAD:main || true
