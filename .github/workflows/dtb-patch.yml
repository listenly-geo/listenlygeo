name: DocTheBuilder - patch Hub V1 (o2switch)
on:
  workflow_dispatch:
concurrency:
  group: dtb-install
  cancel-in-progress: false
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      SITE: app.marketforge.fr
    steps:
      - uses: actions/checkout@v4
      - name: Deposer et appliquer le correctif
        shell: bash {0}
        run: |
          set -u
          for v in FTP_SERVER FTP_USERNAME FTP_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::secret $v manquant"; exit 1; fi
          done
          U="ftp://$FTP_SERVER"; o="--ssl-reqd --insecure --connect-timeout 30 --max-time 600 -sS --ftp-create-dirs"
          F() { curl $o --user "$FTP_USERNAME:$FTP_PASSWORD" "$@"; }
          ROOT="app.marketforge.fr"
          TOKEN=$(openssl rand -hex 16)
          sed "s/__TOKEN__/$TOKEN/" automation/dtb-patch/patch.php > /tmp/patch.php
          F -T automation/dtb-patch/hub-v1-patch.zip "$U/$ROOT/dtb-hub-patch.zip" && echo "::notice title=paquet::depose"
          F -T /tmp/patch.php "$U/$ROOT/public/dtbpatch-$TOKEN.php" && echo "::notice title=script::depose"
          call() { r=$(curl -sS -k -m 300 "https://$SITE/dtbpatch-$TOKEN.php?t=$TOKEN&step=$1" 2>&1) || r=$(curl -sS -m 300 "http://$SITE/dtbpatch-$TOKEN.php?t=$TOKEN&step=$1" 2>&1) || true; echo "$r"; }
          r=$(call extract); echo "$r"
          case "$r" in *EXTRACT_OK*) ;; *) echo "::error::extraction echouee"; F -Q "-DELE $ROOT/public/dtbpatch-$TOKEN.php" "$U/" -o /dev/null >/dev/null 2>&1 || true; exit 1 ;; esac
          r=$(call artisan); echo "$r"
          call clean >/dev/null
          F -Q "-DELE $ROOT/public/dtbpatch-$TOKEN.php" "$U/" -o /dev/null >/dev/null 2>&1 || true
          CODE=$(curl -sS -k -o /dev/null -m 30 -w '%{http_code}' "https://$SITE/" 2>/dev/null || echo 000)
          echo "::notice title=verification::code HTTP $CODE"
          case "$r" in *ARTISAN_FINI*) ;; *) echo "::error::artisan non termine"; exit 1 ;; esac
