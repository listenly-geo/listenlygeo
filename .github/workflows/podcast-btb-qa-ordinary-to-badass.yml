name: Podcast BTB Trafic — ordinary-to-badass

on:
  workflow_dispatch:
  schedule:
    - cron: '31 12 * * *'

jobs:
  podcast-btb-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generation fiche podcast N1 (lancement manuel uniquement)
        if: github.event_name == 'workflow_dispatch'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RSS_URL: |-
            https://anchor.fm/s/9f88de8/podcast/rss
          PODCAST_URL: |-
            https://open.spotify.com/show/1GFdZ2Xq7xtH5FwhB2pQpH
          LISTENLY_URL: |-
            https://listenly.fr/podcast/show/ordinary-to-badass
          COVER_IMAGE: |-
            https://i.postimg.cc/SR3jVBdc/1572842-1769574650478-9512e574ee484.jpg
          PODCAST_SLUG: |-
            ordinary-to-badass
          ACCENT_COLOR: |-
            #2e8bd6
          LANGUAGE: |-
            en
          EPISODE_CTA_TARGET: |-
            listenly
        run: python automation/scripts/generate_podcast_btb.py

      - name: Installer ffmpeg (necessaire pour compression audio Whisper - N2 uniquement)
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: Generation fiche question N2 (cron quotidien, ET juste apres chaque lancement manuel)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PODCAST_SLUG: |-
            ordinary-to-badass
        run: python automation/scripts/generate_qa_fiches_btb.py

      - name: Commit fiches
        if: always()
        run: |
          git config user.name  "listenly-bot"
          git config user.email "bot@listenly.fr"
          git add pages/podcast-btb/
          if git diff --staged --quiet; then
            echo "Rien de nouveau."
          else
            git commit -m "Auto: podcast-btb-qa ordinary-to-badass"
            git fetch origin main
            if ! git rebase origin/main; then
              echo "::error::Conflit lors du rebase - abandon pour ne pas corrompre le depot. Relance le workflow (le run concurrent a normalement fini)."
              git rebase --abort
              exit 1
            fi
            if grep -rq "^<<<<<<< \|^=======$\|^>>>>>>> " pages/podcast-btb/ 2>/dev/null; then
              echo "::error::Marqueurs de conflit detectes apres rebase - abandon pour ne pas corrompre le depot."
              exit 1
            fi
            git push
          fi

      - name: Deploy FTP
        if: always()
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:    ${{ secrets.FTP_SERVER }}
          username:  ${{ secrets.FTP_USERNAME }}
          password:  ${{ secrets.FTP_PASSWORD }}
          local-dir: ./pages/podcast-btb/
          server-dir: /listenly.fr/podcast-btb/
          exclude: |
            **/.git*
            **/.git*/**
            **/.gitkeep
