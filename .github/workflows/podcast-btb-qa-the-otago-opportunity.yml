name: Podcast BTB Trafic — the-otago-opportunity

on:
  workflow_dispatch:

jobs:
  podcast-btb-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verifier si la fiche N1 existait deja avant ce run
        id: check_n1
        run: |
          if [ -f "pages/podcast-btb/the-otago-opportunity-podcast.html" ]; then
            echo "existed_before=true" >> "$GITHUB_OUTPUT"
          else
            echo "existed_before=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generation fiche podcast N1 (lancement manuel uniquement)
        if: github.event_name == 'workflow_dispatch'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RSS_URL: |-
            https://rss.buzzsprout.com/2622288.rss
          PODCAST_URL: |-
            https://open.spotify.com/episode/4gCjLIYAOvCx9hcmVflpnY?si=134a27e0792c4764&nd=1&dlsi=a203bb61362944f3
          LISTENLY_URL: |-
            https://listenly.fr/podcast/show/the-otago-opportunity
          COVER_IMAGE: |-
            https://i.postimg.cc/PqD5s2dL/ab67656300005f1ff3ad9b9504e41771e8d62d57.jpg
          PODCAST_SLUG: |-
            the-otago-opportunity
          ACCENT_COLOR: |-
            #2e8bd6
          LANGUAGE: |-
            en
          EPISODE_CTA_TARGET: |-
            listenly
        run: python automation/scripts/generate_podcast_btb.py

      - name: Regenerer le dashboard (visibilite immediate, meme avant le 1er N2)
        if: steps.check_n1.outputs.existed_before == 'false' || steps.check_n1.outputs.exists == 'false'
        run: python automation/scripts/rebuild_dashboard.py

      - name: Installer ffmpeg (necessaire pour compression audio Whisper - N2 uniquement)
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            echo "ffmpeg deja present sur le runner : $(ffmpeg -version | head -1)"
          else
            echo "ffmpeg absent, installation via apt-get..."
            export DEBIAN_FRONTEND=noninteractive
            for i in 1 2 3 4 5; do
              sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && break
              echo "Tentative $i echouee (verrou apt probable), nouvel essai dans 10s..."
              sleep 10
            done
          fi

      - name: Generation fiche question N2 (cron quotidien, ET juste apres chaque lancement manuel)
        if: github.event_name == 'workflow_dispatch' && steps.check_n1.outputs.existed_before == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PODCAST_SLUG: |-
            the-otago-opportunity
        run: python automation/scripts/generate_qa_fiches_btb.py

      - name: Commit fiches
        if: always()
        run: |
          git config user.name  "listenly-bot"
          git config user.email "bot@listenly.fr"
          git pull --rebase --autostash origin main
          git add pages/podcast-btb/
          if git diff --staged --quiet; then
            echo "Rien de nouveau."
          else
            git commit -m "Auto: podcast-btb-qa the-otago-opportunity"
            git push
          fi

      - name: Deploy FTP
        if: always()
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:    ${{ secrets.FTP_SERVER }}
          username:  ${{ secrets.FTP_USERNAME }}
          password:  ${{ secrets.FTP_PASSWORD }}
          local-dir: ./pages/podcast-btb/
          server-dir: /listenly.fr/podcast-btb/
          exclude: |
            **/.git*
            **/.git*/**
            **/.gitkeep
