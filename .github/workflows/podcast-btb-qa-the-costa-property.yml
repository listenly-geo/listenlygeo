name: Podcast BTB Trafic — the-costa-property

on:
  workflow_dispatch:

jobs:
  podcast-btb-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verifier si la fiche N1 existait deja avant ce run
        id: check_n1
        run: |
          if [ -f "pages/podcast-btb/the-costa-property-podcast.html" ]; then
            echo "existed_before=true" >> "$GITHUB_OUTPUT"
          else
            echo "existed_before=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generation fiche podcast N1 (lancement manuel uniquement)
        if: github.event_name == 'workflow_dispatch'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RSS_URL: |-
            https://rss.buzzsprout.com/2426256.rss
          PODCAST_URL: |-
            https://open.spotify.com/show/65aPrxLp6bhoTVsivUaRRG
          LISTENLY_URL: |-
            https://listenly.fr/podcast/show/the-costa-property-podcast
          COVER_IMAGE: |-
            https://i.postimg.cc/WpFFX1Pt/ab6765630000ba8ad0fd292991e603f2f7d9df94.jpg
          PODCAST_SLUG: |-
            the-costa-property
          ACCENT_COLOR: |-
            #2e8bd6
          LANGUAGE: |-
            en
          EPISODE_CTA_TARGET: |-
            listenly
        run: python automation/scripts/generate_podcast_btb.py

      - name: Installer ffmpeg (necessaire pour compression audio Whisper - N2 uniquement)
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: Generation fiche question N2 (cron quotidien, ET juste apres chaque lancement manuel)
        if: github.event_name == 'workflow_dispatch' && steps.check_n1.outputs.existed_before == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PODCAST_SLUG: |-
            the-costa-property
        run: python automation/scripts/generate_qa_fiches_btb.py

      - name: Commit fiches
        if: always()
        run: |
          git config user.name  "listenly-bot"
          git config user.email "bot@listenly.fr"
          git pull --rebase --autostash origin main
          git add pages/podcast-btb/
          if git diff --staged --quiet; then
            echo "Rien de nouveau."
          else
            git commit -m "Auto: podcast-btb-qa the-costa-property"
            git push
          fi

      - name: Deploy FTP
        if: always()
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:    ${{ secrets.FTP_SERVER }}
          username:  ${{ secrets.FTP_USERNAME }}
          password:  ${{ secrets.FTP_PASSWORD }}
          local-dir: ./pages/podcast-btb/
          server-dir: /listenly.fr/podcast-btb/
          exclude: |
            **/.git*
            **/.git*/**
            **/.gitkeep
