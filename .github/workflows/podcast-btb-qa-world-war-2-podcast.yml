name: Podcast BTB Trafic — world-war-2-podcast

on:
  workflow_dispatch:

jobs:
  podcast-btb-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verifier si la fiche N1 existait deja avant ce run
        id: check_n1
        run: |
          if [ -f "pages/podcast-btb/world-war-2-podcast-podcast.html" ]; then
            echo "existed_before=true" >> "$GITHUB_OUTPUT"
          else
            echo "existed_before=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generation fiche podcast N1 (lancement manuel uniquement)
        if: github.event_name == 'workflow_dispatch'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RSS_URL: |-
            https://rss.amperwave.net/v2/feed/audacynetwork/cc2b59fa44d0151fa8987e1b01e424bc
          PODCAST_URL: |-
            https://podcasts.apple.com/us/podcast/world-war-ii-with-tom-hanks/id1896760409?l=fr-FR
          LISTENLY_URL: |-
            https://listenly.fr/podcast/show/world-war-2
          COVER_IMAGE: |-
            https://i.postimg.cc/gjWfkn0Y/ab67656300005f1f65fe448cd4eb770d7c55c81e.jpg
          PODCAST_SLUG: |-
            world-war-2-podcast
          ACCENT_COLOR: |-
            #2e8bd6
          LANGUAGE: |-
            en
          EPISODE_CTA_TARGET: |-
            listenly
        run: python automation/scripts/generate_podcast_btb.py

      - name: Regenerer le dashboard (visibilite immediate, meme avant le 1er N2)
        if: steps.check_n1.outputs.existed_before == 'false' || steps.check_n1.outputs.exists == 'false'
        run: python automation/scripts/rebuild_dashboard.py

      - name: Installer ffmpeg (necessaire pour compression audio Whisper - N2 uniquement)
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            echo "ffmpeg deja present sur le runner : $(ffmpeg -version | head -1)"
          else
            echo "ffmpeg absent, installation via apt-get..."
            export DEBIAN_FRONTEND=noninteractive
            for i in 1 2 3 4 5; do
              sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && break
              echo "Tentative $i echouee (verrou apt probable), nouvel essai dans 10s..."
              sleep 10
            done
          fi

      - name: Generation fiche question N2 (cron quotidien, ET juste apres chaque lancement manuel)
        if: github.event_name == 'workflow_dispatch' && steps.check_n1.outputs.existed_before == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PODCAST_SLUG: |-
            world-war-2-podcast
        run: python automation/scripts/generate_qa_fiches_btb.py

      - name: Commit fiches
        if: always()
        run: |
          git config user.name  "listenly-bot"
          git config user.email "bot@listenly.fr"
          git pull --rebase --autostash origin main
          git add pages/podcast-btb/
          if git diff --staged --quiet; then
            echo "Rien de nouveau."
          else
            git commit -m "Auto: podcast-btb-qa world-war-2-podcast"
            git push
          fi

      - name: Deploy FTP
        if: always()
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:    ${{ secrets.FTP_SERVER }}
          username:  ${{ secrets.FTP_USERNAME }}
          password:  ${{ secrets.FTP_PASSWORD }}
          local-dir: ./pages/podcast-btb/
          server-dir: /listenly.fr/podcast-btb/
          exclude: |
            **/.git*
            **/.git*/**
            **/.gitkeep
