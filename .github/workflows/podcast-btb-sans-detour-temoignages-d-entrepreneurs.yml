            		<item>
            			<title><![CDATA[# 62 - L'IA va transformer toutes les entreprises, êtes-vous prêt ? | Avec Elliot Vaucher (OGRAM)]]></title>
            			<description><![CDATA[<p>L&#39;intelligence artificielle n&#39;est plus une technologie du futur : elle transforme déjà la manière de travailler des entreprises.</p><p>Dans cet épisode de Sans Détour, le podcast de GENILEM avec le soutien de la FIT, Cyril Déléaval reçoit Elliot Vaucher, cofondateur d&#39;OGRAM, pour une conversation sans filtre sur les opportunités, les limites et les bouleversements que l&#39;IA apporte aux entrepreneur·euses.</p><p>Au programme :</p><p>• Pourquoi un test de ChatGPT réalisé il y a six mois n&#39;est déjà plus pertinent.<br>• Comment l&#39;IA révolutionne le droit, la finance et de nombreux autres métiers.<br>• Les erreurs que commettent encore la majorité des PME.<br>• Ce qui différenciera les entreprises qui réussiront de celles qui prendront du retard.<br>• Les outils qu&#39;Elliot recommande aujourd&#39;hui et comment faire ses premiers pas.</p><p>Un épisode concret, accessible et rempli d&#39;exemples pour tous les dirigeant·es, entrepreneur·euses et curieux·euses qui veulent comprendre les véritables enjeux de l&#39;intelligence artificielle.</p><p>🎧 Bonne écoute !</p>
            ]]></description>
            			<link>https://podcasters.spotify.com/pod/show/genilem/episodes/62---LIA-va-transformer-toutes-les-entreprises--tes-vous-prt----Avec-Elliot-Vaucher-OGRAM-e3la441</link>
