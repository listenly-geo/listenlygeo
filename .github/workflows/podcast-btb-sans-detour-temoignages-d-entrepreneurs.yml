            		<item>
            			<title><![CDATA[#58 - Des sommets de l’Himalaya à l’entrepreneuriat : le parcours hors normes de Christine Vogondy]]></title>
            			<description><![CDATA[<p>Après une carrière dans l’immobilier, Christine Vogondy décidede changer radicalement de trajectoire. En 2021, elle gravit l’Everest. Une expérience qui agit comme un déclic.</p><p>Depuis, elle enchaîne les expéditions en très haute altitudeet réalise une performance exceptionnelle : 11 sommets de plus de 8000 mètres gravis en seulement quelques années, avec plusieurs records féminins.</p><p>En parallèle, elle se lance dans l’entrepreneuriat et fonde KEEPUSHING, un concept innovant de fitness et d’entraînement en hypoxie, inspiré de l’entraînement en altitude.</p><p>Dans cet épisode de Sans détour, il est question :</p><ul><li>de changement de vie</li><li>de gestion du risque en haute montagne</li><li>de préparation mentale</li><li>d’entrepreneuriat et de dépassement de soi</li></ul><p>Au moment de l’enregistrement, Christine se prépare àrepartir pour tenter les trois derniers sommets de plus de 8000 mètres qui manquent encore à son palmarès.</p><p>Un épisode inspirant sur la capacité à repousser ses limites— en montagne comme dans l’entrepreneuriat.</p><p>Bonne écoute ! </p>
            ]]></description>
            			<link>https://podcasters.spotify.com/pod/show/genilem/episodes/58---Des-sommets-de-lHimalaya--lentrepreneuriat--le-parcours-hors-normes-de-Christine-Vogondy-e3g9cl0</link>
            			<guid isPermaLink="false">a46b0476-2016-4f06-b96e-6a4771fe1552</guid>
            			<dc:creator><![CDATA[GENILEM]]></dc:creator>
            			<pubDate>Wed, 11 Mar 2026 12:45:34 GMT</pubDate>
            			<enclosure url="https://anchor.fm/s/f327f558/podcast/play/116748384/https%3A%2F%2Fd3ctxlq1ktw2nl.cloudfront.net%2Fstaging%2F2026-2-11%2F3f449800-215a-0575-4d98-2857bf7dd4a9.mp3" length="59537449" type="audio/mpeg"/>
            			<itunes:summary>&lt;p&gt;Après une carrière dans l’immobilier, Christine Vogondy décidede changer radicalement de trajectoire. En 2021, elle gravit l’Everest. Une expérience qui agit comme un déclic.&lt;/p&gt;&lt;p&gt;Depuis, elle enchaîne les expéditions en très haute altitudeet réalise une performance exceptionnelle : 11 sommets de plus de 8000 mètres gravis en seulement quelques années, avec plusieurs records féminins.&lt;/p&gt;&lt;p&gt;En parallèle, elle se lance dans l’entrepreneuriat et fonde KEEPUSHING, un concept innovant de fitness et d’entraînement en hypoxie, inspiré de l’entraînement en altitude.&lt;/p&gt;&lt;p&gt;Dans cet épisode de Sans détour, il est question :&lt;/p&gt;&lt;ul&gt;&lt;li&gt;de changement de vie&lt;/li&gt;&lt;li&gt;de gestion du risque en haute montagne&lt;/li&gt;&lt;li&gt;de préparation mentale&lt;/li&gt;&lt;li&gt;d’entrepreneuriat et de dépassement de soi&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;Au moment de l’enregistrement, Christine se prépare àrepartir pour tenter les trois derniers sommets de plus de 8000 mètres qui manquent encore à son palmarès.&lt;/p&gt;&lt;p&gt;Un épisode inspirant sur la capacité à repousser ses limites— en montagne comme dans l’entrepreneuriat.&lt;/p&gt;&lt;p&gt;Bonne écoute ! &lt;/p&gt;
            </itunes:summary>
