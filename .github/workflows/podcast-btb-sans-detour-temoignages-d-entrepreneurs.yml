            		<item>
            			<title><![CDATA[#60 - De 0 à 12 dark kitchens… puis la crise : l’histoire de Vincent Ledoux, co-fondateur de CRRSP]]></title>
            			<description><![CDATA[<p>Dans cet épisode de SANS DÉTOUR, nous recevons Vincent Ledoux, cofondateur de CRRSP.</p><p>On y parle de dark kitchens, de création de marque… et surtout de la réalité derrière une croissance rapide.</p><p>En quelques mois, la jeune entreprise lance un concept ultra rentable, rembourse son premier crédit en un temps record et ouvre jusqu’à 12 dark kitchens. </p><p>Puis tout bascule : marges sous pression, dépendance aux plateformes, changement de marché.</p><p>Vincent partage sans filtre :<br />– les coulisses du lancement<br />– les erreurs et les prises de conscience<br />– le pivot vers des restaurants physiques<br />– et ce que cela implique vraiment de scaler dans la food</p><p>Un échange concret et utile pour toutes celles et ceux qui entreprennent.</p><p>Excellente écoute !</p>
            ]]></description>
            			<link>https://podcasters.spotify.com/pod/show/genilem/episodes/60---De-0--12-dark-kitchens-puis-la-crise--lhistoire-de-Vincent-Ledoux--co-fondateur-de-CRRSP-e3ijd4p</link>
