            			<description><![CDATA[<p>Quitter la recherche pour résoudre un vrai problème de société : c’est le défi relevé par Samantha Anderson. Chimiste de formation, passionnée de science depuis l’enfance, elle cofonde DePoly avec Christopher Ireland et Bardiya Valizadeh. Leur ambition ? Repenser le recyclage du plastique PET grâce à la chimie.Dans cet épisode de Sans détour, Samantha revient sur les débuts du projet, le passage du laboratoire à l’industrie, et les défis liés à une croissance rapide. </p><p><br></p><p>Cet épisode est en anglais</p>
