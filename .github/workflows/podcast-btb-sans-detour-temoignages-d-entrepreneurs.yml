            		<item>
            			<title><![CDATA[#59 - Créer une entreprise deeptech à impact, avec Nicolas Weber (VOLTIRIS)]]></title>
            			<description><![CDATA[<p>“Votre truc ne marchera jamais.” C’est le premier retour que reçoit Nicolas Weber en présentant son idée à des maraîchers.</p><p>8 raisons. 0 filtre. Et pourtant… il continue.</p><p>Dans cet épisode de <em>Sans Détour</em>, nous recevons Nicolas Weber, cofondateur et CEO de Voltiris. Son objectif : produire de l’énergie solaire dans les serres sans impacter la croissance des plantes. Une idée simple sur le papier. Beaucoup moins dans la réalité.</p><p>Avant Voltiris, Nicolas passe par HEC Lausanne, puis par le Boston Consulting Group. Mais rapidement, il ressent une frustration : travailler sur des slides d’impact… sans impact concret. Il décide alors de basculer dans l’entrepreneuriat, avec une conviction : construire quelque chose de tangible, visible, mesurable.</p><p>Dans cet échange, on parle de :</p><ul><li>Transition de carrière : quitter le conseil pour entreprendre</li><li>Deeptech pragmatique : partir du besoin terrain, pas de la techno</li><li>Itération : transformer des feedbacks “violents” en avantage</li><li>Agrivoltaïsme : produire de l’énergie dans des serres high-tech</li><li>Business model : impact et rentabilité doivent aller ensemble</li></ul><p>Un point clé de l’épisode : Voltiris n’a pas développé une technologie pendant 4 ans en labo. Ils ont :</p><ul><li>parlé à leurs clients dès le début</li><li>testé rapidement un prototype</li><li>itéré en continu avec les maraîchers</li><li>construit une solution adaptée à leur réalité</li></ul><p>Aujourd’hui, Voltiris développe une solution unique : capter une partie de la lumière non utilisée par les plantes, la transformer en énergie tout en maintenant le rendement agricole. Une approche qui répond à un enjeu clé du secteur : réduire les coûts énergétiques et gagner en indépendance, sans compromettre la production.</p><p>Un épisode sans filtre, sur ce que veut vraiment dire : construire une startup deeptech, créer un impact réel et affronter le terrain. Il permet aussi de comprendre :</p><ul><li>comment transformer une idée en produit</li><li>comment travailler avec des clients exigeants</li><li>et pourquoi l’exécution bat toujours l’idée</li></ul><p>Bonne écoute !</p>
            ]]></description>
            			<link>https://podcasters.spotify.com/pod/show/genilem/episodes/59---Crer-une-entreprise-deeptech--impact--avec-Nicolas-Weber-VOLTIRIS-e3hhtlu</link>
            			<guid isPermaLink="false">42f7a125-804a-4c60-b681-151c7b84bc6f</guid>
            			<dc:creator><![CDATA[GENILEM]]></dc:creator>
            			<pubDate>Tue, 07 Apr 2026 09:01:02 GMT</pubDate>
