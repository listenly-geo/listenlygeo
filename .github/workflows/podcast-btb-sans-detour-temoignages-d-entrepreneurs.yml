            		<item>
            			<title><![CDATA[#57 - Numérique responsable et gouvernance transparente : le pari d’Amael Parreaux-Ey (Resilio)]]></title>
            			<description><![CDATA[<p>Dans cet épisode de <em>Sans Détour</em>, Amael Parreaux-Ey, cofondateur de Resilio — spin-off de l’EPFL spécialisée dans l’évaluation environnementale du numérique — revient sur la construction d’une entreprise engagée et exigeante.</p><p>Parti d’une association étudiante qui recensait les ordinateurs de l’EPFL, Resilio compte aujourd’hui 25 collaborateurꞏrices, réalise 2 millions de chiffre d’affaires et accompagne des groupes tels que Swisscom, LVMH ou L’Occitane.</p><p>Au-delà de cette trajectoire, l’échange explore les choix structurants qui façonnent une entreprise durable :</p><ul><li>un modèle salarial intégralement transparent</li><li>une grille de rémunération construite collectivement</li><li>une logique de redistribution assumée</li><li>des cycles de vente longs face à de grands groupes</li><li>la remise en question de la croissance à tout prix</li><li>la signification concrète d’un positionnement “business first”</li></ul><p>L’épisode aborde également :</p><ul><li>la création à 11 cofondateurꞏrices et ses implications</li><li>les tensions liées à une gouvernance fondée sur la transparence</li><li>les différences d’approche entre convaincre un DSI et une responsable RSE</li><li>les limites de la performance individuelle comme modèle dominant</li><li>la posture d’un jeune dirigeant (21 ans) face à des décideurs expérimentés</li></ul><p>Un échange dense, transparent et opérationnel, pour celles et ceux qui souhaitent bâtir une entreprise robuste et cohérente, loin des effets d’image et des dynamiques de croissance artificielle.</p><p>🎧 À découvrir dans ce nouvel épisode de <em>Sans Détour</em>.</p>
            ]]></description>
            			<link>https://podcasters.spotify.com/pod/show/genilem/episodes/57---Numrique-responsable-et-gouvernance-transparente--le-pari-dAmael-Parreaux-Ey-Resilio-e3f5ht2</link>
