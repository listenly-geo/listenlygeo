            		<item>
            			<title><![CDATA[#56 - Scaler un e-commerce rentable : le parcours de Camille Lacroix (MakeMyMask)]]></title>
            			<description><![CDATA[<p>Ancienne cadre en finance chez Revlon, <strong>Camille Lacroix</strong>, cofondatrice de <strong>MakeMyMask </strong>revient sans filtre sur son passage du corporate à l’entrepreneuriat, la rencontre avec son associée, et la construction méthodique d’un business <strong>en forte croissance… et rentable</strong>.</p><p>Dans cet épisode, on parle notamment de :</p><ul><li><p><strong>choix d’association</strong> et de fit professionnel</p></li><li><p><strong>finance, marges et rentabilité</strong> comme piliers de décision</p></li><li><p><strong>levée de fonds</strong> (friends, family &amp; business angels)</p></li><li><p><strong>scaling e-commerce</strong>, CAC, marketing paid et ROI</p></li><li><p>la tension permanente entre <strong>croissance et stabilité</strong></p></li><li><p>ce qu&#39;implique, concrètement, d’entreprendre avec exigence et lucidité</p></li></ul><p>Un échange dense, honnête et très opérationnel, pour celles et ceux qui veulent construire une entreprise <strong>solide, durable et ambitieuse</strong>, sans artifice. </p>
            ]]></description>
