            		<item>
            			<title><![CDATA[#46 - Du test à la vision, avec Valentin Gönczy]]></title>
            			<description><![CDATA[<p>Apprendre en faisant, expérimenter sans attendre laperfection, s&#39;entourer des bonnes personnes, avoir une vision d’entreprise forte. Voilà les clés du succès selon Valentin Gönczy. </p><p>Il raconte son parcours, de sa première startup lancée depuis les bancs de l&#39;université à la création de Cloover, une entreprise qui révolutionne l&#39;accès aux énergies renouvelables. </p><p>Un épisode inspirant qui souligne que le succès repose souvent sur le courage d’agir, de bonnes rencontres et une vision forte. </p><p></p>
