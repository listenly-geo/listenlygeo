            		<item>
            			<title><![CDATA[#61 - Entreprendre autrement, sans sacrifier ses valeurs : Grégory Chollet, cofondateur de Loyco]]></title>
            			<description><![CDATA[<p>Dans cet épisode de SANS DÉTOUR, le podcast de GENILEM avec le soutien de la FIT (Fondation pour l’Innovation et la Technologie), nous avons le plaisir d’accueillir Grégory Chollet. </p><p>Entrepreneur en série, cofondateur de Loyco, Guru et Natives, Grégory partage sans détour son parcours : ses débuts entrepreneuriaux, son passage chez Deloitte, la création de Loyco après une rupture avec son ancien employeur, mais aussi sa vision d’une entreprise capable de concilier performance économique, gouvernance innovante et impact sociétal. </p><p>Au fil de la discussion, nous parlons notamment de : </p><ul><li>Entrepreneuriat et prise de risque</li><li>Gouvernance partagée et &quot;Loycocratie&quot; </li><li>Culture d’entreprise et confiance • Innovation, échecs et apprentissages </li><li>Impact sociétal et modèle B Corp </li><li>Leadership et responsabilisation des équipes </li><li>Croissance d’une PME suisse romande</li></ul><p>Parmi les moments forts de l’épisode : </p><ul><li>La création de Loyco après une tentative de rachat avortée </li><li>Un commandement de payer plusieurs millions, reçu en pleine journée de ski </li><li>Pourquoi &quot;pour savoir faire, il faut faire&quot; </li><li>Les erreurs commises dans le développement de nouveaux projets </li><li>Les limites des bonus individuels et l’importance du collectif </li><li>La conviction que l’entreprise peut être un puissant levier de transformation de la société</li></ul><p>Un épisode qui questionne notre rapport au travail, à la gouvernance et à la création de valeur. </p><p>Bonne écoute !</p>
            ]]></description>
            			<link>https://podcasters.spotify.com/pod/show/genilem/episodes/61---Entreprendre-autrement--sans-sacrifier-ses-valeurs--Grgory-Chollet--cofondateur-de-Loyco-e3k26pl</link>
