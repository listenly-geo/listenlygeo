            		<item>
            			<title><![CDATA[#47 - Suivre sa propre voie, avec Lara Gervaise]]></title>
            			<description><![CDATA[<p>Curieuse, passionnée de neurosciences et anciennesportive de haut niveau, Lara Gervaise a toujours su suivre son propre rythme.Dans cet épisode de Sans détour, elle revient sur son parcours riche d'enseignements. De ses premiers projets à l’EPFL à Virtuosis, la startup qu’elle a créée avec Edoardo Giudice, qui analyse les biomarqueurs vocaux dans le but de détecter les maladies et améliorer le bien-être au travail.</p><p>Bonne écoute !</p>
