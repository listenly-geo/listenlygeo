iques et gagner en indépendance, sans compromettre la production.&lt;/p&gt;&lt;p&gt;Un épisode sans filtre, sur ce que veut vraiment dire : construire une startup deeptech, créer un impact réel et affronter le terrain. Il permet aussi de comprendre :&lt;/p&gt;&lt;ul&gt;&lt;li&gt;comment transformer une idée en produit&lt;/li&gt;&lt;li&gt;comment travailler avec des clients exigeants&lt;/li&gt;&lt;li&gt;et pourquoi l’exécution bat toujours l’idée&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;Bonne écoute !&lt;/p&gt;
