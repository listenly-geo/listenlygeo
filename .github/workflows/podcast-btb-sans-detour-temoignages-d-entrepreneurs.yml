            		<item>
            			<title><![CDATA[#50 - Écouter pour innover juste, avec Yannick Bloem]]></title>
            			<description><![CDATA[<p>Créer un produit vraiment utile, qui améliore le quotidien de milliers de personnes : voilà ce qui guide Yannick Bloem. </p><p>Sa méthode : écouter chaque semaine ses utilisateur·rices, ajuster la roadmap produit en fonction de leurs besoins, rester agile tout en posant les bases d’une croissance internationale solide.</p><p>Dans cet épisode de Sans détour, le cofondateur de CoVet, une startup en pleine croissance, partage son parcours de passionné de code, devenu entrepreneur à San Francisco.</p>
