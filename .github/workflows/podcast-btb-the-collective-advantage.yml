name: Podcast BTB — the-collective-advantage

on:
  workflow_dispatch:
  schedule:
    - cron: '0 14 * * 1'

jobs:
  podcast-btb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer ffmpeg (necessaire pour compression audio Whisper)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Generation fiche podcast (lancement manuel uniquement)
        if: github.event_name == 'workflow_dispatch'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RSS_URL: |-
            https://feed.ausha.co/x3EJJskq6wv6
          PODCAST_URL: |-
            https://open.spotify.com/show/033Ljsg5IRaXrCDRNDmbTh
          CONTACT_URL: |-
            https://www.linkedin.com/company/the-collective-advantage-podcast/
          CONTACT_LABEL: |-
            The Collective Advantage
          LISTENLY_URL: |-
            https://listenly.fr/podcast/show/the-collective-advantage
          COVER_IMAGE: |-
            https://i.postimg.cc/TwSzxPcX/Nog7DZDs5k2Dh6CQHyvy-I4km-LNs7Hp-RBLr-C0bm-RX-400x400.jpg
          PODCAST_SLUG: |-
            the-collective-advantage
          ACCENT_COLOR: |-
            #2e8bd6
          LANGUAGE: |-
            fr
        run: python automation/scripts/generate_podcast_btb.py

      - name: Generation 1 fiche episode max (cron hebdomadaire uniquement, jamais au lancement manuel)
        if: github.event_name == 'schedule'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PODCAST_SLUG: |-
            the-collective-advantage
          MAX_EPISODES: '1'
          USE_TRANSCRIPT: 'true'
        run: python automation/scripts/generate_episode_fiches_btb.py

      - name: Commit fiches
        run: |
          git config user.name  "listenly-bot"
          git config user.email "bot@listenly.fr"
          git pull --rebase --autostash origin main
          git add pages/podcast-btb/
          if git diff --staged --quiet; then
            echo "Rien de nouveau."
          else
            git commit -m "Auto: podcast-btb the-collective-advantage"
            git push
          fi

      - name: Deploy FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:    ${{ secrets.FTP_SERVER }}
          username:  ${{ secrets.FTP_USERNAME }}
          password:  ${{ secrets.FTP_PASSWORD }}
          local-dir: ./pages/podcast-btb/
          server-dir: /listenly.fr/podcast-btb/
          exclude: |
            **/.git*
            **/.git*/**
            **/.gitkeep
