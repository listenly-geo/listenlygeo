name: "yoga-made-insportspodcast — N1 + N2 auto"

on:
  schedule:
    - cron: '0 11 * * 2,5'
  workflow_dispatch:
    inputs:
      max_new:
        description: 'Nb fiches episode a generer'
        required: false
        default: '1'
      seed_only:
        description: 'true = amorcage sans generation'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:

  fiche-n1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generation fiche N1 si absente
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PODCAST_SLUG: yoga-made-insportspodcast
          SPOTIFY_SHOW_URL: https://open.spotify.com/show/6Rz7Z5ttOPHkbiOlacoOIe
          PODCAST_IMAGE_URL: https://i.postimg.cc/6QW70X2J/ab6765630000ba8ae5cbce269bd497221e33b29f.jpg
          LISTENLY_SHOW_URL: https://listenly.fr/podcast/show/httpspodcastsapplecomfrpodcastyoga-made-in-sportsid1882675887
          PLAUSIBLE_DOMAIN: listenly.fr
          PODCAST_RAW_INFO: |
            <?xml version="1.0" encoding="UTF-8"?> <rss xmlns:itunes="http://www.itunes.com/dtds/podcast-1.0.dtd" xmlns:media="http://search.yahoo.com/mrss/" xmlns:atom="http://www.w3.org/2005/Atom" xmlns:content="http://purl.org/rss/1.0/modules/content/" xmlns:psc="http://podlove.org/simple-chapters" xmlns:podcast="https://podcastindex.org/namespace/1.0" version="2.0">   <channel>     <atom:link href="https://pubsubhubbub.appspot.com/" rel="hub"/>     <atom:link href="https://yoga-made-insportspodcast.podigee.io/feed/mp3" rel="self"/>     <atom:link href="https://yoga-made-insportspodcast.podigee.io/feed
        run: python automation/scripts/generate_n1.py
      - name: Commit fiche N1
        run: |
          git config user.name "listenly-bot"
          git config user.email "bot@listenly.fr"
          git pull --rebase --autostash origin main
          git add pages/
          if git diff --staged --quiet; then
            echo "N1 deja presente."
          else
            git commit -m "Auto: fiche N1 yoga-made-insportspodcast"
            git push
          fi
      - name: Deploy FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./pages/
          server-dir: /listenly.fr/fiche-geo-ia/
          exclude: |
            **/.git*
            **/.git*/**
            **/.gitkeep

  fiches-n2:
    runs-on: ubuntu-latest
    needs: fiche-n1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generation fiches episodes N2
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RSS_URL: https://yoga-made-insportspodcast.podigee.io/feed/mp3
          PODCAST_SLUG: yoga-made-insportspodcast
          SPOTIFY_SHOW_URL: https://open.spotify.com/show/6Rz7Z5ttOPHkbiOlacoOIe
          CTA_URL: https://listenly.fr/podcast/show/httpspodcastsapplecomfrpodcastyoga-made-in-sportsid1882675887
          CTA_LABEL: Ecouter le podcast
          PODCAST_IMAGE_URL: https://i.postimg.cc/6QW70X2J/ab6765630000ba8ae5cbce269bd497221e33b29f.jpg
          PLAUSIBLE_DOMAIN: listenly.fr
          MAX_NEW_PER_RUN: ${{ github.event.inputs.max_new || '1' }}
          SEED_ONLY: ${{ github.event.inputs.seed_only || 'false' }}
        run: python automation/scripts/generate_episode_fiches.py
      - name: Commit fiches N2
        run: |
          git config user.name "listenly-bot"
          git config user.email "bot@listenly.fr"
          git pull --rebase --autostash origin main
          git add pages/ automation/processed_episodes_yoga-made-insportspodcast.json
          if git diff --staged --quiet; then
            echo "Aucune nouvelle fiche."
          else
            git commit -m "Auto: fiches episodes yoga-made-insportspodcast"
            git push
          fi
      - name: Deploy FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./pages/
          server-dir: /listenly.fr/fiche-geo-ia/
          exclude: |
            **/.git*
            **/.git*/**
            **/.gitkeep
