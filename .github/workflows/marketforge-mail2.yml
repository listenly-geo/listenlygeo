name: MarketForge — Mail 2 (destination + CTA apres reponse)

# Toutes les 30 min : enregistre la destination donnee par le prospect (fiche N1), puis envoie le mail 2
# seulement apres 20 min ET validation (VALIDE en colonne S du Sheet).

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: marketforge-mail2
  cancel-in-progress: false

jobs:
  mail2:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Destinations et mail 2
        env:
          MFE_SHEET_URL: ${{ secrets.MFE_SHEET_URL }}
        run: python automation/scripts/mail2_sync.py
      - name: Enregistrer les destinations
        run: |
          git config user.name "claude-bot"
          git config user.email "claude-bot@users.noreply.github.com"
          git add automation/marketforge_engine/redirections.json
          if git diff --cached --quiet; then echo "rien de nouveau"; else
            git commit -m "Destinations des fiches N1 (mail 2)"
            git pull --rebase -q && git push -q
          fi
