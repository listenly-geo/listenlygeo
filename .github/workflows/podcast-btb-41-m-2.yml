name: Podcast BTB — 41-m-2

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 1'

jobs:
  podcast-btb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generation fiche podcast (lancement manuel uniquement)
        if: github.event_name == 'workflow_dispatch'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RSS_URL: |-
            https://feed.ausha.co/3PzdEcv19Lx1
          PODCAST_URL: |-
            https://open.spotify.com/show/5CG3hxPK2h5rh63vPm8oYc
          CONTACT_URL: |-
            https://www.linkedin.com/company/maslowimmo/posts/?feedView=all
          CONTACT_LABEL: |-
            Maslow.immo
          LISTENLY_URL: |-
            https://listenly.fr/podcast/show/41-m-2
          COVER_IMAGE: |-
            https://i.postimg.cc/WzPL3LSL/2Epfbl-YTr-VZHt2jg1FSHCQP8f-OB6DKary-ODG90i-Q-400x400.jpg
          PODCAST_SLUG: |-
            41-m-2
          ACCENT_COLOR: |-
            #2e8bd6
          LANGUAGE: |-
            fr
        run: python automation/scripts/generate_podcast_btb.py

      - name: Generation 1 fiche episode max (cron hebdomadaire uniquement, jamais au lancement manuel)
        if: github.event_name == 'schedule'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PODCAST_SLUG: |-
            41-m-2
          MAX_EPISODES: '1'
        run: python automation/scripts/generate_episode_fiches_btb.py

      - name: Commit fiches
        run: |
          git config user.name  "listenly-bot"
          git config user.email "bot@listenly.fr"
          git pull --rebase --autostash origin main
          git add pages/podcast-btb/
          if git diff --staged --quiet; then
            echo "Rien de nouveau."
          else
            git commit -m "Auto: podcast-btb 41-m-2"
            git push
          fi

      - name: Deploy FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:    ${{ secrets.FTP_SERVER }}
          username:  ${{ secrets.FTP_USERNAME }}
          password:  ${{ secrets.FTP_PASSWORD }}
          local-dir: ./pages/podcast-btb/
          server-dir: /listenly.fr/podcast-btb/
          exclude: |
            **/.git*
            **/.git*/**
            **/.gitkeep
