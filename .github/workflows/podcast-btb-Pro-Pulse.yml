name: Podcast BTB — Pro-Pulse

on:
  workflow_dispatch:
  schedule:
    - cron: '0 13 * * 5'

jobs:
  podcast-btb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generation fiche podcast (lancement manuel uniquement)
        if: github.event_name == 'workflow_dispatch'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RSS_URL: |-
            https://feed.ausha.co/a03wnsQZ1jKE
          PODCAST_URL: |-
            https://open.spotify.com/show/447eeM3Y7d6gFqPRAUIHxX
          CONTACT_URL: |-
            https://www.linkedin.com/company/cariforef-occitanie/posts/?feedView=all
          CONTACT_LABEL: |-
            Carif-Oref Occitanie
          LISTENLY_URL: |-
            https://listenly.fr/podcast/show/pro-pulse
          COVER_IMAGE: |-
            https://i.postimg.cc/qqktgzmJ/Eu-Hp3jk4p7Jw-A5JQlc8Qhbpz-XSe5J5Pu1oc-Ie-NEU-1400x1400.jpg
          PODCAST_SLUG: |-
            Pro-Pulse
          ACCENT_COLOR: |-
            #2e8bd6
          LANGUAGE: |-
            fr
        run: python automation/scripts/generate_podcast_btb.py

      - name: Generation 1 fiche episode max (cron hebdomadaire uniquement, jamais au lancement manuel)
        if: github.event_name == 'schedule'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PODCAST_SLUG: |-
            Pro-Pulse
          MAX_EPISODES: '1'
        run: python automation/scripts/generate_episode_fiches_btb.py

      - name: Commit fiches
        run: |
          git config user.name  "listenly-bot"
          git config user.email "bot@listenly.fr"
          git pull --rebase --autostash origin main
          git add pages/podcast-btb/
          if git diff --staged --quiet; then
            echo "Rien de nouveau."
          else
            git commit -m "Auto: podcast-btb Pro-Pulse"
            git push
          fi

      - name: Deploy FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:    ${{ secrets.FTP_SERVER }}
          username:  ${{ secrets.FTP_USERNAME }}
          password:  ${{ secrets.FTP_PASSWORD }}
          local-dir: ./pages/podcast-btb/
          server-dir: /listenly.fr/podcast-btb/
          exclude: |
            **/.git*
            **/.git*/**
            **/.gitkeep
