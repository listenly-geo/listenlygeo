name: "Index — test cPanel (lecture seule)"

# Verifie que les secrets CPANEL_HOST / CPANEL_USER / CPANEL_TOKEN existent (jamais leur valeur) puis fait UN appel de lecture
# (liste des domaines) pour controler que le jeton fonctionne. RIEN n'est modifie sur l'hebergement.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
      CPANEL_USER: ${{ secrets.CPANEL_USER }}
      CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
    steps:
      - name: Secrets presents ?
        run: |
          for v in CPANEL_HOST CPANEL_USER CPANEL_TOKEN; do
            if [ -n "${!v}" ]; then echo "$v : present (${#v} caracteres dans le nom, valeur non affichee)"; else echo "$v : ABSENT"; fi
          done
          echo "longueur host=${#CPANEL_HOST} user=${#CPANEL_USER} jeton=${#CPANEL_TOKEN}"
      - name: Appel de lecture cPanel
        run: |
          [ -n "$CPANEL_HOST" ] && [ -n "$CPANEL_USER" ] && [ -n "$CPANEL_TOKEN" ] || { echo "::error::il manque au moins un des 3 secrets"; exit 1; }
          code=$(curl -sS -m 40 -o /tmp/r.json -w '%{http_code}' -H "Authorization: cpanel $CPANEL_USER:$CPANEL_TOKEN" "https://$CPANEL_HOST:2083/execute/DomainInfo/list_domains")
          echo "reponse cPanel : HTTP $code"
          python3 - <<'PY'
          import json
          try:
              j = json.load(open('/tmp/r.json'))
              d = j.get('data') or {}
              print('statut api :', j.get('status'), '| erreurs :', j.get('errors'))
              if isinstance(d, dict):
                  print('domaine principal : present' if d.get('main_domain') else 'domaine principal : absent')
                  print('domaines complementaires :', len(d.get('addon_domains') or []))
                  print('sous-domaines :', len(d.get('sub_domains') or []))
                  print('LISTE complementaires :', ', '.join(d.get('addon_domains') or []))
                  print('LISTE sous-domaines :', ', '.join(d.get('sub_domains') or []))
          except Exception as e:
              print('reponse illisible :', type(e).__name__)
          PY
          [ "$code" = 200 ] && echo "::notice::jeton cPanel valide" || { echo "::error::jeton refuse ou secrets incorrects (HTTP $code)"; exit 1; }
