name: "Index — test connexion o2switch depuis GitHub (lecture seule)"

# Diagnostic : quels ports de l'hebergement o2switch sont joignables depuis GitHub (SSH 22, cPanel 2083, FTP 21).
# Si le SSH est joignable, tente aussi la connexion avec la cle marketforge_index. RIEN n'est modifie.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_KEY_PASSPHRASE: ${{ secrets.SSH_KEY_PASSPHRASE }}
      SSH_HOST: ${{ secrets.DTB_SSH_HOST }}
      SSH_USER: ${{ secrets.DTB_SSH_USER }}
      CPANEL_HOST: pendule.o2switch.net
    steps:
      - name: Ports joignables depuis GitHub
        run: |
          for h in "$CPANEL_HOST" "$SSH_HOST"; do
            [ -n "$h" ] || continue
            label=$([ "$h" = "$CPANEL_HOST" ] && echo "pendule.o2switch.net" || echo "DTB_SSH_HOST")
            for port in 22 2083 21; do
              if timeout 10 bash -c "exec 3<>/dev/tcp/$h/$port" 2>/dev/null; then echo "$label port $port : OUVERT"; else echo "$label port $port : ferme/filtre"; fi
            done
          done
      - name: Connexion SSH avec la cle (si le port 22 est ouvert)
        continue-on-error: true
        run: |
          H="$CPANEL_HOST"
          timeout 10 bash -c "exec 3<>/dev/tcp/$H/22" 2>/dev/null || { echo "SSH injoignable : etape ignoree"; exit 0; }
          [ -n "$SSH_USER" ] || { echo "DTB_SSH_USER manquant"; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/mf_key && chmod 600 ~/.ssh/mf_key
          printf '#!/bin/sh\necho "$SSH_KEY_PASSPHRASE"\n' > ~/askpass.sh && chmod 700 ~/askpass.sh
          eval "$(ssh-agent -s)" >/dev/null
          SSH_ASKPASS="$HOME/askpass.sh" SSH_ASKPASS_REQUIRE=force DISPLAY=:0 ssh-add ~/.ssh/mf_key </dev/null
          ssh -o StrictHostKeyChecking=accept-new -o BatchMode=yes -o ConnectTimeout=20 "$SSH_USER@$H" 'echo "connexion OK : $(whoami) sur $(hostname)"; command -v cpapi2 uapi'
