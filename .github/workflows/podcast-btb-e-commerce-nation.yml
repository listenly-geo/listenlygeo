name: Podcast BTB — e-commerce-nation

on:
  workflow_dispatch:
  schedule:
    - cron: '0 13 * * 3'

jobs:
  podcast-btb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer ffmpeg (necessaire pour compression audio Whisper)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Generation fiche podcast (lancement manuel uniquement)
        if: github.event_name == 'workflow_dispatch'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RSS_URL: |-
            https://feeds.simplecast.com/dFpMWz0P
          PODCAST_URL: |-
            https://open.spotify.com/show/0howZYb24QU2QUj7pZ1pn8
          CONTACT_URL: |-
            https://www.linkedin.com/company/ecommerce-nation/posts/?feedView=all
          CONTACT_LABEL: |-
            e-commerce nation
          LISTENLY_URL: |-
            https://listenly.fr/podcast/show/e-commerce-nation
          COVER_IMAGE: |-
            https://i.postimg.cc/L8kVbZrZ/ab67656300005f1f8d4972556b77f4dccf123a42.jpg
          PODCAST_SLUG: |-
            e-commerce-nation
          ACCENT_COLOR: |-
            #2e8bd6
          LANGUAGE: |-
            fr
        run: python automation/scripts/generate_podcast_btb.py

      - name: Generation 1 fiche episode max (cron hebdomadaire uniquement, jamais au lancement manuel)
        if: github.event_name == 'schedule'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PODCAST_SLUG: |-
            e-commerce-nation
          MAX_EPISODES: '1'
          USE_TRANSCRIPT: 'true'
        run: python automation/scripts/generate_episode_fiches_btb.py

      - name: Commit fiches
        run: |
          git config user.name  "listenly-bot"
          git config user.email "bot@listenly.fr"
          git pull --rebase --autostash origin main
          git add pages/podcast-btb/
          if git diff --staged --quiet; then
            echo "Rien de nouveau."
          else
            git commit -m "Auto: podcast-btb e-commerce-nation"
            git push
          fi

      - name: Deploy FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:    ${{ secrets.FTP_SERVER }}
          username:  ${{ secrets.FTP_USERNAME }}
          password:  ${{ secrets.FTP_PASSWORD }}
          local-dir: ./pages/podcast-btb/
          server-dir: /listenly.fr/podcast-btb/
          exclude: |
            **/.git*
            **/.git*/**
            **/.gitkeep
