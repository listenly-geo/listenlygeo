name: MarketForge Engine — RUN COMPLET (découverte → Listenly + N1 → email → contact)

# Un seul lancement fait tout, dans l'ordre :
#  1. Decouverte de podcasts (iTunes + qualification GEO + email RSS) -> issues candidates
#  2. Onboarding automatique : fiche Listenly (SQL) + fiche N1 -> issues fermees
#  3. Extraction du jour (file d'attente, budget config.json) -> hub N1 + Knowledge Search + stock inbox
#  4. Commit + mise en ligne FTP
# Reglages : automation/marketforge_engine/config.json (pause, debits, onboarding_auto).

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['automation/marketforge_engine/run-now.txt']   # lancement a distance (modifier ce fichier)
  schedule:
    - cron: '17 */4 * * *'   # toutes les 4 h (6 runs/jour) : flux continu de nouveaux contacts

permissions:
  contents: write
  issues: write

concurrency:
  group: marketforge-engine-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 0. Reglages depuis le Google Sheet (onglet Reglages, cles MFE_*)
        continue-on-error: true
        env:
          MFE_SHEET_URL: ${{ secrets.MFE_SHEET_URL }}
        run: python automation/scripts/sheet_bridge.py pull

      - name: Lire config.json
        id: cfg
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          c = json.load(open("automation/marketforge_engine/config.json"))
          print(f"pause={'true' if c.get('pause') else 'false'}")
          print(f"discover_max={int(c.get('decouverte_max_par_jour', 5))}")
          print(f"onboard_auto={'true' if c.get('onboarding_auto', True) else 'false'}")
          print(f"onboard_max={int(c.get('onboarding_max_par_jour', 5))}")
          PY
          cat "$GITHUB_OUTPUT"

      - name: Installer ffmpeg
        if: steps.cfg.outputs.pause != 'true'
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            export DEBIAN_FRONTEND=noninteractive
            for i in 1 2 3 4 5; do
              sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && break
              sleep 10
            done
          fi

      - name: 1. Decouverte
        if: steps.cfg.outputs.pause != 'true' && steps.cfg.outputs.discover_max != '0'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISCOVERY_MAX_QUALIFY: ${{ steps.cfg.outputs.discover_max }}
          DISCOVERY_COUNTRIES: us
          DISCOVERY_KNOWN_RATIO: '0.2'   # 80 % podcasts B2B de niche (repondent plus que les gros medias)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -o pipefail
          python automation/scripts/discover_podcasts.py | tee discovery.log
          n=$(grep -oE '\(([0-9]+) nouvelle' discovery.log | grep -oE '[0-9]+' | tail -1)
          echo "DISCOVERED_COUNT=${n:-0}" >> "$GITHUB_ENV"

      - name: 2. Onboarding auto (Listenly SQL + fiche N1)
        if: steps.cfg.outputs.pause != 'true' && steps.cfg.outputs.onboard_auto == 'true'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          KNOWLEDGE_IMPORT_SECRET: ${{ secrets.KNOWLEDGE_IMPORT_SECRET }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBERS: auto
          SHOW_IMPORT_MODE: insert
          MAX_ONBOARD: ${{ steps.cfg.outputs.onboard_max }}
        run: |
          python automation/scripts/onboard_from_issue.py
          python automation/scripts/rebuild_dashboard.py || true

      - name: Fiches N1 indexees par Google ? (Search Console)
        continue-on-error: true
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: python automation/scripts/hub_index_check.py

      - name: Veille indexation Google (releve + alerte)
        continue-on-error: true
        run: python automation/scripts/seo_watch.py

      - name: 3. Extraction du jour
        if: steps.cfg.outputs.pause != 'true'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          KNOWLEDGE_IMPORT_SECRET: ${{ secrets.KNOWLEDGE_IMPORT_SECRET }}
        run: python automation/scripts/marketforge_extract_queue.py

      - name: Compte-rendu vers le Google Sheet
        if: always() && steps.cfg.outputs.pause != 'true'
        continue-on-error: true
        env:
          MFE_SHEET_URL: ${{ secrets.MFE_SHEET_URL }}
        run: python automation/scripts/sheet_bridge.py push

      - name: Lecteur de moments (index des questions + adresses d'episodes Listenly)
        if: always()
        continue-on-error: true
        run: python automation/scripts/moments_index.py

      - name: Tableau de bord (moteur.html) + suivi prospection du Sheet
        if: always()
        continue-on-error: true
        env:
          MFE_SHEET_URL: ${{ secrets.MFE_SHEET_URL }}
        run: |
          python automation/scripts/sheet_bridge.py stats
          python automation/scripts/build_engine_dashboard.py

      - name: 4. Commit
        if: always() && steps.cfg.outputs.pause != 'true'
        run: |
          git config user.name  "listenly-bot"
          git config user.email "bot@listenly.fr"
          rm -f discovery.log
          git add automation/data/ automation/marketforge_engine/ automation/inbox/moteur-trafic-transcripts/ pages/podcast-btb/
          if git diff --staged --quiet; then
            echo "::notice title=Commit::Rien de nouveau a enregistrer."
            exit 0
          fi
          git commit -q -m "Auto: MarketForge Engine — run complet du jour"
          ok=0
          for i in 1 2 3 4 5; do
            if git pull -q --rebase --autostash origin main && git push -q; then ok=1; break; fi
            git rebase --abort 2>/dev/null || true
            sleep $((RANDOM % 15 + 5))
          done
          if [ "$ok" != "1" ]; then
            echo "::error title=Commit::Push impossible apres 5 essais. Etat : $(git status --short | head -8 | tr '\n' ' ')"
            exit 1
          fi
          echo "::notice title=Commit::Enregistre sur main ($(git rev-parse --short HEAD))."

      - name: Bilan du run (annotations)
        if: always() && steps.cfg.outputs.pause != 'true'
        run: |
          python - <<'PY'
          import json, datetime
          def load(p, d):
              try: return json.load(open(p, encoding="utf-8"))
              except Exception: return d
          ob = load("automation/marketforge_engine/last_onboard.json", {})
          q = load("automation/marketforge_engine/queue.json", {})
          j = q.get("journal", {}).get(datetime.date.today().isoformat(), {})
          names = ", ".join(o.get("podcast_name", "") + (" (Listenly cree)" if o.get("listenly_created") else " (Listenly existant)") for o in ob.get("onboarded", []))
          print(f"::notice title=Onboarding::{len(ob.get('onboarded', []))} onboarde(s) : {names or 'aucun'} | echecs : {ob.get('failed_issues', [])}")
          print(f"::notice title=Extraction::{j.get('episodes', 0)} episode(s), {j.get('minutes', 0)} min, {j.get('moments', 0)} Q/R | file : " +
                ", ".join(f"{s}={p.get('status')}/{p.get('moments_count', 0)}QR/{'email' if p.get('email') else 'sans email'}" for s, p in q.get("podcasts", {}).items()))
          PY
          echo "::notice title=Decouverte::${DISCOVERED_COUNT:-0} nouvelle(s) issue(s) candidate(s)."

      - name: 5. Mise en ligne FTP
        if: always() && steps.cfg.outputs.pause != 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:    ${{ secrets.FTP_SERVER }}
          username:  ${{ secrets.FTP_USERNAME }}
          password:  ${{ secrets.FTP_PASSWORD }}
          local-dir: ./pages/podcast-btb/
          server-dir: /listenly.fr/podcast-btb/
          exclude: |
            **/.git*
            **/.git*/**
            **/.gitkeep
