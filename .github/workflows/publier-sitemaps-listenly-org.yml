name: Publier les 2 sitemaps listenly.org (N1 + moments)

# Envoie UNIQUEMENT le dossier publish-sitemap/ (2 fichiers) sur le serveur. Ne touche a aucun autre fichier.
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: publier-sitemaps-listenly-org
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Envoi FTP (2 sitemaps)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:    ${{ secrets.FTP_SERVER }}
          username:  ${{ secrets.FTP_USERNAME }}
          password:  ${{ secrets.FTP_PASSWORD }}
          local-dir: ./publish-sitemap/
          server-dir: /listenly.fr/podcast-btb/
