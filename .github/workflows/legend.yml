name: Auto-fiches LEGEND

on:
  schedule:
    - cron: '30 8 * * 1,4'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generation fiches LEGEND
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RSS_URL: 'https://feeds.acast.com/public/shows/646cbb0bb160e00011df3980'
          PODCAST_SLUG: 'legend'
          SPOTIFY_SHOW_URL: 'https://open.spotify.com/show/4xQ0IUSsrfs6pltTnwr3Kk'
          CTA_URL: 'https://listenly.fr/podcast/show/guillaume-pley-legend'
          CTA_LABEL: 'Écouter le podcast'
          PODCAST_IMAGE_URL: 'https://i.postimg.cc/wMGzCNx9/legend-podcast.jpg'
          PLAUSIBLE_DOMAIN: 'listenly.fr'
          MAX_NEW_PER_RUN: '1'
        run: python automation/scripts/generate_episode_fiches.py

      - name: Commit and push
        run: |
          git config user.name "listenly-bot"
          git config user.email "bot@listenly.fr"
          git pull --rebase --autostash origin main
          git add pages/ automation/processed_episodes_legend.json
          if git diff --staged --quiet; then
            echo "Aucune nouvelle fiche."
          else
            git commit -m "Auto: nouvelle fiche épisode LEGEND"
            git push
          fi

      - name: Deploy to fiche-geo-ia
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./pages/
          server-dir: /listenly.fr/fiche-geo-ia/
          exclude: |
            **/.git*
            **/.git*/**
            **/.gitkeep
