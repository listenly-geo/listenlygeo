name: Podcast BTB — wintalk-podcast

on:
  workflow_dispatch:
  schedule:
    - cron: '0 15 * * 2'

jobs:
  podcast-btb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generation fiche podcast
        if: github.event_name == 'workflow_dispatch'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RSS_URL: |-
            https://feed.ausha.co/RzPMxsOJXOvA
          PODCAST_URL: |-
            https://open.spotify.com/show/2qT1nKR7mhc1x7EgdGi3EN
          LISTENLY_URL: |-
            https://listenly.fr/podcast/show/wintalk
          COVER_IMAGE: |-
            https://i.postimg.cc/5NdXv89N/7HKg-W7c8K7ft-Fgvc-RDIe-AMm-Ts-J05g-JDIs-FFIBHy9-1400x1400.jpg
          PODCAST_SLUG: |-
            wintalk-podcast
          ACCENT_COLOR: |-
            #2e8bd6
          LANGUAGE: |-
            fr
          EPISODE_CTA_TARGET: |-
            listenly
        run: python automation/scripts/generate_podcast_btb.py

      - name: Generation 1 fiche episode max
        if: github.event_name == 'schedule'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PODCAST_SLUG: |-
            wintalk-podcast
          MAX_EPISODES: '1'
        run: python automation/scripts/generate_episode_fiches_btb.py

      - name: Commit fiches
        run: |
          git config user.name  "listenly-bot"
          git config user.email "bot@listenly.fr"
          git pull --rebase --autostash origin main
          git add pages/podcast-btb/
          if git diff --staged --quiet; then
            echo "Rien de nouveau."
          else
            git commit -m "Auto: podcast-btb wintalk-podcast"
            git push
          fi

      - name: Deploy FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:    ${{ secrets.FTP_SERVER }}
          username:  ${{ secrets.FTP_USERNAME }}
          password:  ${{ secrets.FTP_PASSWORD }}
          local-dir: ./pages/podcast-btb/
          server-dir: /listenly.fr/podcast-btb/
          exclude: |
            **/.git*
            **/.git*/**
            **/.gitkeep
