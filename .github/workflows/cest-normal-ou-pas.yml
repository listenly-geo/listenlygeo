name: "cest-normal-ou-pas — N1 + N2 auto"

on:
  schedule:
    - cron: '0 17 * * 1,3'
  workflow_dispatch:
    inputs:
      max_new:
        description: 'Nb fiches episode a generer'
        required: false
        default: '1'
      seed_only:
        description: 'true = amorcage sans generation'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:

  fiche-n1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generation fiche N1 si absente
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PODCAST_SLUG: cest-normal-ou-pas
          SPOTIFY_SHOW_URL: https://open.spotify.com/show/2etzvlLRALZqRqEA6M5Ylc
          PODCAST_IMAGE_URL: https://i.postimg.cc/MHFPNxps/poysb5Qr-K4EWTSXGF9v1Zg-CLW9UVj-K0Sv77Gds19-1400x1400.jpg
          LISTENLY_SHOW_URL: https://listenly.fr/podcast/show/cest-normal-ou-pas
          PLAUSIBLE_DOMAIN: listenly.fr
          PODCAST_RAW_INFO: |
            C"est normal ou pas ? - Quand tout déborde : émotions, stress et tout ce qu’on ne nous a jamais appris “C’est normal ou pas ?” est un podcast pour celles et ceux qui ont parfois l’impression de ne plus rien contrôler : stress qui monte, crises d’angoisse, émotions débordantes, fatigue qui s’installe… Et qui se demandent, en silence : « Est-ce que c’est normal de réagir comme ça ? Est-ce que je suis trop sensible ? Est-ce que c’est moi le problème ? » Je suis Karine Agnez, accompagnante en thérapie brève, et je vous propose ici un espace pour mieux comprendre votre fonctionnement émotionnel et 
        run: python automation/scripts/generate_n1.py
      - name: Commit fiche N1
        run: |
          git config user.name "listenly-bot"
          git config user.email "bot@listenly.fr"
          git pull --rebase --autostash origin main
          git add pages/
          if git diff --staged --quiet; then
            echo "N1 deja presente."
          else
            git commit -m "Auto: fiche N1 cest-normal-ou-pas"
            git push
          fi
      - name: Deploy FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./pages/
          server-dir: /listenly.fr/fiche-geo-ia/
          exclude: |
            **/.git*
            **/.git*/**
            **/.gitkeep

  fiches-n2:
    runs-on: ubuntu-latest
    needs: fiche-n1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generation fiches episodes N2
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RSS_URL: https://feed.ausha.co/Bq92QniJ47Z1
          PODCAST_SLUG: cest-normal-ou-pas
          SPOTIFY_SHOW_URL: https://open.spotify.com/show/2etzvlLRALZqRqEA6M5Ylc
          CTA_URL: https://listenly.fr/podcast/show/cest-normal-ou-pas
          CTA_LABEL: Ecouter le podcast
          PODCAST_IMAGE_URL: https://i.postimg.cc/MHFPNxps/poysb5Qr-K4EWTSXGF9v1Zg-CLW9UVj-K0Sv77Gds19-1400x1400.jpg
          PLAUSIBLE_DOMAIN: listenly.fr
          MAX_NEW_PER_RUN: ${{ github.event.inputs.max_new || '1' }}
          SEED_ONLY: ${{ github.event.inputs.seed_only || 'false' }}
        run: python automation/scripts/generate_episode_fiches.py
      - name: Commit fiches N2
        run: |
          git config user.name "listenly-bot"
          git config user.email "bot@listenly.fr"
          git pull --rebase --autostash origin main
          git add pages/ automation/processed_episodes_cest-normal-ou-pas.json
          if git diff --staged --quiet; then
            echo "Aucune nouvelle fiche."
          else
            git commit -m "Auto: fiches episodes cest-normal-ou-pas"
            git push
          fi
      - name: Deploy FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./pages/
          server-dir: /listenly.fr/fiche-geo-ia/
          exclude: |
            **/.git*
            **/.git*/**
            **/.gitkeep
