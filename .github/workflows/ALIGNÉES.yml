name: "ALIGNÉES — N1 + N2 auto"

on:
  schedule:
    - cron: '0 8 * * 2,6'
  workflow_dispatch:
    inputs:
      max_new:
        description: 'Nb fiches episode a generer'
        required: false
        default: '1'
      seed_only:
        description: 'true = amorcage sans generation'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:

  fiche-n1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generation fiche N1 si absente
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PODCAST_SLUG: ALIGNÉES
          SPOTIFY_SHOW_URL: https://open.spotify.com/show/5mG0wJTNy3KbDYm5H7TJP7
          PODCAST_IMAGE_URL: https://i.postimg.cc/x1g5bmJc/500x500-000000-80-0-0.jpg
          LISTENLY_SHOW_URL: https://listenly.fr/podcast/show/alignes
          PLAUSIBLE_DOMAIN: listenly.fr
          PODCAST_RAW_INFO: |
            Alignées ALIGNÉES, le podcast pour les entrepreneuses créatives en quête de sens.  Dans ALIGNÉES, je pars à la rencontre de mes consoeurs inspirantes : des femmes qui ont décidé de remettre du sens dans leur métier créatif. Elles sont graphistes, directrices artistiques, designers web, illustratrices ou chargées de communication… Et elles ont décidé de se façonner une activité à leur image pour être entièrement alignées avec leurs valeurs. Au programme : des interviews authentiques et bienveillantes qui montrent qu’on peut construire son job de rêve hors des chemins tracés par l"école et le mo
        run: python automation/scripts/generate_n1.py
      - name: Commit fiche N1
        run: |
          git config user.name "listenly-bot"
          git config user.email "bot@listenly.fr"
          git pull --rebase --autostash origin main
          git add pages/
          if git diff --staged --quiet; then
            echo "N1 deja presente."
          else
            git commit -m "Auto: fiche N1 ALIGNÉES"
            git push
          fi
      - name: Deploy FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./pages/
          server-dir: /listenly.fr/fiche-geo-ia/
          exclude: |
            **/.git*
            **/.git*/**
            **/.gitkeep

  fiches-n2:
    runs-on: ubuntu-latest
    needs: fiche-n1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generation fiches episodes N2
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RSS_URL: https://feed.ausha.co/qrxqkIv8vg8p
          PODCAST_SLUG: ALIGNÉES
          SPOTIFY_SHOW_URL: https://open.spotify.com/show/5mG0wJTNy3KbDYm5H7TJP7
          CTA_URL: https://listenly.fr/podcast/show/alignes
          CTA_LABEL: Ecouter le podcast
          PODCAST_IMAGE_URL: https://i.postimg.cc/x1g5bmJc/500x500-000000-80-0-0.jpg
          PLAUSIBLE_DOMAIN: listenly.fr
          MAX_NEW_PER_RUN: ${{ github.event.inputs.max_new || '1' }}
          SEED_ONLY: ${{ github.event.inputs.seed_only || 'false' }}
        run: python automation/scripts/generate_episode_fiches.py
      - name: Commit fiches N2
        run: |
          git config user.name "listenly-bot"
          git config user.email "bot@listenly.fr"
          git pull --rebase --autostash origin main
          git add pages/ automation/processed_episodes_ALIGNÉES.json
          if git diff --staged --quiet; then
            echo "Aucune nouvelle fiche."
          else
            git commit -m "Auto: fiches episodes ALIGNÉES"
            git push
          fi
      - name: Deploy FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./pages/
          server-dir: /listenly.fr/fiche-geo-ia/
          exclude: |
            **/.git*
            **/.git*/**
            **/.gitkeep
