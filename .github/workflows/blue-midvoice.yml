name: "blue-midvoice — N1 + N2 auto"

on:
  schedule:
    - cron: '0 11 * * 2,5'
  workflow_dispatch:
    inputs:
      max_new:
        description: 'Nb fiches episode a generer'
        required: false
        default: '1'
      seed_only:
        description: 'true = amorcage sans generation'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:

  fiche-n1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generation fiche N1 si absente
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PODCAST_SLUG: blue-midvoice
          SPOTIFY_SHOW_URL: https://open.spotify.com/show/08stWliSX2vnARBkhahoOV
          PODCAST_IMAGE_URL: https://i.postimg.cc/gJRxDqqY/CNy-Tz-No-Dc-ED2XIJ1j-GAcfy-Gp2pi-GWfc-CEh-Sgk-BSF-1400x1400.jpg
          LISTENLY_SHOW_URL: https://listenly.fr/podcast/show/blue-midvoice
          PLAUSIBLE_DOMAIN: listenly.fr
          PODCAST_RAW_INFO: |
            Blue MidVoice Le podcast du site Blue Midlife. Chaque semaine un concentré de coaching ⏳ou une interview d"un professionnel 🎤 autour de l"entrepreneuriat, de la recherche d"emploi et de l"accompagnement. Tout cela illustré d"exemples, d"expériences et de bonne humeur 😊. Alors rejoignez-nous sur Blue MidVoice et donnez un coup de boost à votre vie professionnelle 💪 Hébergé par Ausha. Visitez ausha.co/fr/politique-de-confidentialite pour plus d"informations. (Copyright : catherine barloy)     BLUE MIDVOICE EPISODE 141 : OLIVIER BLAISE – YOGA DU RIRE     Download     Fri, 26 Jun 2026     BLUE 
        run: python automation/scripts/generate_n1.py
      - name: Commit fiche N1
        run: |
          git config user.name "listenly-bot"
          git config user.email "bot@listenly.fr"
          git pull --rebase --autostash origin main
          git add pages/
          if git diff --staged --quiet; then
            echo "N1 deja presente."
          else
            git commit -m "Auto: fiche N1 blue-midvoice"
            git push
          fi
      - name: Deploy FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./pages/
          server-dir: /listenly.fr/fiche-geo-ia/
          exclude: |
            **/.git*
            **/.git*/**
            **/.gitkeep

  fiches-n2:
    runs-on: ubuntu-latest
    needs: fiche-n1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generation fiches episodes N2
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RSS_URL: https://feed.ausha.co/nr3wrUjDM6wG
          PODCAST_SLUG: blue-midvoice
          SPOTIFY_SHOW_URL: https://open.spotify.com/show/08stWliSX2vnARBkhahoOV
          CTA_URL: https://listenly.fr/podcast/show/blue-midvoice
          CTA_LABEL: Ecouter le podcast
          PODCAST_IMAGE_URL: https://i.postimg.cc/gJRxDqqY/CNy-Tz-No-Dc-ED2XIJ1j-GAcfy-Gp2pi-GWfc-CEh-Sgk-BSF-1400x1400.jpg
          PLAUSIBLE_DOMAIN: listenly.fr
          MAX_NEW_PER_RUN: ${{ github.event.inputs.max_new || '1' }}
          SEED_ONLY: ${{ github.event.inputs.seed_only || 'false' }}
        run: python automation/scripts/generate_episode_fiches.py
      - name: Commit fiches N2
        run: |
          git config user.name "listenly-bot"
          git config user.email "bot@listenly.fr"
          git pull --rebase --autostash origin main
          git add pages/ automation/processed_episodes_blue-midvoice.json
          if git diff --staged --quiet; then
            echo "Aucune nouvelle fiche."
          else
            git commit -m "Auto: fiches episodes blue-midvoice"
            git push
          fi
      - name: Deploy FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./pages/
          server-dir: /listenly.fr/fiche-geo-ia/
          exclude: |
            **/.git*
            **/.git*/**
            **/.gitkeep
