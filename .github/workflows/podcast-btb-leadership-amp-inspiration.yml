            <channel>
                <title>Leadership &amp; Inspiration</title>
                <atom:link href="https://feed.podbean.com/crewmontreal/feed.xml" rel="self" type="application/rss+xml"/>
                <link>https://crewmontreal.podbean.com</link>
                <description><![CDATA[<p><strong>Chez CREW M, nous croyons au pouvoir des échanges, du partage d’expériences et de la visibilité des modèles féminins pour faire progresser notre industrie.</strong></p>
            <p>C’est dans cet esprit que nous avons créé Leadership &amp; Inspiration, un balado qui met en lumière des femmes qui façonnent l’immobilier commercial d’aujourd’hui et de demain. À travers des conversations authentiques et inspirantes avec des femmes d’exception — membres CREW M ou invitées —, nous rencontrons des leaders, entrepreneures, professionnelles et bâtisseuses qui partagent avec générosité leur parcours, les défis qu’elles ont surmontés, leurs réussites et les apprentissages qui ont marqué leur cheminement.</p>
            <p>Au fil des épisodes, nous explorons des thèmes qui sont au cœur de notre mission : le leadership et la culture d’entreprise, le repreneuriat et la croissance, l’entrepreneuriat, ainsi que la relève. Nous souhaitons offrir à notre communauté des réflexions porteuses, des perspectives diversifiées et des outils concrets qui favorisent le développement professionnel et personnel.</p>
            <p>Avec Leadership &amp; Inspiration, nous poursuivons notre engagement à faire rayonner les femmes de l’immobilier commercial, à valoriser leurs réalisations et à créer des occasions d’apprentissage et de connexion dans l’ensemble de notre réseau.</p>]]></description>
