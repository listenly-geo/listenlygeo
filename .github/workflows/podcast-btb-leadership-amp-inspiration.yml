name: Podcast BTB — leadership-amp-inspiration

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 1'

jobs:
  podcast-btb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer ffmpeg (necessaire pour compression audio Whisper)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Generation fiche podcast (1ere fois seulement, jamais via cron)
        if: github.event_name == 'workflow_dispatch'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PODCAST_URL: |-
            https://open.spotify.com/show/033ISxYbawHMvCNRjt1OhJ
          CONTACT_URL: |-
            https://www.linkedin.com/company/crew-m/posts/
          LISTENLY_URL: |-
            https://listenly.fr/podcast/show/leadership-inspiration
          COVER_IMAGE: |-
            https://i.postimg.cc/Hsk7BHvS/ab67656300005f1f9a76f82914a2e114c76afaab.jpg
          RSS_URL: |-
            https://feed.podbean.com/crewmontreal/feed.xml
          PODCAST_SLUG: |-
            leadership-amp-inspiration
          ACCENT_COLOR: |-
            #2e8bd6
          PODCAST_RAW_INFO: |-
