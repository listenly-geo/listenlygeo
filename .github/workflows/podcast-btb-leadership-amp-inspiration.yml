                <item>
                    <title>Leadership &amp; Inspiration | Épisode 1 : Quand le design rencontre le leadership</title>
                    <itunes:title>Leadership &amp; Inspiration | Épisode 1 : Quand le design rencontre le leadership</itunes:title>
                    <link>https://crewmontreal.podbean.com/e/leadership-inspiration/</link>
                                <comments>https://crewmontreal.podbean.com/e/leadership-inspiration/#comments</comments>        <pubDate>Thu, 02 Jul 2026 17:06:06 -0300</pubDate>
                    <guid isPermaLink="false">crewmontreal.podbean.com/b1a01686-97ca-3bd9-b2c3-bc33bc715203</guid>
                                                <description><![CDATA[<p>Chez CREW M, nous croyons au pouvoir des échanges, du partage d’expériences et de la visibilité des modèles féminins pour faire progresser notre industrie.</p>
            <p>C’est dans cet esprit que nous avons créé Leadership &amp; Inspiration, un balado qui met en lumière des femmes qui façonnent l’immobilier commercial d’aujourd’hui et de demain. À travers des conversations authentiques et inspirantes avec des femmes d’exception — membres CREW M ou invitées —, nous rencontrons des leaders, entrepreneures, professionnelles et bâtisseuses qui partagent avec générosité leur parcours, les défis qu’elles ont surmontés, leurs réussites et les apprentissages qui ont marqué leur cheminement.</p>
            Quand le design rencontre le leadership
            
            
            
            
            
            
            
            
            
            
            
            <p>Dans cet épisode de Leadership &amp; Inspiration, notre animatrice Nathalie Picard, consultante principale chez Boyden et membre engagée de CREW M depuis 2017, reçoit Julie Laforêt, vice-présidente et associée chez Folio Design, elle aussi membre CREW M. </p>
            <p>Ensemble, elles explorent le parcours inspirant de Julie, son cheminement entrepreneurial ainsi que les étapes qui l'ont menée à devenir associée au sein de son entreprise. Elles discutent également de l'évolution de l'immobilier commercial et de son influence sur le design d'intérieur, de l'importance du développement professionnel et des qualités de leadership essentielles pour faire évoluer une organisation dans un secteur en constante transformation. </p>
            <p>Une conversation authentique qui met en lumière le pouvoir de l'audace, de la vision et de l'innovation, tout en offrant des réflexions concrètes pour les professionnels.elles qui souhaitent faire progresser leur carrière et contribuer à l'avenir de l'industrie. </p>
            <p>Bonne écoute! </p>
            
            
            
            
             
            
            
            
            
            
            
            
            
            
             ]]></description>
