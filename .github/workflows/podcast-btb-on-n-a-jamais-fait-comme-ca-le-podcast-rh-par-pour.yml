on:
  workflow_dispatch:

jobs:
  fiche-podcast-btb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generation fiche podcast-btb
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PODCAST_URL: |-
            https://open.spotify.com/show/2p1Qz42ipkNCaq38aGhJPM
          CONTACT_URL: |-
            https://www.linkedin.com/company/on-n-a-jamais-fait-comme-ca/posts/
          LISTENLY_URL: |-
            https://listenly.fr/podcast/show/on-na-jamais-fait-comme
          COVER_IMAGE: |-
            https://i.postimg.cc/bwfY2xLy/Kn5qib-Pd-Xdmver8j-Hk1J9Yfj7wqs6zin7Fv0GFOx-1400x1400.jpg
          PODCAST_SLUG: |-
            on-n-a-jamais-fait-comme-ca-le-podcast-rh-par-pour
          ACCENT_COLOR: |-
            #2e8bd6
          PODCAST_RAW_INFO: |-
            On n'a jamais fait comme ça - Le podcast RH par & pour les DRH : Ressources humaines recrutement marque employeur et veille RH
            
            Podcast recrutement, RH, marque employeur, IA et transformation du travail. On n'a jamais fait comme ça est LE podcast des DRH, RRH et professionnels des Ressources Humaines qui veulent faire autrement. Vous entendez souvent "On n'a jamais fait comme ça" dans votre entreprise ? Moi aussi. Et c'est justement pour ça que j'ai créé ce podcast Ressources Humaines Chaque épisode, une conversation sans langue de bois entre DRH, dirigeant·es et expert·es RH pour : ✅ Découvrir des approches RH innovantes ✅ Comprendre les enjeux Ressources Humaines actuels (IA, recrutement, marque employeur, engagement) ✅ S'inspirer de solutions concrètes et faire sa veille RH ✅ Repenser son métier de DRH, RRH ou recruteur Je suis Florent Letourneur (https://florentletourneur.fr/), ex DRH, fondateur de We Feel Good (http://www.wefeelgoodrh.com) (agence conseil marque employeur et communication RH) et cofondateur d'Orenda (https://www.orenda-rh.fr/) (cabinet de recrutement spécialisé dans les métiers RH). Je reçois des DRH, dirigeant·es et spécialistes RH comme Thomas Chardin, Alexis Eve, Laurent Brouat, Charlène Hemery, Maud Grenier, Léo Bernard ou Nicolas Pasetti. Au programme : ➡️ Recrutement, sourcing, formation, intégration, onboarding ➡️ Marque employeur, communication RH et communication interne ➡️ Culture d'entreprise, engagement, fidélisation, QVCT ➡️ Diversité, inclusion, RSE, IA et RH ➡️ Leadership, management, carrière, droit du travail, transformation RH Ce podcast RH est pour vous si vous êtes : DRH, RRH, HRBP ou professionnel·le des ressources humaines Dirigeant·e, manager ou fondateur·ice intéressé·e par les sujets humains Recruteur, consultant ou freelance RH Étudiant·e en RH ou passionné·e par l'avenir du travail Maintenant prenez place, et bonne écoute ! Le podcast vous a plu ? 📌 Abonnez-vous sur Apple Podcasts, Spotify ou votre plateforme préférée 📩 Rejoignez le site officiel du podcast (https://onnajamaisfaitcommeca.fr/) &amp; la newsletter dédiée (https://onnajamaisfaitcommeca.substack.com/) ⭐ Notez 5 étoiles et partagez le podcast autour de vous ▬▬ WE FEEL GOOD ▬▬ We Feel Good est l'agence qui aide les entreprises à activer leur marque employeur et renforcer leur communication RH, avec des solutions sur mesure. → Audit RH, Conseil et Stratégie RH, Branding et Plateforme Marque Employeur, Création de contenu RH, Achats Médias RH, Programme Ambassadeurs, Campagnes d'activation, Formations, Expérience candidats et Expérience collaborateurs → www.wefeelgoodrh.com (http://www.wefeelgoodrh.com) ▬▬ ORENDA ▬▬ Orenda est le cabinet de recrutement spécialisé dans les métiers des Ressources Humaines : DRH, RRH, HRBP, Talent Acquisition, Formation, Paie, Compensation &amp; Benefits. → Recrutement off market confidentiel + communauté gratuite et confidentielle de pairs RH → https://www.orenda-rh.fr/ Hébergé par Ausha. Visitez ausha.co/fr/politique-de-confidentialite pour plus d'informations.
            
            (Copyright : Florent LETOURNEUR)
            
