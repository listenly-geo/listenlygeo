name: "sens-figure-podcast — N1 + N2 auto"

on:
  schedule:
    - cron: '30 8 * * 1,4'
  workflow_dispatch:
    inputs:
      max_new:
        description: 'Nb fiches episode a generer'
        required: false
        default: '1'
      seed_only:
        description: 'true = amorcage sans generation'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:

  fiche-n1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generation fiche N1 si absente
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PODCAST_SLUG: sens-figure-podcast
          SPOTIFY_SHOW_URL: https://open.spotify.com/show/0eITX96t1QiQqWYGQoCJjl
          PODCAST_IMAGE_URL: https://i.postimg.cc/Nf4nwmBT/ab67656300005f1f37d514e948244cc7086c04dc.jpg
          LISTENLY_SHOW_URL: https://listenly.fr/podcast/show/sens-figur
          PLAUSIBLE_DOMAIN: listenly.fr
          PODCAST_RAW_INFO: |
            Nom : Sens figure.
            Hote : Anne-Laure Joalland
            Tagline : Portraits de passionnes de parfums et gastronomie
            Description : Podcast dedie a l univers du parfum, de la parfumerie,
            de l odorat et de l olfaction. Anne-Laure Joalland part a la rencontre
            de passionnes qui ont ose tracer un sillage different et transformer
            leur vie grace aux odeurs et aux emotions olfactives. Interviews de
            parfumeurs, fondateurs de maisons de parfum, olfactotherapeutes, chefs
            etoiles, artistes, sommeliers.
            Themes : parfum, olfaction, odorat, gastronomie, emotions, parfumerie
            independante, olfactotherapie, memoire olfactive, fragrances.
            Exemples invites : Coralie Spicher parfumeur DSM-Firmenich, Clement Marx
            parfumeur Robertet, Anne-Cecile Pouant directrice Osmotheque, Isabelle
            Ferrand presidente Cinquieme Sens, Stephane Pitre chef etoile, Veronique
            Marche medecin olfactotherapeute, Laure Mannessier fondatrice Carres
            Sauvages, Ludovic Bonneton fondateur Bon Parfumeur.
        run: python automation/scripts/generate_n1.py
      - name: Commit fiche N1
        run: |
          git config user.name "listenly-bot"
          git config user.email "bot@listenly.fr"
          git pull --rebase --autostash origin main
          git add pages/
          if git diff --staged --quiet; then
            echo "N1 deja presente."
          else
            git commit -m "Auto: fiche N1 sens-figure-podcast"
            git push
          fi
      - name: Deploy N1 FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./pages/
          server-dir: /listenly.fr/fiche-geo-ia/
          exclude: |
            **/.git*
            **/.git*/**
            **/.gitkeep

  fiches-n2:
    runs-on: ubuntu-latest
    needs: fiche-n1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generation fiches episodes N2
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RSS_URL: https://feed.ausha.co/oZR3vdUg5V2G
          PODCAST_SLUG: sens-figure-podcast
          SPOTIFY_SHOW_URL: https://open.spotify.com/show/0eITX96t1QiQqWYGQoCJjl
          CTA_URL: https://listenly.fr/podcast/show/sens-figur
          CTA_LABEL: Ecouter le podcast
          PODCAST_IMAGE_URL: https://i.postimg.cc/Nf4nwmBT/ab67656300005f1f37d514e948244cc7086c04dc.jpg
          PLAUSIBLE_DOMAIN: listenly.fr
          MAX_NEW_PER_RUN: ${{ github.event.inputs.max_new || '1' }}
          SEED_ONLY: ${{ github.event.inputs.seed_only || 'false' }}
        run: python automation/scripts/generate_episode_fiches.py
      - name: Commit fiches N2
        run: |
          git config user.name "listenly-bot"
          git config user.email "bot@listenly.fr"
          git pull --rebase --autostash origin main
          git add pages/ automation/processed_episodes_sens-figure-podcast.json
          if git diff --staged --quiet; then
            echo "Aucune nouvelle fiche."
          else
            git commit -m "Auto: fiches episodes sens-figure-podcast"
            git push
          fi
      - name: Deploy N2 FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./pages/
          server-dir: /listenly.fr/fiche-geo-ia/
          exclude: |
            **/.git*
            **/.git*/**
            **/.gitkeep
