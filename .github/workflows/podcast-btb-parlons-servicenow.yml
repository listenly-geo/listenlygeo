            <item>
            <title>Parlons ServiceNow - 001 - CSDM</title>
            <description>
            <p>Dans cet épisode, nous allons découvrir le <b>Common Service Data Model (CSDM)</b> de ServiceNow. Pourquoi est-il un pilier indispensable pour structurer vos donnée mais aussi votre CMDB ? Nous allons démystifier ses fondations, ses domaines et ses objets clés. Enfin, je vous donnerais quelques conseil sur la manière de démarrer et de l'utiliser efficacement. Que vous soyez novice ou expert, cet épisode contient des information clés qui, je l'espère, vous aiderons dans la mise en œuvre réussie du CSDM.</p>
            </description>
            <link>
            https://shows.acast.com/parlons-servicenow/episodes/68a2493d29e2926e09ae0806
