            <item>
            <title>
            Parlons ServiceNow - 006 - Mettre de l’IA pour mettre de l’IA ? On en parle.
            </title>
            <description>
            <p>L’IA est partout.</p><p>Entre promesses marketing, buzz autour de ChatGPT, et annonces en cascade, il devient difficile de distinguer la réalité terrain du storytelling.</p><p>Dans ce nouvel épisode, j’échange avec un Xavier Gouy, CMA et architecte IA chez ServiceNow pour clarifier :</p><p>Ce qui différencie vraiment la GenAI de l’Agentic AI</p><p>Pourquoi l’IA ne remplace pas vos workflows</p><p>Les risques réels (hallucinations, prompt injection, data privacy…)</p><p>Les erreurs fréquentes des organisations qui veulent “mettre de l’IA” à tout prix</p><p>On parle architecture, adoption, maturité… et surtout on essaie de sortir du bruit ambiant.</p><p>Si vous travaillez sur des sujets IA dans votre organisation — côté IT, métier ou architecture — cet épisode devrait vous parler.</p>
            </description>
