            <item>
            <title>Parlons ServiceNow - 008 - HRSD</title>
            <description>
            <p>Dans quoi réside la vraie valeur d'une plateforme RH ?<br />Dans sa capacité à aider le métier à se focaliser sur ce qui à de l'importance.<br /></p><p>Aujourd'hui j'accueille Jérémy Potier, principal workflow architect chez ServiceNow qui a accepté de partager son expérience sur l'implémentation de HRSD.</p><p>Lors de notre échange, il a insisté sur un point fondamental : en automatisant les tâches répétitives et chronophages via ServiceNow HRSD, on libère du temps pour que les professionnels puissent se concentrer sur l'humain — leur mission principale.<br />La technologie devrait toujours permettre de faciliter la vie des utilisateurs en la simplifiant. La simplicité d’un portail unifié, la suppression des silos, la communication claire en langage compréhensible... tout ça construit une expérience employée plus fluide et donc humaine. </p><p>Et vous, qu’est-ce qui, dans votre quotidien, pourrait contribuer à recentrer l’expérience RH sur l’humain?<br /><br />#ServiceNow #HRSD #TransformationRH #ExpérienceEmployé</p>
            </description>
            <guid isPermaLink="false">2eb62827-94f6-4e24-a7dd-fffbe9828c16</guid>
            <dc:creator>Mehdi ATTAR</dc:creator>
