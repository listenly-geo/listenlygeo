            <item>
            <title>Parlons ServiceNow - 009 - Workspace</title>
            <description>
            <p>On parle beaucoup de Workspace, de Next Experience, de modernisation de l’interface…</p><p>Mais concrètement : qu’est-ce que ça change vraiment ?</p><p>Dans cet épisode où j'ai la chance d'accueillir Emmanuel Toche, CMA &amp; Solution Architect.</p><p>On prend le temps de clarifier :</p><p>• Ce qu’est réellement la Next Experience</p><p>• La différence entre UI classique &amp; Workspace</p><p>• Les gains en termes d’usage, de performance et d’adoption</p><p>• Les erreurs à éviter quand on “migre” sans réfléchir</p><p>• Et surtout : dans quels cas ça vaut vraiment le coup</p><p>Parce que passer au Workspace, ce n’est pas juste cocher une case technique.</p><p>C’est repenser l’expérience utilisateur, les rôles, les écrans, et parfois même la manière de travailler.</p><p>Si vous êtes architecte, consultant ou simplement curieux de comprendre où va l’interface ServiceNow, cet épisode devrait vous parler.</p><p>Bonne écoute !</p>
            </description>
