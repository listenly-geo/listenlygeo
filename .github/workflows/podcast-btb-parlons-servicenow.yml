            <description>
            <p>Plongez dans l'univers de la gouvernance technique avec Mehdi Attar et Jacques Clément, CMA.</p><p>Découvrez comment instaurer une cohérence durable dans vos développements et éviter les pièges des solutions improvisées.</p><p>Jacques partagera notamment ses astuces pour transformer la gouvernance en un espace d'échange et d'innovation, tout en gardant des processus simples et inclusifs.</p><p><br /></p><p>Prêt à améliorer votre votre collaboration technique autour de la plateforme IA ServiceNow ? Commencez dès maintenant, même à petite échelle en ne manquant pas cet épisode inspirant !</p><hr />
