            <item>
            <title>Parlons ServiceNow - 007 - Custom apps</title>
            <description>
            <p>Pour développer une application métier, faut-il <br /> Soit construire directement sur <b>ServiceNow</b> <br /> Soit développer avec d’autres technologies ?</p><p>Dans ce nouvel épisode, j’échange avec Jean-Charles Guillaume, CMA &amp; Solution Architect pour clarifier :</p><ul><li>Ce qu’est vraiment une <i>custom app</i> sur ServiceNow</li><li>Dans quels cas c’est un accélérateur</li><li>Quand ça peut devenir une mauvaise idée</li><li>Les impacts en termes d’architecture, de gouvernance et de coûts</li><li>Les erreurs fréquentes qu’on voit sur les projets</li></ul><p>Créer une custom app, ce n’est pas juste “faire du développement sur la plateforme”.<br />C’est un choix structurant pour le SI.</p><p>Si vous êtes architecte, consultant ou décideur et que vous vous posez la question “on le fait dans ServiceNow ou ailleurs ?” — cet épisode devrait vous intéresser.<br /><br />Bonne écoute !</p>
            </description>
