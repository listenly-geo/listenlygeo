            <item>
            <title>Parlons ServiceNow - 010 - Impact</title>
            <description>
            <p><b>ServiceNow Impact : comment en faire un vrai levier de pilotage de votre plateforme ?</b></p><p>Pour ce nouvel épisode de <b>Parlons ServiceNow</b>, je reçois <b>Eric</b>, Certified Master Architect et Practice Lead APAC chez Atos. Il accompagne au quotidien des clients — notamment dans la banque et l'assurance — pour tirer le meilleur d'Impact.</p><p>Si vous vous êtes déjà posé ces questions, cet épisode est pour vous :</p><p>→ J'ai Impact, mais par où je commence concrètement entre tous ces outils ? <br />→ Comment prouver à ma direction que notre plateforme est saine — et bien construite ? <br />→ « Ma plateforme a 10 ans et part dans tous les sens : je repars de zéro ou je corrige ? »<br />→ Les accélérateurs, ça va vraiment me faire gagner du temps sur mes implémentations ? <br />→ Je paie pour des dizaines de modules ServiceNow… comment être sûr d'en avoir pour mon argent ? <br />→ Avec l'IA générative, est-ce que mon métier d'architecte tient encore la route ?</p><p>Ce que vous y trouverez :</p><ul><li>La différence claire entre piloter sa gouvernance (Impact) et délivrer ses projets (NowCreate, Success Packs)</li><li>Le HealthScan comme arbitre pour trancher : reconstruire ou faire évoluer sa plateforme</li><li>La Capability Map pour adopter ServiceNow de façon <i>intentionnelle</i>, et arrêter de payer pour des features qui dorment</li></ul><p>Pour les <b>architectes, responsables de plateforme et décideurs IT/HR</b> qui veulent exploiter Impact à son plein potentiel.</p><p>Et vous, comment Impact s'intègre-t-il dans votre gouvernance ServiceNow ?</p><p>#ServiceNow #ChangeManagement #theworldworkswithservicenow</p>
            </description>
            <guid isPermaLink="false">22d47659-6caa-4b7e-b2e6-06adaca658ee</guid>
            <dc:creator>Mehdi ATTAR</dc:creator>
