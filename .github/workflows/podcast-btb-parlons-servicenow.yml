            <item>
            <title>
            Parlons ServiceNow - 003 - Strategic Portfolio Management
            </title>
            <description>
            <p>Dans cet épisode de <i>Parlons ServiceNow</i>, nous plongeons dans l’univers du <b>Strategic Portfolio Management (SPM)</b>.</p><p>Comment s’assurer que les initiatives, projets et ressources d’une organisation soutiennent réellement sa stratégie ?</p><p>Comment transformer une vision en exécution mesurable et pilotée par la valeur ?</p><p>Avec notre invité <a rel="noopener noreferrer nofollow" href="https://fr.linkedin.com/in/mathiasbrannens" target="_blank">Mathias Brannens</a>, nous explorons :</p><ul><li>Les défis rencontrés par les entreprises pour relier la stratégie à l’action.</li><li>Le rôle de <b>ServiceNow SPM</b> dans la planification, la priorisation et le suivi des initiatives.</li><li>Les bonnes pratiques pour <b>démarrer simplement</b> et <b>impliquer les équipes</b>.</li><li>Et enfin, comment mesurer la <b>valeur réelle</b> créée par les portefeuilles et programmes.</li></ul><p>Un épisode incontournable pour tous ceux qui veulent passer de la planification stratégique à la performance concrète — et faire de ServiceNow un véritable levier de transformation.</p>
            </description>
            <link>
            https://shows.acast.com/parlons-servicenow/episodes/68ff2f128a1151f617a80f60
            </link>
