            <item>
            <title>
            Parlons ServiceNow - 005 - ServiceNow AI Consultant
            </title>
            <description>
            <p>Dans cet épisode, la discussion a naturellement évolué vers une question centrale : <b>comment utiliser l’IA de manière pertinente auprès de nos clients, et ce que cela change réellement pour le métier de consultant</b>.</p><p><br /></p><p>On y parle sans fantasme ni discours marketing de la place que l’IA peut prendre dans les missions de conseil, côté fonctionnel comme technique. Pas pour “faire de l’IA à tout prix”, mais pour comprendre <b>où elle apporte une vraie valeur</b>, et où elle ne fait que déplacer le problème.</p><p><br /></p><p>L’échange aborde aussi l’impact sur notre métier : évolution des compétences, posture du consultant, relation avec les clients, et risques d’une adoption trop rapide ou mal cadrée.</p><p>Un épisode sans promesse magique, pour prendre du recul sur un sujet qui s’impose déjà dans nos missions.</p>
            </description>
