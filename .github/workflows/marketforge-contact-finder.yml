name: MarketForge — Qui contacter (decideur + score)

# Module separe du moteur d'envoi : cherche le fondateur / responsable marketing de chaque prospect "Pret"
# et calcule un score de priorite. Ecrit UNIQUEMENT les colonnes S a X du Sheet (jamais A a R).
# Si ce module plante, la machine d'envoi continue normalement (aucun lien entre les deux).

on:
  workflow_dispatch:
    inputs:
      dry:
        description: '1 = ne rien ecrire dans le Sheet (essai)'
        required: false
        default: '0'
      max:
        description: 'Nombre max de prospects recherches'
        required: false
        default: '40'
  schedule:
    - cron: '30 1 * * *'   # chaque nuit (01h30 UTC)

permissions:
  contents: write

concurrency:
  group: marketforge-contact-finder
  cancel-in-progress: false

jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Recherche des decideurs
        continue-on-error: true
        env:
          MFE_SHEET_URL: ${{ secrets.MFE_SHEET_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CONTACT_DRY: ${{ github.event.inputs.dry }}
          CONTACT_MAX: ${{ github.event.inputs.max || '40' }}
        run: python automation/scripts/contact_finder.py
      - name: Commit de l'etat (dates, scores, aucun nom ni email)
        if: always()
        run: |
          git config user.name  "listenly-bot"
          git config user.email "bot@listenly.fr"
          git add automation/marketforge_engine/contact_state.json
          if git diff --staged --quiet; then exit 0; fi
          git commit -q -m "Auto: MarketForge — module Qui contacter (etat)"
          for i in 1 2 3 4 5 6 7 8; do
            if git pull -q --rebase --autostash -X theirs origin main && git push -q; then break; fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 3))
          done
