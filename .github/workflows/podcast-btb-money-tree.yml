name: Podcast BTB — money-tree

on:
  workflow_dispatch:
  schedule:
    - cron: '0 15 * * 5'

jobs:
  podcast-btb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer ffmpeg (necessaire pour compression audio Whisper)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Generation fiche podcast (lancement manuel uniquement)
        if: github.event_name == 'workflow_dispatch'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RSS_URL: |-
            https://feed.ausha.co/o9zZmu5PEj2P
          PODCAST_URL: |-
            https://open.spotify.com/show/79tb3Ax5jQqBXTy0tGLWdW
          CONTACT_URL: |-
            https://www.linkedin.com/company/money-tree-podcast/posts/?lipi=urn%3Ali%3Apage%3Ad_flagship3_search_srp_all%3BAvH1n20WSFSDamAg%2BkhbPw%3D%3D
          CONTACT_LABEL: |-
            Money tree podcast
          LISTENLY_URL: |-
            https://listenly.fr/podcast/show/money-tree
          COVER_IMAGE: |-
            https://i.postimg.cc/pV1L2pMh/h-Uifr-Tv2Jxu6jf9gpb-Td-Qrq24fgdc-Fk-Gp-N5Th-MFs-400x400.jpg
          PODCAST_SLUG: |-
            money-tree
          ACCENT_COLOR: |-
            #2e8bd6
          LANGUAGE: |-
            fr
        run: python automation/scripts/generate_podcast_btb.py

      - name: Generation 1 fiche episode max (cron hebdomadaire uniquement, jamais au lancement manuel)
        if: github.event_name == 'schedule'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PODCAST_SLUG: |-
            money-tree
          MAX_EPISODES: '1'
          USE_TRANSCRIPT: 'true'
        run: python automation/scripts/generate_episode_fiches_btb.py

      - name: Commit fiches
        run: |
          git config user.name  "listenly-bot"
          git config user.email "bot@listenly.fr"
          git pull --rebase --autostash origin main
          git add pages/podcast-btb/
          if git diff --staged --quiet; then
            echo "Rien de nouveau."
          else
            git commit -m "Auto: podcast-btb money-tree"
            git push
          fi

      - name: Deploy FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:    ${{ secrets.FTP_SERVER }}
          username:  ${{ secrets.FTP_USERNAME }}
          password:  ${{ secrets.FTP_PASSWORD }}
          local-dir: ./pages/podcast-btb/
          server-dir: /listenly.fr/podcast-btb/
          exclude: |
            **/.git*
            **/.git*/**
            **/.gitkeep
