name: "tendances-inno — N1 + N2 auto"

on:
  schedule:
    - cron: '0 13 * * 1,3,5'
  workflow_dispatch:
    inputs:
      max_new:
        description: 'Nb fiches episode a generer'
        required: false
        default: '1'
      seed_only:
        description: 'true = amorcage sans generation'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:

  fiche-n1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generation fiche N1 si absente
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PODCAST_SLUG: tendances-inno
          SPOTIFY_SHOW_URL: https://open.spotify.com/show/4jgVoZQWme3EryLzJAXWXJ
          PODCAST_IMAGE_URL: https://i.postimg.cc/dV4BxwNZ/Uo2zfx-Lup-JHNDmq-Tr7d-TUe-GZr-FE9o-Xasx-Vx-EGSjr-1400x1400.jpg
          LISTENLY_SHOW_URL: https://listenly.fr/podcast/show/tendance-inno
          PLAUSIBLE_DOMAIN: listenly.fr
          PODCAST_RAW_INFO: |
            « Tendances INNO » le podcast Innovation de Docaposte 💥 Bienvenue dans « Tendances INNO », le podcast de Docaposte pour tout savoir sur les technologies émergentes, sous le signe de la tech et de l"innovation ! Nous vous proposons de partir à la rencontre de celles et ceux qui innovent et qui créent, qui s’intéressent, se questionnent et souhaitent comprendre et transmettre à leur tour la connaissance et la compréhension de ces changements numériques de premier plan. Ce podcast est animé par Marine Adatto, co-fondatrice de La Légende, Olivier Senot, Directeur de l"Innovation chez Docaposte et
        run: python automation/scripts/generate_n1.py
      - name: Commit fiche N1
        run: |
          git config user.name "listenly-bot"
          git config user.email "bot@listenly.fr"
          git pull --rebase --autostash origin main
          git add pages/
          if git diff --staged --quiet; then
            echo "N1 deja presente."
          else
            git commit -m "Auto: fiche N1 tendances-inno"
            git push
          fi
      - name: Deploy FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./pages/
          server-dir: /listenly.fr/fiche-geo-ia/
          exclude: |
            **/.git*
            **/.git*/**
            **/.gitkeep

  fiches-n2:
    runs-on: ubuntu-latest
    needs: fiche-n1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generation fiches episodes N2
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RSS_URL: https://feed.ausha.co/rwEkaFRmXAv6
          PODCAST_SLUG: tendances-inno
          SPOTIFY_SHOW_URL: https://open.spotify.com/show/4jgVoZQWme3EryLzJAXWXJ
          CTA_URL: https://listenly.fr/podcast/show/tendance-inno
          CTA_LABEL: Ecouter le podcast
          PODCAST_IMAGE_URL: https://i.postimg.cc/dV4BxwNZ/Uo2zfx-Lup-JHNDmq-Tr7d-TUe-GZr-FE9o-Xasx-Vx-EGSjr-1400x1400.jpg
          PLAUSIBLE_DOMAIN: listenly.fr
          MAX_NEW_PER_RUN: ${{ github.event.inputs.max_new || '1' }}
          SEED_ONLY: ${{ github.event.inputs.seed_only || 'false' }}
        run: python automation/scripts/generate_episode_fiches.py
      - name: Commit fiches N2
        run: |
          git config user.name "listenly-bot"
          git config user.email "bot@listenly.fr"
          git pull --rebase --autostash origin main
          git add pages/ automation/processed_episodes_tendances-inno.json
          if git diff --staged --quiet; then
            echo "Aucune nouvelle fiche."
          else
            git commit -m "Auto: fiches episodes tendances-inno"
            git push
          fi
      - name: Deploy FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./pages/
          server-dir: /listenly.fr/fiche-geo-ia/
          exclude: |
            **/.git*
            **/.git*/**
            **/.gitkeep
