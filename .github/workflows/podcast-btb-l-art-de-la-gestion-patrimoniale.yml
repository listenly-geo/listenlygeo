name: Podcast BTB — l-art-de-la-gestion-patrimoniale

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * 1'

jobs:
  podcast-btb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generation fiche podcast (lancement manuel uniquement)
        if: github.event_name == 'workflow_dispatch'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PODCAST_URL: |-
            https://open.spotify.com/show/625OkaaM4bxdGdNyqXlK12
          CONTACT_URL: |-
            https://www.linkedin.com/in/j%C3%A9r%C3%A9my-doyen-334335151/?skipRedirect=true
          CONTACT_LABEL: |-
            le cabinet Bonnet & Doyen Conseil
          LISTENLY_URL: |-
            https://listenly.fr/podcast/show/lart-de-la-gestion-patrimoniale
          COVER_IMAGE: |-
            https://i.postimg.cc/RVfvMmKG/images.jpg
          RSS_URL: |-
            https://anchor.fm/s/da821470/podcast/rss
          PODCAST_SLUG: |-
            l-art-de-la-gestion-patrimoniale
          ACCENT_COLOR: |-
            #2e8bd6
          PODCAST_RAW_INFO: |-
            Nom du podcast : L'Art de la Gestion Patrimoniale
            
            Description : Jérémy Doyen et Guillaume Bonnet animent un podcast dédié à l'investissement, la fiscalité, l'immobilier, l'entrepreneuriat, les finances personnelles et l'argent.
            
            Chaque mercredi, ils abordent une thématique tous les 2 et/ou interrogent un invité du monde de la gestion de patrimoine !
            
            Ces invités experts (avocats fiscalistes, notaires, investisseurs, experts-comptables, etc.) interviennent à nos côtés pour démocratiser l'éducation patrimoniale !
            
            Maîtriser l'art de la gestion de patrimoine, c'est façonner votre avenir financier !
            
            Nous découvrir : https://www.bonnetdoyenconseil.com/
            
            Titres des épisodes récents :
            - #179 - Vivre à crédit pour éviter l'impôt et construire un empire financier et immobilier !
            - #178 - Le guide pour débutant pour investir 50, 100 ou 500€ par mois ! Avec Thomas CRETON
            - #177 - Le montage pour que chaque associé monte son propre empire ! (Avec notre ingénieur patrimonial)
            - #176 - Les erreurs financières qui vous coûtent des milliers d'euros chaque jour !
            - #175 - Voici la stratégie chiffrée pour prendre en main ta propre retraite !
            - #174 - Réussir son investissement dans une Start up ! La Check List de Jean Michel Karam
            - #173 - La stratégie OBO utilisée par les investisseurs immobiliers ! (SCI, Effet de levier, Fiscalité)
            - #172 - Le guide complet du PER pour utiliser vos impôts et investir en masse ! (DCA, PER, ETF)
            - #171 - La Holding pour emprunter sans limite et bâtir un empire immobilier ! (Montage fiscal et juridique vérifié)
            - #170 - La méthode pour créer son entreprise ! (choix des statuts, administratif, fiscalité) avec Laura Bellaïche
        run: python automation/scripts/generate_podcast_btb.py

      - name: Generation 1 fiche episode max (cron hebdomadaire uniquement, jamais au lancement manuel)
        if: github.event_name == 'schedule'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PODCAST_SLUG: |-
            l-art-de-la-gestion-patrimoniale
          MAX_EPISODES: '1'
        run: python automation/scripts/generate_episode_fiches_btb.py

      - name: Commit fiches
        run: |
          git config user.name  "listenly-bot"
          git config user.email "bot@listenly.fr"
          git pull --rebase --autostash origin main
          git add pages/podcast-btb/
          if git diff --staged --quiet; then
            echo "Rien de nouveau."
          else
            git commit -m "Auto: podcast-btb l-art-de-la-gestion-patrimoniale"
            git push
          fi

      - name: Deploy FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:    ${{ secrets.FTP_SERVER }}
          username:  ${{ secrets.FTP_USERNAME }}
          password:  ${{ secrets.FTP_PASSWORD }}
          local-dir: ./pages/podcast-btb/
          server-dir: /listenly.fr/podcast-btb/
          exclude: |
            **/.git*
            **/.git*/**
            **/.gitkeep
