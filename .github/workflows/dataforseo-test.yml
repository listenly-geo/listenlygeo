name: DataForSEO — simulation des formulations (manuel)

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: dataforseo-test
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
      DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Simulation des formulations (volumes DataForSEO)
        run: |
          python3 automation/scripts/keyword_dataforseo.py --file automation/scripts/simulation_formulations.txt --out pages/podcast-btb/data/keyword_simulation.json
      - name: Enregistrer le resultat
        if: always()
        run: |
          git config user.name "listenly-geo"
          git config user.email "noreply@github.com"
          git add pages/podcast-btb/data/keyword_simulation.json
          git diff --cached --quiet || git commit -m "DataForSEO : simulation des formulations (manuel)"
          git push || true
