name: Corentin Voice Engine — déploiement Apps Script

on:
  push:
    paths:
      - 'corentin-voice-engine/src/**'
      - 'corentin-voice-engine/ACTION.txt'
      - 'corentin-voice-engine/appsscript.json'
  workflow_dispatch:
    inputs:
      action:
        description: 'dry (lecture seule) / deploy (push + nouvelle version) / publish (push + version + branche le web app sur cette version)'
        required: true
        default: 'dry'

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install clasp
        run: npm install -g @google/clasp@3.0.4-alpha

      - name: Restore clasp credentials
        run: |
          mkdir -p "$HOME"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}

      - name: Determine action
        id: act
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "action=${{ github.event.inputs.action }}" >> "$GITHUB_OUTPUT"
          else
            ACTION=$(cat corentin-voice-engine/ACTION.txt 2>/dev/null | tr -d '[:space:]' || echo "dry")
            echo "action=${ACTION:-dry}" >> "$GITHUB_OUTPUT"
          fi

      - name: Show current remote state (always)
        working-directory: corentin-voice-engine
        run: |
          echo "--- clasp status ---"
          clasp status || true
          echo "--- clasp deployments ---"
          clasp deployments || true

      - name: Push code to Apps Script
        if: steps.act.outputs.action == 'deploy' || steps.act.outputs.action == 'publish'
        working-directory: corentin-voice-engine
        run: clasp push --force

      - name: Create new version
        if: steps.act.outputs.action == 'deploy' || steps.act.outputs.action == 'publish'
        working-directory: corentin-voice-engine
        id: version
        run: |
          OUT=$(clasp version "Auto-déploiement GitHub Actions $(date -u +%Y-%m-%dT%H:%M:%SZ)")
          echo "$OUT"
          VNUM=$(echo "$OUT" | grep -oE '[0-9]+' | tail -1)
          echo "version=$VNUM" >> "$GITHUB_OUTPUT"

      - name: Update web app deployment (keeps same URL)
        if: steps.act.outputs.action == 'publish'
        working-directory: corentin-voice-engine
        run: |
          DEPLOY_ID=$(cat .deployment-id 2>/dev/null || echo "")
          if [ -z "$DEPLOY_ID" ]; then
            echo "Aucun .deployment-id trouvé — déploiement initial à faire une fois manuellement (clasp deploy), puis enregistrer l'ID retourné dans corentin-voice-engine/.deployment-id"
            exit 1
          fi
          clasp deploy --deploymentId "$DEPLOY_ID" --versionNumber "${{ steps.version.outputs.version }}" --description "Auto $(date -u +%Y-%m-%dT%H:%M:%SZ)"
