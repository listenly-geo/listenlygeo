name: Debug — decrire une table admin Listenly / grep serveur (diagnostic manuel)

on:
  workflow_dispatch:
    inputs:
      tool:
        description: "table = decrire une table _c_p_% | grep = recherche recursive (equivalent grep -R) | rss = un seul appel a rss_cron_only.php | rss_catchup = boucle jusqu'a plus aucun flux en attente"
        required: true
        type: choice
        options:
          - table
          - grep
          - rss
          - rss_catchup
        default: table
      mode:
        description: "table uniquement : list (toutes les tables _c_p_%) ou describe"
        required: false
        default: "list"
      table:
        description: "table uniquement : nom exact de la table (mode=describe)"
        required: false
        default: ""
      pattern:
        description: "grep uniquement : texte a chercher (insensible a la casse) - laisser vide pour lire un fichier"
        required: false
        default: ""
      subdirs:
        description: "grep uniquement : sous-dossiers separes par virgule (vide = toute la racine)"
        required: false
        default: ""
      file:
        description: "grep uniquement : chemin d'un fichier .php a LIRE en entier (remplace pattern/subdirs si rempli)"
        required: false
        default: ""

jobs:
  table:
    if: github.event.inputs.tool == 'table'
    runs-on: ubuntu-latest
    steps:
      - name: Interroger admin-table-describe.php
        env:
          SECRET: ${{ secrets.KNOWLEDGE_IMPORT_SECRET }}
          MODE: ${{ github.event.inputs.mode }}
          TABLE: ${{ github.event.inputs.table }}
        run: |
          curl -sS -X POST https://listenly.fr/api/admin-table-describe.php \
            -H "Content-Type: application/json" \
            -H "X-Import-Secret: $SECRET" \
            -d "$(python3 -c 'import json,os; print(json.dumps({"mode": os.environ["MODE"], "table": os.environ["TABLE"]}))')" \
            | python3 -m json.tool

  rss:
    if: github.event.inputs.tool == 'rss'
    runs-on: ubuntu-latest
    steps:
      - name: Appeler debug/rss_cron_only.php (traite jusqu'a 2 flux en attente)
        run: curl -sS --max-time 170 "https://listenly.fr/debug/rss_cron_only.php"

  rss_catchup:
    if: github.event.inputs.tool == 'rss_catchup'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Boucler rss_cron_only.php jusqu'a plus aucun flux en attente
        env:
          SECRET: ${{ secrets.KNOWLEDGE_IMPORT_SECRET }}
        run: |
          for i in $(seq 1 100); do
            pending=$(curl -sS -X POST https://listenly.fr/api/admin-table-describe.php \
              -H "Content-Type: application/json" -H "X-Import-Secret: $SECRET" \
              -d '{"mode":"rss_pending"}' | python3 -c "import json,sys; print(json.load(sys.stdin).get('pending', 0))")
            echo "[$i] restant : $pending"
            if [ "$pending" -le 0 ]; then
              echo "Termine : plus aucun flux en attente."
              break
            fi
            curl -sS --max-time 280 "https://listenly.fr/debug/rss_cron_only.php" || echo "(appel echoue/trop lent, on continue avec le suivant)"
            echo ""
          done

  grep:
    if: github.event.inputs.tool == 'grep'
    runs-on: ubuntu-latest
    steps:
      - name: Interroger grep-search.php
        env:
          SECRET: ${{ secrets.KNOWLEDGE_IMPORT_SECRET }}
          PATTERN: ${{ github.event.inputs.pattern }}
          SUBDIRS: ${{ github.event.inputs.subdirs }}
          FILE: ${{ github.event.inputs.file }}
        run: |
          curl -sS -X POST https://listenly.fr/api/grep-search.php \
            -H "Content-Type: application/json" \
            -H "X-Import-Secret: $SECRET" \
            -d "$(python3 -c 'import json,os; f=os.environ.get("FILE","").strip(); subdirs=[s.strip() for s in os.environ.get("SUBDIRS","").split(",") if s.strip()]; body={"mode":"read","file":f} if f else {"pattern": os.environ["PATTERN"], "subdirs": subdirs, "max_results": 100}; print(json.dumps(body))')" \
            | python3 -m json.tool
