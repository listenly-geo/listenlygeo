name: Podcast BTB — boussole-et-trajectoires

on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * 1'

jobs:
  podcast-btb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generation fiche podcast (lancement manuel uniquement)
        if: github.event_name == 'workflow_dispatch'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PODCAST_URL: |-
            https://open.spotify.com/show/4xkF24mlON2e4VttZq5GpX
          LISTENLY_URL: |-
            https://listenly.fr/podcast/show/boussole-et-trajectoire
          COVER_IMAGE: |-
            https://i.postimg.cc/MpVq1Xdj/Chat-GPT-Image-Jul-22-2026-03-53-50-PM.png
          PODCAST_SLUG: |-
            boussole-et-trajectoires
          ACCENT_COLOR: |-
            #2e8bd6
          LANGUAGE: |-
            fr
          EPISODE_CTA_TARGET: |-
            listenly
          PODCAST_RAW_INFO: |-
            Podcast
            
            Titre : Boussole et Trajectoires
            
            Auteur : Mira
            
            À propos :
            
            Patrimoine, métiers & perspectives — les grandes conversations du secteur, sans jargon.
            
            Épisode 1
            
            Titre :
            
            Boussole et Trajectoires : L'Importance du Feedback dans le Management - Mira x Raphaël Maissonnier
            
            Description :
            
            🎙️ Bienvenue dans le premier épisode de Boussole & Trajectoires !
            
            Pour ce lancement, nous avons eu le plaisir de recevoir Raphaël Maissonnier, CEO et cofondateur de Fasterclass, organisme de formation et de coaching certifié Qualiopi, spécialisé dans le management et le développement des soft skills.
            
            Au programme : un échange passionnant autour du management, du leadership et de l'humain en entreprise. Un épisode concret, riche en exemples, en retours d'expérience et en conseils directement applicables, que vous soyez manager, salarié (gestionnaire back/middle office par exemple 👀) ou simplement curieux des dynamiques humaines au travail.
            
            Parce qu'un bon management ne se résume pas à atteindre des objectifs : il consiste aussi à créer un environnement où chacun peut s'épanouir, progresser... et prendre plaisir à travailler au quotidien.
            
            💬 N'hésitez pas à nous partager vos retours, vos expériences ou vos questions en commentaire.
            
            Bonne écoute ! 🔔 Et n'oubliez pas de vous abonner pour ne manquer aucun de nos prochains épisodes !
            
            Épisode 2
            
            Titre :
            
            Structurer son management pour garantir une experience client optimale
            
            Description :
            
            🎙️ Bienvenue dans le deuxième épisode de Boussole & Trajectoires !
            
            Nous avons eu le plaisir de recevoir Aline Ferreira Godinho, responsable relation client.
            
            Au cours de cet échange, nous abordons les enjeux du management au sein de la relation client : comment accompagner et fédérer ses équipes, faire le lien entre les collaborateurs et les clients, tout en veillant à offrir une expérience de qualité et à répondre aux attentes de chacun.
            
            Un épisode qui met en lumière l'importance de la communication, de l'écoute et de l'humain dans la réussite d'une relation client durable et performante.
            
            💬 N'hésitez pas à nous partager vos retours, vos expériences ou vos questions en commentaire.
            
            Bonne écoute ! 🔔 Et n'oubliez pas de vous abonner pour ne manquer aucun de nos prochains épisodes !
        run: python automation/scripts/generate_podcast_btb.py

      - name: Generation 1 fiche episode max (cron hebdomadaire uniquement)
        if: github.event_name == 'schedule'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PODCAST_SLUG: |-
            boussole-et-trajectoires
          MAX_EPISODES: '1'
        run: python automation/scripts/generate_episode_fiches_btb.py

      - name: Commit fiches
        run: |
          git config user.name  "listenly-bot"
          git config user.email "bot@listenly.fr"
          git pull --rebase --autostash origin main
          git add pages/podcast-btb/
          if git diff --staged --quiet; then
            echo "Rien de nouveau."
          else
            git commit -m "Auto: podcast-btb boussole-et-trajectoires"
            git push
          fi

      - name: Deploy FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:    ${{ secrets.FTP_SERVER }}
          username:  ${{ secrets.FTP_USERNAME }}
          password:  ${{ secrets.FTP_PASSWORD }}
          local-dir: ./pages/podcast-btb/
          server-dir: /listenly.fr/podcast-btb/
          exclude: |
            **/.git*
            **/.git*/**
            **/.gitkeep
