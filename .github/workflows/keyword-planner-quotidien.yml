name: Keyword Planner — volumes quotidiens (questions de moment)

# Chaque jour, Google Ads donne le volume mensuel des questions de moment.
# Ecrit seulement pages/podcast-btb/data/keyword_planner.json, lu par le moteur des moments.
on:
  workflow_dispatch:
    inputs:
      themes:
        description: 'Test : 1 pour envoyer les thèmes courts au lieu des fiches (écrit un fichier séparé)'
        required: false
        default: ''
  schedule:
    - cron: '30 3 * * *'

permissions:
  contents: write

concurrency:
  group: keyword-planner-quotidien
  cancel-in-progress: false

jobs:
  volumes:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Volumes Google Ads des questions de moment
        env:
          GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
          GOOGLE_ADS_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_CUSTOMER_ID }}
        run: |
          if [ -n "${{ github.event.inputs.themes }}" ]; then export KP_THEMES=1 KP_OUT=pages/podcast-btb/data/keyword_test_themes.json; fi
          python3 automation/scripts/keyword_planner_quotidien.py
      - name: Sauvegarde du résultat
        run: |
          git config user.name "marketforge-bot"; git config user.email "bot@listenly.fr"
          git add pages/podcast-btb/data/keyword_planner.json pages/podcast-btb/data/keyword_test_themes.json pages/podcast-btb/data/demande_par_fiche.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "Rien de nouveau à enregistrer"; exit 0; fi
          git commit -m "Volumes Google Ads des questions de moment (quotidien)"
          for i in 1 2 3; do
            if git pull -q --rebase && git push -q; then echo "Sauvegarde OK"; exit 0; fi
            echo "Essai $i échoué, nouvelle tentative dans 15 s"; sleep 15
          done
          echo "Sauvegarde impossible après 3 essais"; exit 1
