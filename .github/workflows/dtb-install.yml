name: DocTheBuilder - installation par FTP (o2switch)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "test-ftp = verifier l'acces FTP (rien d'installe) | install = installer DocTheBuilder"
        default: "test-ftp"
        required: true
concurrency:
  group: dtb-install
  cancel-in-progress: false
jobs:
  dtb:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Test FTP (lecture + ecriture d'un petit fichier, puis suppression)
        if: github.event.inputs.mode == 'test-ftp'
        run: |
          for v in FTP_SERVER FTP_USERNAME FTP_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::secret $v manquant"; exit 1; fi
          done
          U="ftp://$FTP_SERVER"
          note() { printf '%s' "$2" | tr '\n' ' ' | cut -c1-900 | sed "s/^/::notice title=$1::/"; echo; }
          opts="--ssl-reqd --insecure --connect-timeout 20 --max-time 60 -sS"
          R=$(curl $opts --user "$FTP_USERNAME:$FTP_PASSWORD" "$U/" -l 2>&1) || { M="FTPS KO: $R"; opts="--connect-timeout 20 --max-time 60 -sS"; R=$(curl $opts --user "$FTP_USERNAME:$FTP_PASSWORD" "$U/" -l 2>&1); }
          note "racine FTP ($(echo $opts | cut -c1-12))" "$R"
          D=$(curl $opts --user "$FTP_USERNAME:$FTP_PASSWORD" "$U/app.marketforge.fr/" -l 2>&1); note "dossier app.marketforge.fr" "$D"
          echo test > /tmp/dtb-test.txt
          W=$(curl $opts --user "$FTP_USERNAME:$FTP_PASSWORD" -T /tmp/dtb-test.txt "$U/app.marketforge.fr/dtb-test.txt" 2>&1 && echo ECRITURE_OK); note "ecriture" "$W"
          X=$(curl $opts --user "$FTP_USERNAME:$FTP_PASSWORD" -Q "-DELE app.marketforge.fr/dtb-test.txt" "$U/" -o /dev/null 2>&1 && echo SUPPRESSION_OK); note "suppression" "$X"
