name: Journal des erreurs MarketForge

# Se declenche a la fin de chaque workflow MarketForge et note les etapes en echec (avec le message) dans
# automation/marketforge_engine/journal.json.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Numero du run a relever (lancement manuel)'
        required: true
      etape:
        description: 'Optionnel : nom (ou debut) d une etape dont on veut lire le log'
        required: false
        default: ''
  workflow_run:
    workflows:
      - "Apps Script — lecture / déploiement de MarketForgeEngine.gs"
      - "MarketForge — Qui contacter (decideur + score)"
      - "MarketForge Engine — Extraction quotidienne (file d'attente)"
      - "MarketForge Engine — RUN COMPLET (découverte → Listenly + N1 → email → contact)"
      - "MarketForge Engine — Onboarding auto (Listenly SQL + fiche N1)"
      - "MarketForge — Commande de test (Sheet / mails)"
      - "Envoi de secours (cadence 15 min)"
    types: [completed]

permissions:
  contents: write
  actions: read

concurrency:
  group: marketforge-journal
  cancel-in-progress: false

jobs:
  journal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Relever les erreurs du run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id || github.event.inputs.run_id }}
          ETAPE: ${{ github.event.inputs.etape }}
        run: python3 automation/scripts/journal_erreurs.py
      - name: Enregistrer
        run: |
          git config user.name "marketforge-bot"; git config user.email "bot@listenly.fr"
          git add automation/marketforge_engine/journal.json automation/marketforge_engine/journal_log.txt || true
          git diff --cached --quiet || (git commit -q -m "Journal des erreurs" && for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 3; done)
