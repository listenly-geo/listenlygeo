name: "terrain-brut-podcast — N1 + N2 auto"

on:
  schedule:
    - cron: '30 8 * * 1,4'
  workflow_dispatch:
    inputs:
      max_new:
        description: 'Nb fiches episode a generer'
        required: false
        default: '1'
      seed_only:
        description: 'true = amorcage sans generation'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:

  fiche-n1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generation fiche N1 si absente
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PODCAST_SLUG: terrain-brut-podcast
          SPOTIFY_SHOW_URL: https://open.spotify.com/show/4FvR55sHFnyfjkwyyrUiBD
          PODCAST_IMAGE_URL: https://i.postimg.cc/hPy3sTrj/ab67656300005f1fd8899d63ae8b99f5db4e6ca9.jpg
          LISTENLY_SHOW_URL: https://listenly.fr/podcast/show/terrain-brut
          PLAUSIBLE_DOMAIN: listenly.fr
          PODCAST_RAW_INFO: |
            <rss version="2.0"> <channel> <title>Terrain Brut</title> <description> <p>Bienvenue sur Terrain Brut, le podcast qui aide les experts et dirigeants de Suisse romande à partager leur expertise brute obtenue sur le terrain. <br /></p><p>Je suis Blaise Depallens et ça fait 10 ans que je crée du contenu sous forme de photo, vidéo ou encore podcast. A travers mon parcours j"ai pu observer ce qui sépare ceux qui deviennent des références dans leur marché de ceux qui restent invisibles malgré une vraie expertise. <br /><br />Récemment, j"ai co-fondé Signofil Médias : un studio qui transforme l"exper
        run: python automation/scripts/generate_n1.py
      - name: Commit fiche N1
        run: |
          git config user.name "listenly-bot"
          git config user.email "bot@listenly.fr"
          git pull --rebase --autostash origin main
          git add pages/
          if git diff --staged --quiet; then
            echo "N1 deja presente."
          else
            git commit -m "Auto: fiche N1 terrain-brut-podcast"
            git push
          fi
      - name: Deploy FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./pages/
          server-dir: /listenly.fr/fiche-geo-ia/
          exclude: |
            **/.git*
            **/.git*/**
            **/.gitkeep

  fiches-n2:
    runs-on: ubuntu-latest
    needs: fiche-n1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generation fiches episodes N2
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RSS_URL: https://api.riverside.fm/hosting/3ocknjsa.rss
          PODCAST_SLUG: terrain-brut-podcast
          SPOTIFY_SHOW_URL: https://open.spotify.com/show/4FvR55sHFnyfjkwyyrUiBD
          CTA_URL: https://listenly.fr/podcast/show/terrain-brut
          CTA_LABEL: Ecouter le podcast
          PODCAST_IMAGE_URL: https://i.postimg.cc/hPy3sTrj/ab67656300005f1fd8899d63ae8b99f5db4e6ca9.jpg
          PLAUSIBLE_DOMAIN: listenly.fr
          MAX_NEW_PER_RUN: ${{ github.event.inputs.max_new || '1' }}
          SEED_ONLY: ${{ github.event.inputs.seed_only || 'false' }}
        run: python automation/scripts/generate_episode_fiches.py
      - name: Commit fiches N2
        run: |
          git config user.name "listenly-bot"
          git config user.email "bot@listenly.fr"
          git pull --rebase --autostash origin main
          git add pages/ automation/processed_episodes_terrain-brut-podcast.json
          if git diff --staged --quiet; then
            echo "Aucune nouvelle fiche."
          else
            git commit -m "Auto: fiches episodes terrain-brut-podcast"
            git push
          fi
      - name: Deploy FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./pages/
          server-dir: /listenly.fr/fiche-geo-ia/
          exclude: |
            **/.git*
            **/.git*/**
            **/.gitkeep
