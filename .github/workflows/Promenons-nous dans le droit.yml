name: "Promenons-nous dans le droit — N1 + N2 auto"

on:
  schedule:
    - cron: '0 13 * * 1,3,5'
  workflow_dispatch:
    inputs:
      max_new:
        description: 'Nb fiches episode a generer'
        required: false
        default: '1'
      seed_only:
        description: 'true = amorcage sans generation'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:

  fiche-n1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generation fiche N1 si absente
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PODCAST_SLUG: Promenons-nous dans le droit
          SPOTIFY_SHOW_URL: https://open.spotify.com/show/4dpDd92th36w6vkK9zOUCu
          PODCAST_IMAGE_URL: https://i.postimg.cc/cCvFBL3x/8Z0fgw-Rpv-Np-Q3i-Axy-FJUljy-UJSa-EI2s-PZq-GO7wu-M-400x400.jpg
          LISTENLY_SHOW_URL: https://listenly.fr/podcast/show/promenons-nous-dans-le-droit
          PLAUSIBLE_DOMAIN: listenly.fr
          PODCAST_RAW_INFO: |
            Promenons-nous dans le droit... Une promenade juridique par des juristes, pour des juristes. Nous vous invitons à une balade régulière pour évoquer des thèmes choisis par nos invités, dans toutes les branches du droit. Une émission conçue pour être écoutée comme une conversation au coin du feu. Hébergé par Ausha. Visitez ausha.co/fr/politique-de-confidentialite pour plus d"informations. (Copyright : Marie-Paule Melka)     Episode 12 : Promenons-nous avec... Thibaut Larrouturou [la procédure devant la CEDH]     Download     Mon, 29 Jun 2026     Episode 11 - Promenons-nous avec... Aurore Sauviat
        run: python automation/scripts/generate_n1.py
      - name: Commit fiche N1
        run: |
          git config user.name "listenly-bot"
          git config user.email "bot@listenly.fr"
          git pull --rebase --autostash origin main
          git add pages/
          if git diff --staged --quiet; then
            echo "N1 deja presente."
          else
            git commit -m "Auto: fiche N1 Promenons-nous dans le droit"
            git push
          fi
      - name: Deploy FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./pages/
          server-dir: /listenly.fr/fiche-geo-ia/
          exclude: |
            **/.git*
            **/.git*/**
            **/.gitkeep

  fiches-n2:
    runs-on: ubuntu-latest
    needs: fiche-n1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generation fiches episodes N2
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RSS_URL: https://feed.ausha.co/wAjWwfgJP8LN
          PODCAST_SLUG: Promenons-nous dans le droit
          SPOTIFY_SHOW_URL: https://open.spotify.com/show/4dpDd92th36w6vkK9zOUCu
          CTA_URL: https://listenly.fr/podcast/show/promenons-nous-dans-le-droit
          CTA_LABEL: Ecouter le podcast
          PODCAST_IMAGE_URL: https://i.postimg.cc/cCvFBL3x/8Z0fgw-Rpv-Np-Q3i-Axy-FJUljy-UJSa-EI2s-PZq-GO7wu-M-400x400.jpg
          PLAUSIBLE_DOMAIN: listenly.fr
          MAX_NEW_PER_RUN: ${{ github.event.inputs.max_new || '1' }}
          SEED_ONLY: ${{ github.event.inputs.seed_only || 'false' }}
        run: python automation/scripts/generate_episode_fiches.py
      - name: Commit fiches N2
        run: |
          git config user.name "listenly-bot"
          git config user.email "bot@listenly.fr"
          git pull --rebase --autostash origin main
          git add pages/ automation/processed_episodes_Promenons-nous dans le droit.json
          if git diff --staged --quiet; then
            echo "Aucune nouvelle fiche."
          else
            git commit -m "Auto: fiches episodes Promenons-nous dans le droit"
            git push
          fi
      - name: Deploy FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./pages/
          server-dir: /listenly.fr/fiche-geo-ia/
          exclude: |
            **/.git*
            **/.git*/**
            **/.gitkeep
