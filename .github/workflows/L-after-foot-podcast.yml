name: "L-after-foot-podcast — N1 + N2 auto"

on:
  schedule:
    - cron: '0 14 * * 1'
  workflow_dispatch:
    inputs:
      max_new:
        description: 'Nb fiches episode a generer'
        required: false
        default: '1'
      seed_only:
        description: 'true = amorcage sans generation'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:

  fiche-n1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generation fiche N1 si absente
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PODCAST_SLUG: L-after-foot-podcast
          SPOTIFY_SHOW_URL: https://open.spotify.com/show/3ixMUAbmKEYcoRt62l48Zp
          PODCAST_IMAGE_URL: https://i.postimg.cc/hvpq12QT/ab67656300005f1f6cce40e9696cac3ddeef03fd.jpg
          LISTENLY_SHOW_URL: https://listenly.fr/podcast/show/lafter-foot
          PLAUSIBLE_DOMAIN: listenly.fr
          PODCAST_RAW_INFO: |
            rss version="2.0"> <channel> <atom:link href="https://feeds.simplecast.com/VVMraBM_" rel="self" title="MP3 Audio" type="application/atom+xml"/> <atom:link href="https://simplecast.superfeedr.com" rel="hub"/> <generator>https://simplecast.com</generator> <title>L"After Foot</title> <description> L’After Foot, l"émission qui dit tout haut ce que le monde du foot pense tout bas, fête ses 20 ans cette saison ! A cette occasion, Gilbert Brisbois, Daniel Riolo et toute leur bande vous réservent pleins de surprises ! Pour démarrer la soirée, Nicolas Jamain est aux commandes de ""Génération After"", d
        run: python automation/scripts/generate_n1.py
      - name: Commit fiche N1
        run: |
          git config user.name "listenly-bot"
          git config user.email "bot@listenly.fr"
          git pull --rebase --autostash origin main
          git add pages/
          if git diff --staged --quiet; then
            echo "N1 deja presente."
          else
            git commit -m "Auto: fiche N1 L-after-foot-podcast"
            git push
          fi
      - name: Deploy FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./pages/
          server-dir: /listenly.fr/fiche-geo-ia/
          exclude: |
            **/.git*
            **/.git*/**
            **/.gitkeep

  fiches-n2:
    runs-on: ubuntu-latest
    needs: fiche-n1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generation fiches episodes N2
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RSS_URL: https://feeds.simplecast.com/VVMraBM_
          PODCAST_SLUG: L-after-foot-podcast
          SPOTIFY_SHOW_URL: https://open.spotify.com/show/3ixMUAbmKEYcoRt62l48Zp
          CTA_URL: https://listenly.fr/podcast/show/lafter-foot
          CTA_LABEL: Ecouter le podcast
          PODCAST_IMAGE_URL: https://i.postimg.cc/hvpq12QT/ab67656300005f1f6cce40e9696cac3ddeef03fd.jpg
          PLAUSIBLE_DOMAIN: listenly.fr
          MAX_NEW_PER_RUN: ${{ github.event.inputs.max_new || '1' }}
          SEED_ONLY: ${{ github.event.inputs.seed_only || 'false' }}
        run: python automation/scripts/generate_episode_fiches.py
      - name: Commit fiches N2
        run: |
          git config user.name "listenly-bot"
          git config user.email "bot@listenly.fr"
          git pull --rebase --autostash origin main
          git add pages/ automation/processed_episodes_L-after-foot-podcast.json
          if git diff --staged --quiet; then
            echo "Aucune nouvelle fiche."
          else
            git commit -m "Auto: fiches episodes L-after-foot-podcast"
            git push
          fi
      - name: Deploy FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./pages/
          server-dir: /listenly.fr/fiche-geo-ia/
          exclude: |
            **/.git*
            **/.git*/**
            **/.gitkeep
