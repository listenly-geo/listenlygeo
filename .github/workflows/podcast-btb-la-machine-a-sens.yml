name: Podcast BTB — la-machine-a-sens

on:
  workflow_dispatch:
  schedule:
    - cron: '0 11 * * 4'

jobs:
  podcast-btb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generation fiche podcast (lancement manuel uniquement)
        id: gen_podcast
        if: github.event_name == 'workflow_dispatch'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RSS_URL: |-
            https://feed.ausha.co/YPX17cvE7NkO
          PODCAST_URL: |-
            https://open.spotify.com/show/7hgVCrls5FBRMMSP6wCHs5
          LISTENLY_URL: |-
            https://listenly.fr/podcast/show/la-machine-sens
          COVER_IMAGE: |-
            https://i.postimg.cc/J0NGG2xg/d-IMd-Cx-Sg3g42cru-GD5U5d-Qvn-Xfu-L3TTo-Xgrqtwsu-1400x1400.jpg
          PODCAST_SLUG: |-
            la-machine-a-sens
          ACCENT_COLOR: |-
            #2e8bd6
          LANGUAGE: |-
            fr
          EPISODE_CTA_TARGET: |-
            listenly
        run: python automation/scripts/generate_podcast_btb.py

      - name: Generation 1 fiche episode max (cron hebdomadaire OU juste apres creation du podcast)
        if: github.event_name == 'schedule' || steps.gen_podcast.outputs.new_podcast == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PODCAST_SLUG: |-
            la-machine-a-sens
          MAX_EPISODES: '1'
        run: python automation/scripts/generate_episode_fiches_btb.py

      - name: Commit fiches
        run: |
          git config user.name  "listenly-bot"
          git config user.email "bot@listenly.fr"
          git pull --rebase --autostash origin main
          git add pages/podcast-btb/
          if git diff --staged --quiet; then
            echo "Rien de nouveau."
          else
            git commit -m "Auto: podcast-btb la-machine-a-sens"
            git push
          fi

      - name: Deploy FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:    ${{ secrets.FTP_SERVER }}
          username:  ${{ secrets.FTP_USERNAME }}
          password:  ${{ secrets.FTP_PASSWORD }}
          local-dir: ./pages/podcast-btb/
          server-dir: /listenly.fr/podcast-btb/
          exclude: |
            **/.git*
            **/.git*/**
            **/.gitkeep
