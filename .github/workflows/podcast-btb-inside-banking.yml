          PODCAST_URL: |-
            https://open.spotify.com/episode/6LvU6clYwOTH0qsf1ytBiB
          CONTACT_URL: |-
            https://www.linkedin.com/in/richardmichaud1/
          LISTENLY_URL: |-
            https://listenly.fr/podcast/show/inside-banking
          COVER_IMAGE: |-
            https://i.postimg.cc/XqnjBCn8/500x500-000000-80-0-0.jpg
          RSS_URL: |-
            https://feed.ausha.co/E5qgYFY9jYWR
          PODCAST_SLUG: |-
