name: Descriptions des podcasts depuis le flux RSS (rattrapage)

# Lit la description de chaque flux RSS (gratuit) et l'enregistre dans podcasts.json,
# puis l'affiche dans les fiches Hub qui portent encore la phrase generique.

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: backfill-description-flux
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 1. Lecture des descriptions des flux RSS
        run: python automation/scripts/backfill_description_flux.py

      - name: 2. Commit
        run: |
          git config user.name  "listenly-bot"
          git config user.email "bot@listenly.fr"
          git add pages/podcast-btb/
          if git diff --staged --quiet; then echo "Rien de nouveau."; exit 0; fi
          git commit -q -m "Auto: descriptions des podcasts depuis le flux RSS"
          ok=0
          for i in 1 2 3 4 5; do
            if git pull -q --rebase --autostash origin main && git push -q; then ok=1; break; fi
            git rebase --abort 2>/dev/null || true
            sleep $((RANDOM % 15 + 5))
          done
          [ "$ok" = "1" ] || { echo "::error title=Commit::push impossible"; exit 1; }
