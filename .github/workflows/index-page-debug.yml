name: Index — diagnostic d'affichage d'une page (lecture seule)

# Ouvre une page publique de l'Index dans un vrai navigateur et affiche les erreurs JavaScript de la console, pour comprendre un ecran blanc.
on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Adresse de la page (app.marketforge.fr uniquement)'
        required: true
        default: 'https://app.marketforge.fr/docs/answers-with-dr-j-test-index-index'

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Ouvrir la page et lire la console
        env:
          PAGE: ${{ inputs.url }}
        run: |
          case "$PAGE" in https://app.marketforge.fr/*|https://index.cugnetslist.org/*) ;; *) echo "adresse non autorisee"; exit 1;; esac
          for slug in answers-with-dr-j-index answers-with-dr-j-test-index-index answers-with-dr-j; do
            for u in "https://index.cugnetslist.org/docs/$slug/how-does-the-cash-flow-statement-differ-from-the-income-statement-in-what-it-measures"; do
              echo "CURL $slug : $(curl -s -m 30 -o /dev/null -w '%{http_code} -> %{redirect_url}' -H 'X-Inertia: true' -H 'X-Requested-With: XMLHttpRequest' "$u")"; sleep 3
            done
          done
          echo "CURL page propre : $(curl -s -m 30 -o /dev/null -w '%{http_code}' https://index.cugnetslist.org/how-does-the-cash-flow-statement-differ-from-the-income-statement-in-what-it-measures)"
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i playwright@1.49.1 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > run.js <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const b = await chromium.launch(); const p = await b.newPage();
            p.on('console', m => { if (['error','warning'].includes(m.type())) console.log('CONSOLE', m.type(), m.text().slice(0, 400)); });
            p.on('pageerror', e => console.log('PAGEERROR', String(e.message || e).slice(0, 600)));
            p.on('requestfailed', r => console.log('REQFAILED', r.url().slice(0, 160), r.failure() && r.failure().errorText));
            p.on('response', r => { if (r.status() >= 400) console.log('HTTP', r.status(), r.url().slice(0, 160)); });
            await p.goto(process.env.PAGE, { waitUntil: 'networkidle', timeout: 45000 }).catch(e => console.log('GOTO', e.message));
            await p.waitForTimeout(3000);
            const t = await p.evaluate(() => document.body.innerText.trim().length);
            console.log('TEXTLEN', t);
            console.log('TITLE', await p.title());
            console.log('ROOTHTML', (await p.evaluate(() => (document.getElementById('app') || document.body).innerHTML.length)));
            // Clic sur les liens du menu lateral (navigation interne) et lecture des reponses reseau
            const links = await p.evaluate(() => Array.from(document.querySelectorAll('a[href]')).map(a => a.getAttribute('href')).filter(h => h && !h.startsWith('#')).slice(0, 14));
            console.log('LIENS', JSON.stringify(links));
            p.on('request', r => { if (r.resourceType() === 'xhr' || r.resourceType() === 'fetch') console.log('XHR', r.method(), r.url().slice(0, 200), JSON.stringify(Object.fromEntries(Object.entries(r.headers()).filter(([k]) => /inertia/i.test(k))))); });
            for (const h of links.slice(0, 6)) {
              const sel = 'a[href="' + h + '"]';
              try { await p.click(sel, { timeout: 5000 }); await p.waitForTimeout(2500);
                const modal = await p.evaluate(() => { const f = document.querySelector('iframe'); return f ? 'MODAL_IFRAME' : 'ok'; });
                console.log('CLIC', h, '->', p.url(), modal);
              } catch (e) { console.log('CLIC_ERR', h, e.message.slice(0, 100)); }
            }
            await b.close();
          })();
          JS
          node run.js
