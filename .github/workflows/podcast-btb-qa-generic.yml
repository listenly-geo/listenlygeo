name: Podcast BTB Trafic — Générique (piloté par inputs)

on:
  workflow_dispatch:
    inputs:
      podcast_slug:
        description: 'Slug du podcast (doit déjà exister dans podcasts.json via le Moteur N1)'
        required: true
        type: string
      language:
        description: 'Langue de génération de la fiche'
        required: false
        type: choice
        default: auto
        options:
          - auto
          - fr
          - en

jobs:
  podcast-btb-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer ffmpeg (necessaire pour compression audio Whisper)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Generation 1 fiche question
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PODCAST_SLUG: ${{ inputs.podcast_slug }}
          LANGUAGE_OVERRIDE: ${{ inputs.language == 'auto' && '' || inputs.language }}
        run: python automation/scripts/generate_qa_fiches_btb.py

      - name: Commit fiches
        run: |
          git config user.name  "listenly-bot"
          git config user.email "bot@listenly.fr"
          git pull --rebase --autostash origin main
          git add pages/podcast-btb/
          if git diff --staged --quiet; then
            echo "Rien de nouveau."
          else
            git commit -m "Auto: podcast-btb-qa ${{ inputs.podcast_slug }}"
            git push
          fi

      - name: Deploy FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:    ${{ secrets.FTP_SERVER }}
          username:  ${{ secrets.FTP_USERNAME }}
          password:  ${{ secrets.FTP_PASSWORD }}
          local-dir: ./pages/podcast-btb/
          server-dir: /listenly.fr/podcast-btb/
          exclude: |
            **/.git*
            **/.git*/**
            **/.gitkeep
