name: "alors-cest-pour-quand-podcast — N1 + N2 auto"

on:
  schedule:
    - cron: '30 12 * * 3,6'
  workflow_dispatch:
    inputs:
      max_new:
        description: 'Nb fiches episode a generer'
        required: false
        default: '1'
      seed_only:
        description: 'true = amorcage sans generation'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:

  fiche-n1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generation fiche N1 si absente
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PODCAST_SLUG: alors-cest-pour-quand-podcast
          SPOTIFY_SHOW_URL: https://open.spotify.com/show/7Frc22wd3nb87AeG294f20
          PODCAST_IMAGE_URL: https://i.postimg.cc/MKTC2wt0/1900x1900-000000-80-0-0.jpg
          LISTENLY_SHOW_URL: https://listenly.fr/podcast/show/alors-cest-pour-quand
          PLAUSIBLE_DOMAIN: listenly.fr
          PODCAST_RAW_INFO: |
            Alors, c"est pour quand ?! Salut, moi c’est Octavia. Dans le podcast « Alors c’est pour quand ?! », on parle de parentalité… et surtout des injonctions qui l’entourent. Celles qui nous demandent sans cesse si on veut, si on peut, si on doit avoir des enfants. Je m’adresse aux indécis·es, à celleux qui ne désirent pas, à celleux qui n’ont pas pu, à celleux qui ont fait différemment ou qui avancent seul·es. À 38 ans, sans enfant, j’ai moi aussi entendu les fameux : « tu changeras d’avis », « tu regretteras », « c’est maintenant ou jamais ». Comme beaucoup de femmes, j’ai ressenti le poids des pr
        run: python automation/scripts/generate_n1.py
      - name: Commit fiche N1
        run: |
          git config user.name "listenly-bot"
          git config user.email "bot@listenly.fr"
          git pull --rebase --autostash origin main
          git add pages/
          if git diff --staged --quiet; then
            echo "N1 deja presente."
          else
            git commit -m "Auto: fiche N1 alors-cest-pour-quand-podcast"
            git push
          fi
      - name: Deploy FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./pages/
          server-dir: /listenly.fr/fiche-geo-ia/
          exclude: |
            **/.git*
            **/.git*/**
            **/.gitkeep

  fiches-n2:
    runs-on: ubuntu-latest
    needs: fiche-n1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generation fiches episodes N2
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RSS_URL: https://feed.ausha.co/1082zT1NGZmv
          PODCAST_SLUG: alors-cest-pour-quand-podcast
          SPOTIFY_SHOW_URL: https://open.spotify.com/show/7Frc22wd3nb87AeG294f20
          CTA_URL: https://listenly.fr/podcast/show/alors-cest-pour-quand
          CTA_LABEL: Ecouter le podcast
          PODCAST_IMAGE_URL: https://i.postimg.cc/MKTC2wt0/1900x1900-000000-80-0-0.jpg
          PLAUSIBLE_DOMAIN: listenly.fr
          MAX_NEW_PER_RUN: ${{ github.event.inputs.max_new || '1' }}
          SEED_ONLY: ${{ github.event.inputs.seed_only || 'false' }}
        run: python automation/scripts/generate_episode_fiches.py
      - name: Commit fiches N2
        run: |
          git config user.name "listenly-bot"
          git config user.email "bot@listenly.fr"
          git pull --rebase --autostash origin main
          git add pages/ automation/processed_episodes_alors-cest-pour-quand-podcast.json
          if git diff --staged --quiet; then
            echo "Aucune nouvelle fiche."
          else
            git commit -m "Auto: fiches episodes alors-cest-pour-quand-podcast"
            git push
          fi
      - name: Deploy FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./pages/
          server-dir: /listenly.fr/fiche-geo-ia/
          exclude: |
            **/.git*
            **/.git*/**
            **/.gitkeep
