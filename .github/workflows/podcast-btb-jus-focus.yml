name: Podcast BTB — jus-focus

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 2'

jobs:
  podcast-btb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generation fiche podcast (lancement manuel uniquement)
        if: github.event_name == 'workflow_dispatch'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RSS_URL: |-
            https://feeds.podcastics.com/podcastics/podcasts/rss/6651_cb27268b937e0ad273e50f4238d98874.rss
          PODCAST_URL: |-
            https://open.spotify.com/show/681RPTndhWXmgGKHw0PVjw
          CONTACT_URL: |-
            https://www.linkedin.com/company/sapians.com/posts/?feedView=all
          CONTACT_LABEL: |-
            Contacter Sapians
          LISTENLY_URL: |-
            https://listenly.fr/podcast/show/just-focus-by-sapian
          COVER_IMAGE: |-
            https://i.postimg.cc/MXkstK22/ab67656300005f1ffc8ab2e6cd8347934dcc6e55.jpg
          PODCAST_SLUG: |-
            jus-focus
          ACCENT_COLOR: |-
            #2e8bd6
        run: python automation/scripts/generate_podcast_btb.py

      - name: Generation 1 fiche episode max (cron hebdomadaire uniquement, jamais au lancement manuel)
        if: github.event_name == 'schedule'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PODCAST_SLUG: |-
            jus-focus
          MAX_EPISODES: '1'
        run: python automation/scripts/generate_episode_fiches_btb.py

      - name: Commit fiches
        run: |
          git config user.name  "listenly-bot"
          git config user.email "bot@listenly.fr"
          git pull --rebase --autostash origin main
          git add pages/podcast-btb/
          if git diff --staged --quiet; then
            echo "Rien de nouveau."
          else
            git commit -m "Auto: podcast-btb jus-focus"
            git push
          fi

      - name: Deploy FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:    ${{ secrets.FTP_SERVER }}
          username:  ${{ secrets.FTP_USERNAME }}
          password:  ${{ secrets.FTP_PASSWORD }}
          local-dir: ./pages/podcast-btb/
          server-dir: /listenly.fr/podcast-btb/
          exclude: |
            **/.git*
            **/.git*/**
            **/.gitkeep
