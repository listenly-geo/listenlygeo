name: Moments connus — extraction quotidienne (podcasts niveau A)

# Pipeline SEPARE de MarketForge : extrait de vraies Q/R des episodes des podcasts connus (niveau A)
# pour le SCORING MOMENT SYSTEM de listenly.org. Debit : automation/moments_connus/config.json (20 episodes/jour).
# N'ecrit jamais dans la file, le reservoir ni les stats de prospection de MarketForge.
on:
  workflow_dispatch:
    inputs:
      episodes_par_jour:
        description: 'Surcharge ponctuelle du debit (vide = config.json)'
        required: false
        default: ''
      dry_run:
        description: 'true = planifie seulement, aucune extraction ni commit'
        required: false
        default: 'false'
  schedule:
    - cron: '17 1 * * *'   # 02h17 Paris : une passe par jour, hors des heures de pointe du moteur MarketForge

permissions:
  contents: write

concurrency:
  group: moments-connus
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer ffmpeg
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            echo "ffmpeg deja present"
          else
            export DEBIAN_FRONTEND=noninteractive
            for i in 1 2 3 4 5; do
              sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && break
              sleep 10
            done
          fi

      - name: Extraire les moments des podcasts connus
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          KNOWLEDGE_IMPORT_SECRET: ${{ secrets.KNOWLEDGE_IMPORT_SECRET }}
          EPISODES_PAR_JOUR: ${{ github.event.inputs.episodes_par_jour }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: python automation/scripts/connus_extract_queue.py

      - name: Lecteur de moments (index + adresses d'episodes)
        if: always() && github.event.inputs.dry_run != 'true'
        continue-on-error: true
        run: python automation/scripts/moments_index.py

      - name: Commit file d'attente + knowledge moments
        if: always() && github.event.inputs.dry_run != 'true'
        run: |
          git config user.name  "listenly-bot"
          git config user.email "bot@listenly.fr"
          git add automation/moments_connus/ automation/inbox/moteur-trafic-transcripts/ pages/podcast-btb/data/
          if git diff --staged --quiet; then
            echo "Rien de nouveau."
          else
            git commit -m "Auto: Moments connus — extraction du jour"
            for i in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main && git push && break
              git rebase --abort 2>/dev/null || true
              sleep $((RANDOM % 15 + 5))
            done
          fi
