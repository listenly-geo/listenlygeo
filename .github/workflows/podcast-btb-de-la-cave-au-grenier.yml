name: Podcast BTB — de-la-cave-au-grenier

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 3'

jobs:
  podcast-btb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generation fiche podcast (lancement manuel uniquement)
        if: github.event_name == 'workflow_dispatch'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RSS_URL: |-
            https://feed.ausha.co/Ogd6EtWXPDgr
          PODCAST_URL: |-
            https://podcasts.apple.com/us/podcast/de-la-cave-au-grenier/id1811342104
          LISTENLY_URL: |-
            https://i.postimg.cc/BnvfNfHL/5x1c-Oneyzd-LFjxjq-FIi2q-I0X0Vr-Ezs-Ty0Jmc5H9G-400x400.jpg
          COVER_IMAGE: |-
            https://i.postimg.cc/BnvfNfHL/5x1c-Oneyzd-LFjxjq-FIi2q-I0X0Vr-Ezs-Ty0Jmc5H9G-400x400.jpg
          PODCAST_SLUG: |-
            de-la-cave-au-grenier
          ACCENT_COLOR: |-
            #2e8bd6
          LANGUAGE: |-
            fr
          EPISODE_CTA_TARGET: |-
            listenly
        run: python automation/scripts/generate_podcast_btb.py

      - name: Generation 1 fiche episode max (cron hebdomadaire uniquement)
        if: github.event_name == 'schedule'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PODCAST_SLUG: |-
            de-la-cave-au-grenier
          MAX_EPISODES: '1'
        run: python automation/scripts/generate_episode_fiches_btb.py

      - name: Commit fiches
        run: |
          git config user.name  "listenly-bot"
          git config user.email "bot@listenly.fr"
          git pull --rebase --autostash origin main
          git add pages/podcast-btb/
          if git diff --staged --quiet; then
            echo "Rien de nouveau."
          else
            git commit -m "Auto: podcast-btb de-la-cave-au-grenier"
            git push
          fi

      - name: Deploy FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:    ${{ secrets.FTP_SERVER }}
          username:  ${{ secrets.FTP_USERNAME }}
          password:  ${{ secrets.FTP_PASSWORD }}
          local-dir: ./pages/podcast-btb/
          server-dir: /listenly.fr/podcast-btb/
          exclude: |
            **/.git*
            **/.git*/**
            **/.gitkeep
