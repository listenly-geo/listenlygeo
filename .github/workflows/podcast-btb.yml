name: Fiche Podcast-BTB

on:
  workflow_dispatch:
    inputs:
      podcast_raw_info:
        description: 'Contenu brut (RSS collé, description, titres épisodes...)'
        required: true
      podcast_url:
        description: 'Lien Spotify/plateforme (CTA 1)'
        required: true
      contact_url:
        description: 'Lien LinkedIn hôte (CTA 2)'
        required: true
      listenly_url:
        description: 'Lien Listenly (backlink canonical)'
        required: true
      podcast_slug:
        description: 'Slug (optionnel, sinon auto-déduit)'
        required: false
        default: ''
      accent_color:
        description: 'Couleur accent (hex)'
        required: false
        default: '#2e8bd6'
      cover_image:
        description: 'URL image cover (optionnel)'
        required: false
        default: ''
      force_onboard:
        description: 'Ignorer le filtre de pre-qualification GEO (mass-media/concurrence) si REJECT'
        required: false
        default: 'false'

jobs:
  fiche-podcast-btb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Pre-qualification GEO (mass-media / concurrence documentaire)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PODCAST_RAW_INFO:  ${{ github.event.inputs.podcast_raw_info }}
          PODCAST_URL:       ${{ github.event.inputs.podcast_url }}
          FORCE_ONBOARD:     ${{ github.event.inputs.force_onboard }}
        run: python automation/scripts/check_podcast_qualification.py

      - name: Génération fiche podcast-btb
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PODCAST_RAW_INFO: ${{ github.event.inputs.podcast_raw_info }}
          PODCAST_URL:      ${{ github.event.inputs.podcast_url }}
          CONTACT_URL:      ${{ github.event.inputs.contact_url }}
          LISTENLY_URL:     ${{ github.event.inputs.listenly_url }}
          PODCAST_SLUG:     ${{ github.event.inputs.podcast_slug }}
          ACCENT_COLOR:     ${{ github.event.inputs.accent_color }}
          COVER_IMAGE:      ${{ github.event.inputs.cover_image }}
        run: python automation/scripts/generate_podcast_btb.py

      - name: Commit fiche
        run: |
          git config user.name  "listenly-bot"
          git config user.email "bot@listenly.fr"
          git pull --rebase --autostash origin main
          git add pages/podcast-btb/
          if git diff --staged --quiet; then
            echo "Aucune nouvelle fiche."
          else
            git commit -m "Auto: fiche podcast-btb"
            git push
          fi

      - name: Deploy FTP → /podcast-btb/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:    ${{ secrets.FTP_SERVER }}
          username:  ${{ secrets.FTP_USERNAME }}
          password:  ${{ secrets.FTP_PASSWORD }}
          local-dir: ./pages/podcast-btb/
          server-dir: /listenly.fr/podcast-btb/
          exclude: |
            **/.git*
            **/.git*/**
            **/.gitkeep
