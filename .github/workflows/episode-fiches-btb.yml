name: Episode Fiches BTB

on:
  workflow_dispatch:
    inputs:
      podcast_slug:
        description: 'Slug du podcast (déjà présent dans podcasts.json)'
        required: true
      rss_url:
        description: 'URL RSS (optionnel, sinon celle stockée dans podcasts.json)'
        required: false
        default: ''
      max_episodes:
        description: 'Nombre max de nouveaux épisodes à traiter'
        required: false
        default: '3'

jobs:
  episode-fiches-btb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Génération fiches épisode
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PODCAST_SLUG: ${{ github.event.inputs.podcast_slug }}
          RSS_URL: ${{ github.event.inputs.rss_url }}
          MAX_EPISODES: ${{ github.event.inputs.max_episodes }}
        run: python automation/scripts/generate_episode_fiches_btb.py

      - name: Commit fiches
        run: |
          git config user.name  "listenly-bot"
          git config user.email "bot@listenly.fr"
          git pull --rebase --autostash origin main
          git add pages/podcast-btb/
          if git diff --staged --quiet; then
            echo "Aucun nouvel episode."
          else
            git commit -m "Auto: episodes podcast-btb ${{ github.event.inputs.podcast_slug }}"
            git push
          fi

      - name: Deploy FTP → /podcast-btb/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:    ${{ secrets.FTP_SERVER }}
          username:  ${{ secrets.FTP_USERNAME }}
          password:  ${{ secrets.FTP_PASSWORD }}
          local-dir: ./pages/podcast-btb/
          server-dir: /listenly.fr/podcast-btb/
          exclude: |
            **/.git*
            **/.git*/**
            **/.gitkeep
