<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Listen to the answer — Listenly</title>
<meta name="robots" content="noindex, follow">
<meta name="description" content="Listen to the exact moment an expert answers this question, on Listenly.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23000'/%3E%3Crect x='6' y='9' width='2.5' height='6' rx='1' fill='%23fff'/%3E%3Crect x='11' y='6' width='2.5' height='12' rx='1' fill='%23fff'/%3E%3Crect x='16' y='9' width='2.5' height='6' rx='1' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000; --panel:#1C1C1E; --panel-hover:#2C2C2E; --ink:#F5F5F7; --ink-soft:#86868B;
    --line:rgba(255,255,255,0.12); --line-soft:rgba(255,255,255,0.08); --accent:#2997FF;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--bg); color:var(--ink); min-height:100vh; -webkit-font-smoothing:antialiased;
    font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter',system-ui,sans-serif;
  }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  a{ color:var(--accent); text-decoration:none; }
  a:hover{ opacity:.8; }
  .glow{ position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
  .glow i{ position:absolute; border-radius:50%; filter:blur(90px); }
  .glow i:nth-child(1){ width:420px; height:420px; top:-260px; left:-10%; background:rgba(255,255,255,.22); }
  .glow i:nth-child(2){ width:360px; height:360px; bottom:-260px; right:-8%; background:rgba(255,255,255,.16); }
  .wrap{ position:relative; z-index:1; max-width:680px; margin:0 auto; padding:22px 20px 80px; }
  .top{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:34px; font-size:14px; }
  .brand{ display:flex; align-items:center; gap:9px; color:var(--ink); font-weight:600; letter-spacing:-.01em; }
  .brand svg{ display:block; }
  .back{ color:var(--ink-soft); }
  .back:hover{ color:var(--ink); opacity:1; }

  .moment{ display:none; }
  .moment.on{ display:block; }
  .eyebrow{ font-size:13px; color:var(--ink-soft); margin:0 0 10px; }
  h1{ font-size:clamp(25px,4.4vw,36px); line-height:1.18; letter-spacing:-.02em; font-weight:650; margin:0 0 14px; }
  .source{ font-size:14px; color:var(--ink-soft); margin:0 0 22px; line-height:1.5; }
  .source strong{ color:var(--ink); font-weight:500; }

  .player{ background:var(--panel); border:1px solid var(--line-soft); border-radius:20px; padding:18px 18px 16px; }
  .player-row{ display:flex; align-items:center; gap:14px; }
  .bigplay{
    flex:none; width:58px; height:58px; border-radius:50%; border:none; cursor:pointer; background:var(--ink); color:#000;
    display:flex; align-items:center; justify-content:center; transition:transform .12s, opacity .12s;
  }
  .bigplay:hover{ opacity:.88; } .bigplay:active{ transform:scale(.95); }
  .bigplay svg{ display:block; }
  .p-info{ min-width:0; }
  .p-title{ font-size:15px; font-weight:600; line-height:1.3; }
  .p-sub{ font-size:13px; color:var(--ink-soft); margin-top:2px; }
  audio{ width:100%; height:36px; margin-top:14px; filter:invert(1) grayscale(1) contrast(1.1); }
  .note{ font-size:12.5px; color:var(--ink-soft); margin:12px 2px 0; line-height:1.5; }
  .note.err{ color:#ff9f0a; }

  .answer{ font-size:16px; line-height:1.65; color:#d2d2d7; margin:24px 0 0; }
  .links{ display:flex; flex-wrap:wrap; gap:10px; margin-top:22px; }
  .pill{
    display:inline-flex; align-items:center; gap:6px; font-size:13.5px; font-weight:500; padding:9px 16px;
    border:1px solid var(--line); border-radius:999px; color:var(--ink); background:transparent;
  }
  .pill:hover{ background:var(--panel); opacity:1; }

  h2{ font-size:19px; font-weight:650; letter-spacing:-.01em; margin:42px 0 6px; }
  .h2sub{ font-size:14px; color:var(--ink-soft); margin:0 0 14px; }
  .more{ display:flex; flex-direction:column; gap:8px; }
  .more button{
    text-align:left; width:100%; font:inherit; font-size:14.5px; line-height:1.4; color:var(--ink); cursor:pointer;
    background:var(--panel); border:1px solid var(--line-soft); border-radius:14px; padding:13px 16px; transition:background .15s;
  }
  .more button:hover{ background:var(--panel-hover); }
  .more button span{ display:block; font-size:12.5px; color:var(--ink-soft); margin-top:3px; }

  .search-shell{ background:var(--panel); border:1px solid var(--line-soft); border-radius:20px; overflow:hidden; margin-top:6px; }
  .search-box{ display:flex; align-items:center; gap:10px; padding:6px 6px 6px 18px; }
  .search-box svg{ flex:none; color:var(--ink-soft); }
  .search-box input{ flex:1; min-width:0; background:none; border:none; outline:none; color:var(--ink); font:inherit; font-size:16px; padding:14px 0; }
  .search-box input::placeholder{ color:var(--ink-soft); }
  .search-box button{
    flex:none; height:40px; padding:0 20px; border-radius:999px; border:none; background:var(--ink); color:#000;
    font:inherit; font-size:14.5px; font-weight:600; cursor:pointer;
  }
  .search-box button:disabled{ background:var(--panel-hover); color:var(--ink-soft); cursor:default; }
  .results{ margin-top:6px; }
  .state{ text-align:center; color:var(--ink-soft); font-size:14.5px; padding:28px 0; }
  .rcard{ background:var(--panel); border:1px solid var(--line-soft); border-radius:16px; padding:20px; margin-top:12px; }
  .rcard .q{ font-size:16.5px; font-weight:600; line-height:1.4; margin:0 0 8px; }
  .rcard .x{ font-size:14px; line-height:1.6; color:var(--ink-soft); margin:0 0 14px; }
  .rcard .m{ display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; }
  .rcard .s{ font-size:13px; color:var(--ink-soft); }
  .rcard .s strong{ color:var(--ink); font-weight:500; }
  .rcard button{ background:none; border:none; padding:0; color:var(--accent); font:inherit; font-size:13.5px; font-weight:500; cursor:pointer; }
  .rcard button:hover{ opacity:.75; }
  .empty{ text-align:center; padding:70px 0 30px; }
  .empty h1{ font-size:26px; }
  .empty p{ color:var(--ink-soft); font-size:15px; }
  @media (max-width:560px){ .wrap{ padding:16px 16px 70px; } .bigplay{ width:52px; height:52px; } }
</style>
</head>
<body>
<div class="glow"><i></i><i></i></div>
<div class="wrap">
  <div class="top">
    <a class="brand" href="https://listenly.fr">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="6" fill="#fff"/><rect x="6" y="9" width="2.5" height="6" rx="1" fill="#000"/><rect x="11" y="6" width="2.5" height="12" rx="1" fill="#000"/><rect x="16" y="9" width="2.5" height="6" rx="1" fill="#000"/></svg>
      Listenly
    </a>
    <a class="back" id="backLink" href="https://listenly.fr" hidden>← All answers</a>
  </div>

  <main>
    <section class="moment" id="moment" aria-live="polite">
      <p class="eyebrow" id="eyebrow">Answer from a podcast</p>
      <h1 id="question"></h1>
      <p class="source" id="source"></p>

      <div class="player">
        <div class="player-row">
          <button class="bigplay" id="bigPlay" type="button" aria-label="Play">
            <svg id="icoPlay" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>
            <svg id="icoPause" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="6" y="5" width="4.5" height="14" rx="1.2"/><rect x="13.5" y="5" width="4.5" height="14" rx="1.2"/></svg>
          </button>
          <div class="p-info">
            <div class="p-title" id="pTitle"></div>
            <div class="p-sub" id="pSub"></div>
          </div>
        </div>
        <audio id="au" controls preload="metadata"></audio>
        <p class="note" id="note" hidden></p>
      </div>

      <p class="answer" id="answer" hidden></p>
      <div class="links" id="links"></div>
    </section>

    <section class="moment" id="more">
      <h2>More answers from this episode</h2>
      <p class="h2sub" id="moreSub"></p>
      <div class="more" id="moreList"></div>
    </section>

    <section class="empty moment" id="empty">
      <h1>This answer is no longer available</h1>
      <p>Search any question below — an expert has probably answered it.</p>
    </section>

    <section id="searchSection">
      <h2>Ask anything</h2>
      <p class="h2sub">Search across podcasts and go straight to the moment an expert answers.</p>
      <div class="search-shell">
        <form class="search-box" id="searchForm">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="searchInput" placeholder="How do I find my first customers?" autocomplete="off" maxlength="240" aria-label="Ask a question">
          <button type="submit" id="searchBtn">Search</button>
        </form>
      </div>
      <div class="results" id="results"></div>
    </section>
  </main>
</div>

<script>
(function(){
  'use strict';
  var SEARCH_ENDPOINT = 'https://listenly.fr/api/listenly-search.php';
  var $ = function(id){ return document.getElementById(id); };
  var au = $('au'), bigPlay = $('bigPlay'), note = $('note');
  var data = null, current = null, currentId = null;

  function track(name){ try { if (window.plausible) window.plausible(name); } catch(e){} }
  function fmt(s){ s = Math.max(0, Math.floor(s||0)); var h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60;
    return h ? h+':'+String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0') : m+':'+String(sec).padStart(2,'0'); }
  function safeAudio(url){
    try {
      var u = new URL(url, location.href);
      if (u.protocol !== 'https:' && u.protocol !== 'http:') return '';
      if (location.protocol === 'https:' && u.protocol === 'http:') u.protocol = 'https:';
      return u.href;
    } catch(e){ return ''; }
  }
  function safeListenly(url){ return /^https:\/\/listenly\.fr\//.test(url || '') ? url : ''; }
  function el(tag, cls, text){ var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
  function show(id, on){ $(id).classList.toggle('on', !!on); }
  function setNote(text, err){ if (!text){ note.hidden = true; return; } note.hidden = false; note.textContent = text; note.className = 'note' + (err ? ' err' : ''); }
  function syncIcon(){ var playing = !au.paused && !au.ended; $('icoPlay').style.display = playing ? 'none' : ''; $('icoPause').style.display = playing ? '' : 'none'; bigPlay.setAttribute('aria-label', playing ? 'Pause' : 'Play'); }

  // ---- affichage d'un moment (moment du hub ou resultat de recherche) ----
  // v = {q, a, x (expert), e (episode), p (podcast), u (audio), t (secondes), ap (approx), l (page episode Listenly), hub, id}
  function showMoment(v, autoplay){
    current = v;
    var url = safeAudio(v.u);
    $('eyebrow').textContent = v.p ? 'Answer from ' + v.p : 'Answer from a podcast';
    $('question').textContent = v.q;
    var src = $('source'); src.textContent = '';
    if (v.x){ src.appendChild(el('strong', null, v.x)); src.appendChild(document.createTextNode(' in ')); }
    src.appendChild(document.createTextNode(v.e || v.p || ''));
    $('pTitle').textContent = v.e || v.p || '';
    $('pSub').textContent = v.ap ? 'The answer is somewhere in this episode' : 'Starts at ' + fmt(v.t);
    var ans = $('answer'); ans.hidden = !v.a; ans.textContent = v.a || '';
    var links = $('links'); links.textContent = '';
    var lu = safeListenly(v.l);
    if (lu){ var a = el('a', 'pill', 'Full episode on Listenly ↗'); a.href = lu; a.addEventListener('click', function(){ track('Moment Episode Listenly'); }); links.appendChild(a); }
    if (v.hub){ var h = el('a', 'pill', 'All answers from ' + (v.p || 'this podcast')); h.href = v.hub; links.appendChild(h); }
    show('moment', true); show('empty', false);
    setNote(v.ap ? 'Exact timestamp not available for this answer — the episode plays from the start.' : '');
    if (!url){ setNote('This audio source could not be played here.', true); return; }

    var start = v.ap ? 0 : (v.t || 0);
    var seek = function(){ try { if (start && Math.abs(au.currentTime - start) > 2) au.currentTime = start; } catch(e){} };
    au.pause();
    au.removeAttribute('src'); au.load();
    au.onloadedmetadata = seek;
    au.src = url + (start ? '#t=' + start : '');
    au.load();
    if (autoplay){
      var pr = au.play();
      if (pr && pr.catch) pr.catch(function(){ setNote('Tap play to start the answer at ' + fmt(start) + '.'); });
    }
    syncIcon();
    renderMore(v);
  }

  bigPlay.addEventListener('click', function(){ if (au.paused){ var p = au.play(); if (p && p.catch) p.catch(function(){ setNote('This audio could not be played here — open the full episode on Listenly.', true); }); track('Moment Play'); } else au.pause(); });
  ['play','pause','ended'].forEach(function(ev){ au.addEventListener(ev, syncIcon); });
  au.addEventListener('error', function(){ if (au.getAttribute('src')) setNote('This audio could not be played here — open the full episode on Listenly.', true); });

  // ---- autres reponses du meme episode ----
  function renderMore(v){
    var box = $('moreList'); box.textContent = '';
    if (!data || !v.id){ show('more', false); return; }
    var items = Object.keys(data.entries).filter(function(k){ return k !== v.id && data.entries[k].e === v.e && !data.entries[k].ap; }).slice(0, 8);
    if (!items.length){ show('more', false); return; }
    show('more', true);
    $('moreSub').textContent = v.e || '';
    items.forEach(function(k){
      var e = data.entries[k];
      var b = el('button', null, e.q); b.type = 'button';
      b.appendChild(el('span', null, '▶ ' + fmt(e.t)));
      b.addEventListener('click', function(){ openEntry(k, true); window.scrollTo({top: 0, behavior: 'smooth'}); });
      box.appendChild(b);
    });
  }

  function view(k){
    var e = data.entries[k];
    return { id: k, q: e.q, a: e.a, x: e.x, e: e.e, p: data.podcast, u: e.u, t: e.t, ap: !!e.ap, l: e.l || data.show, hub: data.hub };
  }
  function openEntry(k, autoplay){
    if (!data.entries[k]) return false;
    currentId = k;
    try { history.replaceState(null, '', '?p=' + encodeURIComponent(data.slug) + '&m=' + encodeURIComponent(k)); } catch(e){}
    showMoment(view(k), autoplay);
    return true;
  }

  // ---- recherche (moteur existant : api/listenly-search.php) ----
  var form = $('searchForm'), input = $('searchInput'), btn = $('searchBtn'), results = $('results');
  function renderResults(list){
    results.textContent = '';
    if (!list || !list.length){ results.appendChild(el('div', 'state', 'No matching answer found yet. Try rephrasing your question.')); return; }
    list.forEach(function(r){
      var c = el('div', 'rcard');
      c.appendChild(el('p', 'q', r.question));
      if (r.excerpt) c.appendChild(el('p', 'x', r.excerpt));
      var m = el('div', 'm'), s = el('span', 's');
      s.appendChild(el('strong', null, r.expert || 'Unknown')); s.appendChild(document.createTextNode(' on ' + (r.podcast || '')));
      var b = el('button', null, '▶ Listen at ' + fmt(r.start_seconds)); b.type = 'button';
      b.addEventListener('click', function(){
        track('Moment Recherche Play');
        showMoment({ id: null, q: r.question, a: r.excerpt, x: r.expert, e: r.episode, p: r.podcast, u: r.audio_url, t: r.start_seconds || 0, ap: false, l: '', hub: '' }, true);
        $('more').classList.remove('on');
        window.scrollTo({top: 0, behavior: 'smooth'});
      });
      m.appendChild(s); m.appendChild(b); c.appendChild(m); results.appendChild(c);
    });
  }
  form.addEventListener('submit', function(ev){
    ev.preventDefault();
    var q = input.value.trim(); if (!q) return;
    track('Moment Recherche');
    btn.disabled = true; results.textContent = ''; results.appendChild(el('div', 'state', 'Searching across podcasts…'));
    fetch(SEARCH_ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ question: q }) })
      .then(function(r){ return r.json(); })
      .then(function(d){ if (d.error){ results.textContent = ''; results.appendChild(el('div', 'state', 'Something went wrong. Please try again.')); return; } renderResults(d.results); })
      .catch(function(){ results.textContent = ''; results.appendChild(el('div', 'state', 'Could not reach the search service. Please try again.')); })
      .then(function(){ btn.disabled = false; });
  });

  // ---- demarrage : ?p=<podcast>&m=<moment> ----
  var params = new URLSearchParams(location.search);
  var slug = (params.get('p') || '').replace(/[^a-z0-9\-]/gi, '');
  var mid = (params.get('m') || '').replace(/[^a-f0-9]/gi, '');
  if (!slug || !mid){ show('empty', true); return; }
  fetch('data/moments/' + slug + '.json', { cache: 'no-cache' })
    .then(function(r){ if (!r.ok) throw new Error('missing'); return r.json(); })
    .then(function(d){
      data = d;
      var hub = $('backLink'); hub.hidden = false; hub.href = d.hub; hub.textContent = '← All answers from ' + d.podcast;
      if (!openEntry(mid, true)) show('empty', true);
    })
    .catch(function(){ show('empty', true); });
})();
</script>
</body>
</html>
