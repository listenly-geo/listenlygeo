    var x = d3.scaleUtc().domain(d3.extent(parsed, function (p) { return p.d; })).range([m.l, w - m.r]);
    var y = d3.scaleLinear().domain([0, Math.max(10, d3.max(parsed, function (p) { return p.v; }))]).nice().range([h - m.b, m.t]);
    svg.append('g').attr('transform', 'translate(0,' + (h - m.b) + ')').call(d3.axisBottom(x).ticks(5).tickFormat(fmtS))
      .attr('font-size', null).attr('font-family', null).selectAll('text').attr('fill', '#8E8E93');
    svg.append('g').attr('transform', 'translate(' + m.l + ',0)').call(d3.axisLeft(y).ticks(4))
      .attr('font-size', null).attr('font-family', null).selectAll('text').attr('fill', '#8E8E93');
    svg.selectAll('.domain, .tick line').attr('stroke', '#2C2C2E');
    svg.append('path').datum(parsed).attr('fill', '#2997FF').attr('fill-opacity', 0.15)
      .attr('d', d3.area().x(function (p) { return x(p.d); }).y0(h - m.b).y1(function (p) { return y(p.v); }));
    svg.append('path').datum(parsed).attr('fill', 'none').attr('stroke', '#2997FF').attr('stroke-width', 2)
      .attr('stroke-linecap', 'round').attr('stroke-linejoin', 'round')
      .attr('d', d3.line().x(function (p) { return x(p.d); }).y(function (p) { return y(p.v); }));
    svg.selectAll('circle').data(parsed).enter().append('circle')
      .attr('cx', function (p) { return x(p.d); }).attr('cy', function (p) { return y(p.v); })
      .attr('r', 3).attr('fill', '#2997FF');
  }

  function rows() {
    var tb = document.getElementById('rows');
    tb.innerHTML = '';
    DERNIERES.slice(0, 100).forEach(function (r) {
      var tr = document.createElement('tr');
      var a = document.createElement('td');
      if (r.url) {
        var link = document.createElement('a');
        link.href = r.url; link.target = '_blank'; link.rel = 'noopener';
        link.textContent = r.question || '';
        a.appendChild(link);
      } else { a.textContent = r.question || ''; }
      var b = document.createElement('td'); b.textContent = r.podcast || '';
      var c = document.createElement('td'); c.className = 'd';
      c.textContent = r.date ? fmtD(new Date(r.date + 'T00:00:00Z')) : '';
      tr.appendChild(a); tr.appendChild(b); tr.appendChild(c);
      tb.appendChild(tr);
    });
  }

  draw(); rows();
  window.addEventListener('resize', draw);
})();
</script>
</body>
</html>
